  /* ---------- progress persistence (round 21) ----------
     Previously EVERYTHING was from-scratch on every reload -- which chapters had been
     revealed, which day/screen you were on, even which card was in focus -- because
     nothing was ever written to storage. That's fine for a demo you're actively
     clicking through in one sitting, but wrong for the real trip: closing and reopening
     the app (or iOS just evicting the tab from memory, which it does constantly) can't
     be allowed to wipe out revealed chapters or arrival confirmations.
     Only PROGRESS is persisted, not the raw `state` object wholesale -- deliberately
     narrow, for two reasons: (1) a handful of `state` fields are transient UI-only
     (`animating`, `confirming`, `sheetAbout`, `scrollToEnd`) and should always start
     fresh, never resume mid-animation or with a stale sheet/confirm-row still "open";
     (2) chapter CONTENT (DAY1..DAY3) must never be saved, or a stale copy would
     silently shadow any later content edit. Only `state.dayProgress` (per day: current
     chapter index, arrived flag, Info open/closed choices and ticked checklist items,
     all keyed by chapter id) is saved, and it is sanitised against the live content on
     load (unknown ids / out-of-range indexes are dropped), so a chapter added, removed
     or reordered later is picked up correctly and only the progress itself survives.
     Versioned key (`_v1`): bump this if `state`'s or a chapter's saved shape ever
     changes incompatibly, so an old/mismatched saved blob is cleanly ignored instead
     of crashing or half-applying. Wrapped in try/catch throughout -- private
     browsing, storage quota, or a disabled localStorage should degrade to "just don't
     persist", never break the app. */
  var STORAGE_KEY = 'japanSlowlyProgress_v1';
  function saveProgress(){
    try{
      var payload = { guide:state.guide, screen:state.screen, openDay:state.openDay, openStay:state.openStay, stackIndex:state.stackIndex, dayProgress:state.dayProgress };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
    }catch(e){ /* private browsing / quota / disabled -- just don't persist */ }
  }
  function loadProgress(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(!raw) return null;
      var parsed = JSON.parse(raw);
      return (parsed && typeof parsed==='object') ? parsed : null;
    }catch(e){ return null; }
  }

  /* ---------- state ---------- */
  /* screen starts on 'intro' (round 9) -- the big centered splash with the "Start your
     journey" CTA -- rather than dropping straight into the card deck. Tapping the CTA
     morphs into 'home' (see goHome()); tapping the compact hero on 'home' morphs back
     (see goIntro()). Round 21: a saved progress blob (see saveProgress()/loadProgress()
     above) can override screen/openDay/stackIndex/chapter-reveal-state below -- a
     returning visitor resumes exactly where they left off instead of always restarting
     at the intro splash with every chapter re-hidden. */
  var state = { guide:false, screen:'intro', openDay:null, openStay:null, dayProgress:{}, stackIndex:1, confirming:null, scrollToEnd:false, animating:false, sheetAbout:null };
  applyStatuses();
  (function applySavedProgress(){
    var saved = loadProgress();
    if(!saved) return;
    if(saved.dayProgress && typeof saved.dayProgress==='object'){
      Object.keys(DAY_DATA).forEach(function(n){
        var sp = saved.dayProgress[n], d = DAY_DATA[n];
        if(!sp || typeof sp!=='object') return;
        var ids = {}; d.chapters.forEach(function(c){ ids[c.id] = c; });
        var done = (typeof sp.done==='number' && sp.done>=0 && sp.done<d.chapters.length) ? Math.floor(sp.done) : 0;
        var tip = {}, checks = {};
        if(sp.tip && typeof sp.tip==='object') Object.keys(sp.tip).forEach(function(id){ if(ids[id] && typeof sp.tip[id]==='boolean') tip[id] = sp.tip[id]; });
        if(sp.checks && typeof sp.checks==='object') Object.keys(sp.checks).forEach(function(id){
          if(ids[id] && Array.isArray(sp.checks[id])) checks[id] = sp.checks[id].slice(0, (ids[id].checklist ? ids[id].checklist.items.length : 0)).map(function(v){ return !!v; });
          else if(id.indexOf('g:')===0 && ids[id.slice(2)] && Array.isArray(sp.checks[id])) checks[id] = sp.checks[id].slice(0, 30).map(function(v){ return !!v; }); /* Guide Mode tick boxes */
        });
        state.dayProgress[n] = { done:done, arrived:!!sp.arrived, tip:tip, checks:checks };
      });
    }
    if(typeof saved.stackIndex==='number') state.stackIndex = saved.stackIndex;
    if(saved.guide===true){ state.guide = true; applyStatuses(); }
    // openDay/screen only restored together, and only if that day still exists and isn't locked --
    // guards against a stale save pointing at a day that's since been removed or re-locked.
    if(saved.screen==='day' && saved.openDay!=null){
      var d = DAYS.filter(function(x){ return x.n===saved.openDay; })[0];
      if(d && d.status!=='locked'){ state.screen='day'; state.openDay=saved.openDay; }
    } else if(saved.screen==='stayDetail' && saved.openStay!=null){
      var sv = STAYS.filter(function(x){ return x.id===saved.openStay; })[0];
      if(sv && !stayLocked(sv)){ state.screen='stayDetail'; state.openStay=saved.openStay; }
    } else if(saved.screen==='home' || saved.screen==='stays'){
      state.screen = saved.screen;
    }
    // saved.screen==='intro' (or anything else) deliberately falls through and keeps
    // the 'intro' default -- nothing to resume into.
  })();
  var dragState = { startX:0, lastX:0, lastT:0, vx:0, moved:false, active:false, el:null };

  /* stamped once when the app/session loads, standing in for "when content was last
     fetched" -- there's no real backend/persistence in this prototype (see Known Gaps
     in PROJECT-CONTEXT.txt), so this is the closest honest proxy: the app behaves as
     though it fetched fresh content right when it opened. Captured once rather than
     recomputed on every render() so the displayed time doesn't visibly tick forward
     across a single session. */
  var appLoadedAt = new Date();

  function pad2(n){ return (n<10?'0':'')+n; }
  /* "Last update: Today, 13:50" when the timestamp is today (24h time, matching this
     app's other date formatting); just "Yesterday" / "N days ago" with no time for
     anything older -- per spec, older cases don't carry a time. */
  function formatLastUpdate(date){
    var now = new Date();
    var startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var startOfDate = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    var diffDays = Math.round((startOfToday - startOfDate) / 86400000);
    if(diffDays <= 0) return 'Today, '+pad2(date.getHours())+':'+pad2(date.getMinutes());
    if(diffDays === 1) return 'Yesterday';
    return diffDays+' days ago';
  }

  function iconFor(cond){
    if(cond.toLowerCase().indexOf('cloud')>-1){
      return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M7 17h10a3.5 3.5 0 0 0 0-7 5 5 0 0 0-9.6-1.5A4 4 0 0 0 7 17Z"/></svg>';
    }
    return '<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4.2"/><path d="M12 3v2.2M12 18.8V21M21 12h-2.2M5.2 12H3M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5M18.4 18.4l-1.5-1.5M7.1 7.1 5.6 5.6"/></svg>';

  var chevronDown = '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 9l6 6 6-6"/></svg>';
  var chevronRight = '<svg viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M9 6l6 6-6 6"/></svg>';
  /* backArrow (the old "< The Reel" back-button glyph) removed -- the day-detail
     screen now uses a floating .close-fab (X, see its CSS/markup) instead, wired to

  var chevronRightNav = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 5l7 7-7 7"/></svg>';
  var closeIcon = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>';

  function aboutRowHTML(row){
    return '<div class="about-item"><div class="k">'+row[0]+'</div><div class="v">'+row[1]+'</div></div>';
  }

  /* accepts either shape of ch.about: the original flat list of [label,value] rows
     (rendered exactly as before), or a list of named groups ({group, tag, rows}) for
     chapters whose About panel opens into several sub-places -- detected by checking
     whether the first entry itself looks like a [label,value] row (a 2-element array)
     versus a group object. Mixing the two shapes within one chapter's `about` is not
     supported; pick one per chapter.

     A single group (e.g. nightlife's MITSUKI-only panel) still renders plain and
     always-expanded -- there's nothing to choose between. More than one group renders
     as a collapsed, tappable list instead (see wireCommon()'s data-group-toggle
     handler for the "only one open at a time" + scroll-into-view behavior); each row
     needs a stable id to toggle by, built from the chapter id + its index in the list
     so it's unique within the sheet without needing the place name to be unique. */
  function aboutItemsHTML(rows, chId){
    if(!rows || !rows.length) return '';
    var isGrouped = !Array.isArray(rows[0]);
    if(!isGrouped) return rows.map(aboutRowHTML).join('');
    if(rows.length===1){
      var g0 = rows[0];
      return '<div class="about-group">' +
        '<div class="about-group-head"><div class="about-group-title">'+g0.group+'</div>' +
          (g0.tag ? '<div class="about-group-tag">'+g0.tag+'</div>' : '') + '</div>' +
        '<div class="about-group-rows">' + g0.rows.map(aboutRowHTML).join('') + '</div>' +
      '</div>';
    }
    return rows.map(function(g, idx){
      var gid = chId+'::'+idx;
      return '<div class="about-group collapsible" data-group-id="'+gid+'">' +
        '<button class="about-group-toggle" data-group-toggle="'+gid+'" aria-expanded="false">' +
          '<div class="about-group-title">'+g.group+'</div>' +
          '<div class="about-group-headright">' +
            (g.tag ? '<div class="about-group-tag">'+g.tag+'</div>' : '') +
            '<div class="about-group-caret">'+chevronRight+'</div>' +
          '</div>' +
        '</button>' +
        '<div class="about-group-collapse">' +
          '<div class="about-group-rows">' + g.rows.map(aboutRowHTML).join('') + '</div>' +
        '</div>' +
      '</div>';
    }).join('');
  }

  /* finds the chapter data for whichever day is currently open, so the sheet can look
     up its content purely from state.sheetAbout (an id) without the caller having to
     thread the chapter object through. Only ever meaningful while state.screen==='day'. */
  /* shared bottom-sheet shell (backdrop/panel/handle/header/body) -- factored out so
     the Stays detail sheet can reuse the exact same markup, drag-to-dismiss and
     transition wiring as the day-chapter About sheet instead of duplicating it. */
  function sheetShell(title, bodyHTML){
    return '' +
    '<div class="sheet-backdrop" data-sheet-close></div>' +
    '<div class="sheet-panel" role="dialog" aria-modal="true" aria-label="'+title+'">' +
      '<div class="sheet-handle"></div>' +
      /* iOS-style bar: close (X) on the left, title centered -- see .sheet-header's
         3-column grid for how the centering actually works regardless of title length. */
      '<div class="sheet-header">' +
        '<button class="sheet-close" data-sheet-close aria-label="Close">'+closeIcon+'</button>' +
        '<div class="sheet-title">'+title+'</div>' +
      '</div>' +
      '<div class="sheet-body">' + bodyHTML + '</div>' +
    '</div>';
  }

  /* Stay detail (round 31): slides up from the bottom over the Stays grid and slides back
     down on close (no flip/zoom). One card per stay: hotel name, address, Directions pill,
     About pills, then the details. Content is in STAY_CARDS (below DAY_DATA):
       address, maps [[label,url]], chips [{label, rows}] (each opens the About sheet),
       fields [[title,text]], lists [{title, items}] */
  function stayCardHTML(st){
    var c = STAY_CARDS[st.id] || {};
    var body = '<span class="dc-pill onway">Your stay</span><div class="dc-title">'+escH(st.hotel)+'</div>';
    if(c.address) body += '<div class="dc-blurb">'+escH(c.address)+'</div>';
    if(c.maps) body += '<div class="dc-chips">'+dcMapsChips(c.maps)+'</div>';
    if(c.chips && c.chips.length) body += '<div class="dc-chips">' + c.chips.map(function(ch, ci){ return '<button class="dc-chip" data-dc-open="stay|c'+ci+'">'+escH(ch.label)+'</button>'; }).join('') + '</div>';
    var below = '';
    (c.fields||[]).forEach(function(f){ below += dcField(f[0], escH(f[1])); });
    (c.lists||[]).forEach(function(l){ below += dcBullets(l.title, l.items.map(function(t){ return '<li>'+escH(t)+'</li>'; })); });
    if(below) body += '<div class="dc-divider"></div>' + below;
    return '<div class="dc-card" data-dc-card="stay"><div class="dc-card-body">'+body+'</div></div>';
  }
  function staySlideHTML(st){
    return '<div class="view view-day view-daycards stay-slide'+(state.staySlideNew ? '' : ' open')+'">' +
      '<button class="close-fab" data-stay-back aria-label="Close">'+closeIcon+'</button>' +
      '<div class="dayhead"></div>' +
      '<div class="backhero-text"><div class="day-date">'+st.range+'</div>' +
      '<div class="day-title">'+(st.areaName || st.label)+'</div></div>' +
      '<div class="dc-carousel">' + stayCardHTML(st) + '</div>' +
    '</div>';
  }

  /* the bottom-sheet modal itself -- rendered as a sibling of .view (see render()),
     covering half the screen, sliding up from the bottom. Returns '' when closed so
     it's simply absent from the DOM rather than hidden. Used for a day-chapter's About
     panel (state.sheetAbout holds the chapter id, looked up via currentDayData()) --
     round 24: the Stays detail view no longer goes through this sheet at all, it fully
     opens instead (see stayDetailScreen()/openStayFlip()/closeStayFlip()), so the old
     'stay:'-prefixed branch here is gone; sheetShell()/stayAboutHTML() are still shared
     with stayDetailScreen() though, just called directly rather than through this id. */
  function sheetHTML(){
    if(state.sheetAbout && state.screen==='stayDetail'){
      var sst = STAYS.filter(function(x){ return x.id===state.openStay; })[0];
      var sc = sst ? STAY_CARDS[sst.id] : null;
      var sp = state.sheetAbout.split('|');
      var schip = (sc && sc.chips && sp[1]) ? sc.chips[parseInt(sp[1].slice(1),10)] : null;
      return schip ? sheetShell(schip.label, schip.rows.map(dcRowHTML).join('')) : '';
    }
    if(!state.sheetAbout || state.screen!=='day') return '';
    var day = DAYS.filter(function(d){ return d.n===state.openDay; })[0];
    var dd = dayDataFor(day);
    if(!dd) return '';
    var key = state.sheetAbout;
    if(key==='essential') return sheetShell('Today’s essential info', essentialSheetBody(dd, day.n));
    var parts = key.split('|');
    var ch = dd.chapters.filter(function(c){ return c.id===parts[0]; })[0];
    if(!ch) return '';
    if(parts[1]==='a' && ch.about) return sheetShell(ch.aboutLabel || ch.name, ch.about.map(dcRowHTML).join(''));
    var g = (ch.groups && parts[1] && parts[1].charAt(0)==='g') ? ch.groups[parseInt(parts[1].slice(1),10)] : null;
    return g ? sheetShell(g.name, g.rows.map(dcRowHTML).join('')) : '';
  }

  /* runs the entrance transition after render() has mounted a freshly-opened sheet --
     the panel/backdrop are brand-new DOM nodes each time (render() rebuilds them), so
     this always starts from their closed CSS state (transform/background at 0) and
     needs a forced reflow before adding .open, same pattern used elsewhere in this
     file (see e.g. the FLIP mark-morph) for making a CSS transition actually run
     instead of the browser coalescing the closed+open styles into one paint. */
  function openSheetTransition(){
    var backdrop = document.querySelector('.sheet-backdrop');
    var panel = document.querySelector('.sheet-panel');
    if(!backdrop || !panel) return;
    if(reduceMotion){ backdrop.classList.add('open'); panel.classList.add('open'); return; }
    panel.getBoundingClientRect(); /* force reflow so the transition has a "from" state to animate from */
    requestAnimationFrame(function(){
      backdrop.classList.add('open');
      panel.classList.add('open');
    });
  }

  /* plays the reverse transition, THEN clears state and re-renders -- unlike opening,
     closing can't just flip state and let render() throw the old DOM away, or the
     slide-down/fade-out would never be seen at all. */
  function closeSheet(){
    var backdrop = document.querySelector('.sheet-backdrop');
    var panel = document.querySelector('.sheet-panel');
    if(!panel || reduceMotion){ state.sheetAbout = null; render(); return; }
    backdrop.classList.remove('open');
    panel.classList.remove('open');
    panel.addEventListener('transitionend', function onEnd(ev){
      if(ev.target===panel && ev.propertyName==='transform'){
        panel.removeEventListener('transitionend', onEnd);
        state.sheetAbout = null;
        render();
      }
    });
  }

  /* ---------- drag-to-dismiss on the About sheet ----------
     Lets the sheet be pulled down and let go, like a native iOS/Android sheet, instead
     of only closing via the X button or a backdrop tap. Wired fresh after every render
     that mounts the sheet (see render()'s call site), same as openSheetTransition().

     Drag can start from the handle or header (always -- neither one scrolls), or from
     the body's own content, but ONLY when the body is already scrolled to its very top
     -- otherwise a downward drag starting mid-scroll would fight normal scrolling back
     up to the top instead of ever reaching the sheet itself, which doesn't feel native.
     `pending` below defers that decision until the first real pointermove, since at
     pointerdown time knowing the body is scrolled to 0 doesn't yet tell us which way
     the user is about to drag.

     While a drag is live, both the panel's transform and the backdrop's background are
     driven directly (transition set to 'none' so they track the finger 1:1, exactly the
     technique wireHome()'s card drag already uses) -- on release, transition is handed
     back so the snap-back or the dismiss slide-out both animate, and once that finishes
     every inline override this function set is cleared back to '', letting the normal
     .open/.sheet-panel class rules fully govern the sheet again (the same "clean up
     after yourself" rule the round-4/7 transition:none regression exists to warn about
     applies here just as much). */
  function wireSheetDrag(){
    var panel = document.querySelector('.sheet-panel');
    var backdrop = document.querySelector('.sheet-backdrop');
    if(!panel || !backdrop) return;
    var body = panel.querySelector('.sheet-body');
    var dragEls = [panel.querySelector('.sheet-handle'), panel.querySelector('.sheet-header'), body];

    var drag = null; /* {startY, lastY, lastT, vy, dy, fromBody, pending, committed} while active */

    function panelHeight(){ return panel.getBoundingClientRect().height || 1; }

    function settle(toOpen){
      panel.style.transition = 'transform .32s cubic-bezier(.22,1,.36,1)';
      backdrop.style.transition = 'background .28s ease';
      var onEnd = function(ev){
        if(ev.target!==panel || ev.propertyName!=='transform') return;
        panel.removeEventListener('transitionend', onEnd);
        if(!toOpen){
          state.sheetAbout = null;
          render();
        } else {
          /* snapped back to open -- clear every inline override so the .open class
             rules take over again cleanly, same as before the drag ever started. */
          panel.style.transition = ''; panel.style.transform = '';
          backdrop.style.transition = ''; backdrop.style.background = '';
        }
      };
      panel.addEventListener('transitionend', onEnd);
      requestAnimationFrame(function(){
        panel.style.transform = toOpen ? 'translateY(0)' : 'translateY(100%)';
        backdrop.style.background = toOpen ? 'rgba(0,0,0,.65)' : 'rgba(0,0,0,0)';
      });
    }

    function onDown(e){
      if(e.button!==undefined && e.button!==0) return;
      /* the close button lives inside .sheet-header, one of this function's own drag
         sources -- without this check, tapping it started a (zero-distance) drag that
         captured the pointer to the header, which silently ate the button's own click
         (a captured pointer's subsequent events, including the synthetic click, are
         retargeted to the capturing element instead of the button), so the X stopped
         dismissing the sheet the moment drag-to-dismiss was added. Let it through
         untouched instead. */
      if(e.target.closest && e.target.closest('.sheet-close')) return;
      var fromBody = (e.currentTarget===body);
      drag = {
        startY:e.clientY, lastY:e.clientY, lastT:performance.now(), vy:0, dy:0,
        fromBody:fromBody, pending:fromBody, active:!fromBody, pointerId:e.pointerId, el:e.currentTarget
      };
      if(!fromBody){
        panel.style.transition = 'none';
        backdrop.style.transition = 'none';
        /* captured immediately (unlike the body case below, which only captures once a
           downward drag is confirmed) -- the handle/header never has competing native
           scroll behavior to preserve, so there's no reason to wait. Without this, a
           fast drag that carries the pointer outside the shrinking panel's hit area
           would silently stop delivering pointermove here. */
        try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(err){}
      }
    }
    function beginBodyDrag(){
      if(body.scrollTop>0){ drag = null; return false; }
      drag.pending = false; drag.active = true;
      panel.style.transition = 'none';
      backdrop.style.transition = 'none';
      try{ drag.el.setPointerCapture(drag.pointerId); }catch(err){}
      return true;
    }
    function onMove(e){
      if(!drag || drag.pointerId!==e.pointerId) return;
      var rawDy = e.clientY - drag.startY;
      if(drag.pending){
        if(rawDy <= 0) return; /* only a downward pull from the top of the body starts this */
        if(!beginBodyDrag()) return;
      }
      if(!drag.active) return;
      if(e.cancelable) e.preventDefault();
      /* downward tracks the finger 1:1, same as a native sheet. Upward is now real,
         visible (resisted) movement too -- not floored to 0 -- so the sheet actually
         follows the finger a little instead of feeling stuck/frozen when dragged up;
         capped at -56px so it can't rubber-band further than a native sheet would.
         Either way, releasing net-upward always just snaps back open (see onUp) --
         upward motion can never dismiss it. */
      var dy = rawDy < 0 ? Math.max(rawDy/3, -56) : rawDy;
      var now = performance.now();
      var dt = now - drag.lastT;
      if(dt>0) drag.vy = (e.clientY - drag.lastY)/dt;
      drag.lastY = e.clientY; drag.lastT = now;
      drag.dy = dy;
      panel.style.transform = 'translateY('+dy+'px)';
      /* only downward movement dims the backdrop -- an upward pull stays at full
         darkness (the sheet is still fully "open" from the backdrop's point of view). */
      var openFrac = Math.min(1, Math.max(0, dy) / panelHeight());
      backdrop.style.background = 'rgba(0,0,0,'+(0.65*(1-openFrac)).toFixed(3)+')';
    }
    function onUp(e){
      if(!drag || drag.pointerId!==e.pointerId) return;
      var wasActive = drag.active;
      var dy = Math.max(0, drag.dy);
      var vy = drag.vy;
      drag = null;
      if(!wasActive) return; /* never left "pending" -- e.g. a tap, or an upward scroll gesture */
      var commit = dy > panelHeight()*0.28 || vy > 0.6;
      settle(!commit);
    }

    dragEls.forEach(function(el){
      if(!el) return;
      el.addEventListener('pointerdown', onDown);
    });
    /* move/up listen on the panel itself (not each drag-source element) since
       setPointerCapture during a body-drag targets the body element, but a
       handle/header drag never captures -- listening on the panel covers both, and a
       plain pointermove/pointerup on document would also work but this keeps it
       scoped to the sheet's own DOM. */
    panel.addEventListener('pointermove', onMove);
    panel.addEventListener('pointerup', onUp);
    panel.addEventListener('pointercancel', onUp);
  }

  /* ---------- day cards: the "chapter engine" ----------
     A day with content (DAY_DATA[n], see above) renders as: header, a "Today's essential
     info" pill (opens a sheet), a row of dots (one per chapter reached so far) and ONE
     swipeable card per chapter. Only the chapters reached so far exist as cards, so what
     is still ahead stays a surprise (spoiler protection is UI-only: all copy ships in this
     file for offline use, so it is not a secret against someone reading the source).

     Per-day progress lives in state.dayProgress[n] = {done, arrived, tip, checks}:
       done     index of the current chapter (cards 0..done exist; earlier ones are "visited")
       arrived  whether the CURRENT chapter has had its "I'm here" (chapters with startArrived
                begin arrived); everything place-specific (blurb, place chips) waits for this
       tip      {chapterId: bool} explicit Info-box open/closed choices (absent = default rule)
       checks   {chapterId: [bool]} ticked checklist items
     Journal days (status 'journal') show every chapter as visited. Locked days show no cards.
     Guide Mode is intentionally not built yet; content that differs per role would hang off
     the same chapter objects (e.g. a `directionsGuideOnly` flag) when it is added. */
  function escH(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function dayDataFor(day){ return (day && day.status!=='locked') ? (DAY_DATA[day.n] || null) : null; }
  function dcStartsArrived(ch){ return !!ch && (ch.kind==='essential' || (!state.guide && !!ch.startArrived)); }
  function dayProg(n){
    var d = DAY_DATA[n];
    var p = state.dayProgress[n];
    if(!p){
      p = state.dayProgress[n] = { done:0, arrived: dcStartsArrived(d && d.chapters[0]), tip:{}, checks:{} };
    }
    return p;
  }

  var DC_IC = {
    target:'<path d="M8 1.8a6.2 6.2 0 1 0 0 12.4A6.2 6.2 0 0 0 8 1.8Z"/><circle cx="8" cy="8" r="2.6"/>',
    clock:'<circle cx="8" cy="8" r="6"/><path d="M8 4.6V8.2l2.4 1.5"/>',
    eye:'<path d="M1.4 8C3 4.9 5.2 3.4 8 3.4s5 1.5 6.6 4.6C13 11.1 10.8 12.6 8 12.6S3 11.1 1.4 8Z"/><circle cx="8" cy="8" r="1.7"/>',
    compass:'<circle cx="8" cy="8" r="6"/><path d="M10.2 5.8 8.8 8.8 5.8 10.2 7.2 7.2Z"/>',
    shield:'<path d="M8 1.8 12.8 3.5v4c0 3.2-2.1 5.6-4.8 6.1-2.7-.5-4.8-2.9-4.8-6.1v-4Z"/><path d="M5.8 8 7.2 9.4 10.2 6.3"/>',
    star:'<path d="M8 1.6 9 6l4.4 2L9 10l-1 4.4L7 10 2.6 8 7 6Z"/>',
    bulb:'<path d="M8 1.8a3.9 3.9 0 0 0-2.2 7.1c.5.3.8.9.8 1.5v.4h2.8v-.4c0-.6.3-1.2.8-1.5A3.9 3.9 0 0 0 8 1.8Z"/><path d="M6.6 13.4h2.8M7.1 14.6h1.8"/>',
    cloud:'<path d="M5.6 11.6h6.1a2.5 2.5 0 0 0 .3-5A4 4 0 0 0 4.2 7.4a2.3 2.3 0 0 0 1.4 4.2Z"/>',
    bolt:'<path d="M8.8 1.6 3.8 9h3l-.9 5.4L12.2 7H9.3Z"/>',
    feet:'<ellipse cx="5.6" cy="5.2" rx="1.4" ry="2" transform="rotate(-18 5.6 5.2)"/><ellipse cx="10.4" cy="10.8" rx="1.4" ry="2" transform="rotate(18 10.4 10.8)"/>',
    leaf:'<path d="M13 3C7.5 3 3 7.5 3 13c6 0 10-4.5 10-10Z"/><path d="M3.6 13 9 7.6"/>',
    shirt:'<path d="M5.6 2 8 3.2 10.4 2 13 4.1 11 6V14H5V6L3 4.1Z"/>',
    bag:'<rect x="3" y="5.6" width="10" height="8.4" rx="1.3"/><path d="M6.1 5.6V4.4a1.9 1.9 0 0 1 3.8 0v1.2"/>',
    flag:'<path d="M4 14.2V2"/><path d="M4 2.8 12.2 4.6 4 7Z"/>'
  };
  var DC_LABEL_ICON = {
    'Why it matters':'target', 'A little context':'clock', 'A little history':'clock', 'Look for':'eye',
    'How to experience it':'compass', 'Etiquette':'shield', 'One memorable detail':'star', 'Good to know':'bulb',
    'Weather':'cloud', 'Energy':'bolt', 'Walking':'feet', 'Outside':'leaf', 'Dress':'shirt', 'Bring':'bag', 'First move':'flag'
  };
  function dcIconSvg(key){ return '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+DC_IC[key]+'</svg>'; }
  function dcRowHTML(row){
    var ik = DC_LABEL_ICON[row[0]];
    return '<div class="about-item"><div class="k">'+(ik ? '<span class="dc-kicon">'+dcIconSvg(ik)+'</span>' : '')+escH(row[0])+'</div><div class="v">'+escH(row[1])+'</div></div>';
  }

  var DC_STARS = '<svg class="dc-info-ico" viewBox="0 0 20 20" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M8 3l1.5 4.2L13.7 8.7 9.5 10.2 8 14.4 6.5 10.2 2.3 8.7l4.2-1.5L8 3Z"/><path d="M15 11l.8 2.2 2.2.8-2.2.8L15 17l-.8-2.2L12 14l2.2-.8L15 11Z"/></svg>';
  var DC_CHEV = '<svg class="dc-chev" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 7.5 10 12l4.5-4.5"/></svg>';

  /* ---------- live weather (Open-Meteo, no key, free for personal use) ----------
     The hard-coded `weather` on each day stays as the offline / not-yet-loaded fallback. One
     request per region (Tokyo, Kiso-Fukushima, Kyoto) covers the whole trip (16 days ahead).
     The last good answer is kept in localStorage, so it still shows offline, and it is
     refreshed whenever the phone is online: on open, when the app comes back to the
     foreground, when the connection returns, and every 30 minutes. */
  var WEATHER_KEY = 'japanSlowlyWeather_v1';
  var WEATHER_LOCS = { tokyo:{lat:35.6895, lon:139.6917}, kiso:{lat:35.8437, lon:137.6920}, kyoto:{lat:35.0116, lon:135.7681} };
  var DAY_LOC = { 1:'tokyo', 2:'tokyo', 3:'tokyo', 4:'kiso', 5:'kyoto', 6:'kyoto', 7:'kyoto', 8:'kyoto', 9:'tokyo', 10:'tokyo' };
  var weatherCache = null; /* { t:ms, locs:{ tokyo:{daily,hourly}, ... } } */
  var weatherBusy = false;
  try{ var wraw = localStorage.getItem(WEATHER_KEY); if(wraw){ var wp = JSON.parse(wraw); if(wp && wp.locs && typeof wp.t==='number') weatherCache = wp; } }catch(e){}
  function wmoText(c){
    if(c===0) return 'Clear';
    if(c===1) return 'Mostly clear';
    if(c===2) return 'Partly cloudy';
    if(c===3) return 'Overcast';
    if(c===45 || c===48) return 'Fog';
    if(c>=51 && c<=57) return 'Drizzle';
    if(c>=61 && c<=65) return 'Rain';
    if(c===66 || c===67) return 'Freezing rain';
    if(c>=71 && c<=77) return 'Snow';
    if(c>=80 && c<=82) return 'Showers';
    if(c===85 || c===86) return 'Snow showers';
    if(c>=95) return 'Thunderstorms';
    return 'Mixed';
  }
  function liveWeatherFor(dayN, base){
    if(!weatherCache) return null;
    var loc = weatherCache.locs[DAY_LOC[dayN]];
    if(!loc || !loc.daily || !loc.hourly) return null;
    var key = dayDateKey(dayN);
    var di = loc.daily.time.indexOf(key);
    if(di < 0) return null;
    var lo = Math.round(loc.daily.temperature_2m_min[di]), hi = Math.round(loc.daily.temperature_2m_max[di]);
    var cond = wmoText(loc.daily.weather_code[di]);
    var pr = loc.daily.precipitation_probability_max ? loc.daily.precipitation_probability_max[di] : null;
    if(typeof pr==='number' && pr>=40) cond += ', '+pr+'% chance of rain';
    var prevH = -1, dateKey = key;
    var hourly = base.hourly.map(function(h){
      var hh = parseInt(h[0].slice(0,2), 10);
      if(hh < prevH) dateKey = new Date(Date.UTC(2026, 8, 24 + dayN + 1)).toISOString().slice(0,10);
      prevH = hh;
      var hi2 = loc.hourly.time.indexOf(dateKey+'T'+h[0]);
      return [h[0], hi2>=0 ? Math.round(loc.hourly.temperature_2m[hi2])+'°' : h[1]];
    });
    return { lo:lo, hi:hi, cond:cond, hourly:hourly };
  }
  function refreshWeather(force){
    if(weatherBusy) return;
    if(typeof navigator!=='undefined' && navigator.onLine===false) return;
    if(!force && weatherCache && Date.now() - weatherCache.t < 30*60*1000) return;
    weatherBusy = true;
    var names = Object.keys(WEATHER_LOCS);
    Promise.all(names.map(function(nm){
      var L = WEATHER_LOCS[nm];
      var url = 'https://api.open-meteo.com/v1/forecast?latitude='+L.lat+'&longitude='+L.lon +
        '&hourly=temperature_2m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
        '&timezone=Asia%2FTokyo&forecast_days=16';
      return fetch(url).then(function(r){ if(!r.ok) throw new Error('weather '+r.status); return r.json(); })
        .then(function(j){ return { daily:j.daily, hourly:j.hourly }; });
    })).then(function(results){
      var locs = {};
      names.forEach(function(nm, i){ locs[nm] = results[i]; });
      weatherCache = { t:Date.now(), locs:locs };
      try{ localStorage.setItem(WEATHER_KEY, JSON.stringify(weatherCache)); }catch(e){}
      weatherBusy = false;
      if(state.screen==='day' && !state.animating) render();
    }).catch(function(){ weatherBusy = false; /* offline or blocked: keep whatever is cached */ });
  }

  function essentialSheetBody(d, dayN){
    var live = liveWeatherFor(dayN, d.weather);
    var w = live || d.weather;
    var html = dcRowHTML(['Weather', w.lo+'–'+w.hi+'°, '+w.cond]);
    html += '<div class="dc-hourly">' + w.hourly.map(function(h){
      return '<div><span class="t">'+escH(h[0])+'</span><span class="g">'+escH(h[1])+'</span></div>';
    }).join('') + '</div>';
    [['Energy',d.energy],['Walking',d.walking],['Outside',d.outside],['Dress',d.dress],['Bring',d.bring],['First move',d.first]].forEach(function(r){
      html += dcRowHTML(r);
    });
    html += '<div class="dc-lastupdate">' + (live
      ? 'Live forecast, updated '+formatLastUpdate(new Date(weatherCache.t))
      : 'Typical weather for this time of year. The live forecast loads when you are online.') + '</div>';
    return html;
  }

  function dcField(title, bodyHtml){
    return '<div class="dc-field"><div class="dc-field-title">'+escH(title)+'</div><div class="dc-field-body">'+bodyHtml+'</div></div>';
  }
  function dcBullets(title, items){
    return '<div class="dc-field"><div class="dc-field-title">'+escH(title)+'</div><ul class="dc-bullets">'+items.join('')+'</ul></div>';
  }
  function dcChecklist(ch, p){
    var ticks = p.checks[ch.id] || [];
    return '<div class="dc-field"><div class="dc-field-title">'+escH(ch.checklist.title)+'</div>' +
      ch.checklist.items.map(function(text, idx){
        var on = !!ticks[idx];
        return '<label class="dc-check'+(on?' done':'')+'"><input type="checkbox" data-dc-check="'+escH(ch.id)+'|'+idx+'"'+(on?' checked':'')+'><span>'+escH(text)+'</span></label>';
      }).join('') + '</div>';
  }

  /* Card structure (Marco, 20 Sep):
       LOCKED   pill, title, red label (always visible), then ONE open Info container holding
                everything else: how to unlock, hint, note, booking / timing, tasks (tick boxes),
                good-to-know (bullets), and the Directions links that belong to the locked part.
       UNLOCKED pill, title, red label, the same container folded shut, a dashed separator, then
                the time to spend here (`expect`), a short blurb, and the info chips (places,
                About, `mapsUnlocked` Directions).
     `checklist` is only for real tasks; plain information uses `bullets`. */
  function dcMapsChips(list){
    return list.map(function(m){ return '<a class="dc-chip" href="'+escH(m[1])+'" target="_blank" rel="noopener">'+escH(m[0])+'</a>'; }).join('');
  }
  function dcInfoHTML(ch, p, arrived){
    var parts = [];
    if(!arrived){
      var how = ch.unlock || (ch.gate ? 'Opens at '+ch.gate.time+'.' : 'Head to '+ch.name+'. Once you are there, tap “I’m here”.');
      parts.push(dcField('To unlock', escH(how)));
    }
    if(ch.hint) parts.push('<div class="dc-hint">'+escH(ch.hint)+'</div>');
    if(ch.meta) parts.push(dcField('Note:', escH(ch.meta)));
    if(ch.booking) parts.push(dcBullets(ch.booking.title, ch.booking.rows.map(function(r){ return '<li>'+escH(r[0])+': '+escH(r[1])+'</li>'; })));
    if(ch.timing) parts.push(dcBullets(ch.timing.title, ch.timing.rows.map(function(r){ return '<li>'+escH(r[0])+' '+escH(r[1])+'</li>'; })));
    if(ch.checklist) parts.push(dcChecklist(ch, p));
    if(ch.bullets) parts.push(dcBullets(ch.bullets.title, ch.bullets.items.map(function(t){ return '<li>'+escH(t)+'</li>'; })));
    var maps = ch.maps || (ch.mapsUrl ? [['Directions', ch.mapsUrl]] : []);
    if(maps.length) parts.push('<div class="dc-chips">'+dcMapsChips(maps)+'</div>');
    /* never let the Info container vanish once a card is unlocked: if the only thing in it was the
       "To unlock" line, keep a time reminder instead (the same "how long" the card shows below) */
    if(!parts.length && ch.expect) parts.push(dcField('Timing', escH(ch.expect)));
    if(!parts.length) return '';
    var collapsed = (p.tip[ch.id]!==undefined) ? !!p.tip[ch.id] : arrived;
    return '<div class="dc-info'+(collapsed?'':' open')+'">' +
      '<button class="dc-info-head" data-dc-tip="'+escH(ch.id)+'" aria-expanded="'+(collapsed?'false':'true')+'">' +
        DC_STARS + '<span class="dc-info-label">Info</span>' + DC_CHEV +
      '</button>' +
      (collapsed ? '' : '<div class="dc-info-body">'+parts.join('')+'</div>') +
    '</div>';
  }

  function dcConfirmHTML(kind){
    var text = kind==='here' ? 'Confirm you’ve arrived?' : 'Ready to move on?';
    return '<div class="dc-confirm"><div class="dc-confirm-text">'+text+'</div>' +
      '<div class="dc-confirm-btns"><button class="dc-btn small" data-dc-yes="'+kind+'">Yes</button>' +
      '<button class="dc-btn ghost small" data-dc-cancel>Not yet</button></div></div>';
  }

  /* the first card of every day: today's essential info (weather, energy, dress...), always
     open, nothing to unlock. The "Today's essential info" button still opens the same content
     as a sheet. */
  function dcEssentialCardHTML(ch, ctx, visited, cur){
    var body = '<span class="dc-pill '+(visited?'visited':'onway')+'">'+(visited?'Visited':'Today')+'</span>' +
      '<div class="dc-title">'+escH(ch.name)+'</div>' + essentialSheetBody(ctx.data, ctx.day) + dcGuideHTML(ctx.day, ch.id);
    var foot = '';
    if(cur) foot = (state.confirming==='ready') ? dcConfirmHTML('ready') : '<button class="dc-btn" data-dc-ask="ready">'+escH(ch.readyLabel || 'Ready for what’s next')+'</button>';
    return '<div class="dc-card" data-dc-card="'+escH(ch.id)+'"><div class="dc-card-body">'+body+'</div>' + (foot ? '<div class="dc-card-foot">'+foot+'</div>' : '') + '</div>';
  }

  /* Guide Mode (triple-tap the day title): extra guide-only notes per chapter, read from GUIDE
     (below DAY_DATA), shown in a red-outlined block. Nothing in here may be a secret: the page is public. */
  function dcGuideHTML(dayN, chId){
    if(!state.guide) return '';
    var g = GUIDE[dayN+'.'+chId];
    if(!g) return '';
    var h = '<div class="dc-guide"><div class="dc-guide-title">Guide</div>';
    if(g.checks && g.checks.length){
      var gt = dayProg(dayN).checks['g:'+chId] || [];
      h += g.checks.map(function(text, idx){
        var on = !!gt[idx];
        return '<label class="dc-check'+(on?' done':'')+'"><input type="checkbox" data-dc-check="g:'+escH(chId)+'|'+idx+'"'+(on?' checked':'')+'><span>'+escH(text)+'</span></label>';
      }).join('');
    }
    if(g.items && g.items.length) h += '<ul class="dc-bullets">'+g.items.map(function(t){ return '<li>'+escH(t)+'</li>'; }).join('')+'</ul>';
    if(g.maps && g.maps.length) h += '<div class="dc-chips">'+dcMapsChips(g.maps)+'</div>';
    return h + '</div>';
  }

  function dcCardHTML(ch, i, ctx){
    var p = ctx.p;
    var visited = i < ctx.done;
    var cur = (i === ctx.done);
    if(ch.kind==='essential') return dcEssentialCardHTML(ch, ctx, visited, cur);
    var arrived = visited ? true : p.arrived;
    var isLast = (i === ctx.len-1);
    /* gate = a time-locked (fixed) chapter: "Not yet" until its time in Japan (or, in Guide
       Mode, until the skip button is used). */
    var gated = !!ch.gate && !arrived && !gateOpen(ctx.day, ch);
    var pill = visited ? '<span class="dc-pill visited">Visited</span>'
      : (gated ? '<span class="dc-pill onway">Not yet</span>'
      : (arrived ? '<span class="dc-pill on">Exploring now</span>' : '<span class="dc-pill onway">On the way</span>'));

    var body = pill + '<div class="dc-title">'+escH(ch.name)+'</div>';
    if(ch.timeNote) body += '<div class="dc-badge">'+escH(ch.timeNote)+'</div>';
    body += dcGuideHTML(ctx.day, ch.id);
    body += dcInfoHTML(ch, p, arrived);

    var below = '';
    if(arrived){
      if(ch.expect) below += '<div class="dc-duration">'+dcIconSvg('clock')+'<span>'+escH(ch.expect)+'</span></div>';
      if(ch.blurb) below += '<div class="dc-blurb">'+escH(ch.blurb)+'</div>';
      if(ch.bookingUnlocked) below += dcBullets(ch.bookingUnlocked.title, ch.bookingUnlocked.rows.map(function(r){ return '<li>'+escH(r[0])+': '+escH(r[1])+'</li>'; }));
      if(ch.bulletsUnlocked) below += dcBullets(ch.bulletsUnlocked.title, ch.bulletsUnlocked.items.map(function(t){ return '<li>'+escH(t)+'</li>'; }));
      var chips = '';
      if(ch.groups){
        chips += ch.groups.map(function(g, gi){ return '<button class="dc-chip" data-dc-open="'+escH(ch.id)+'|g'+gi+'">'+escH(g.name)+'</button>'; }).join('');
      } else if(ch.about){
        chips += '<button class="dc-chip" data-dc-open="'+escH(ch.id)+'|a">'+escH(ch.aboutLabel || ch.name)+'</button>';
      }
      if(ch.mapsUnlocked) chips += dcMapsChips(ch.mapsUnlocked);
      if(chips) below += '<div class="dc-chips">'+chips+'</div>';
      if(isLast && ctx.data.tomorrow) below += '<div class="dc-tomorrow">'+dcField('Tomorrow', escH(ctx.data.tomorrow))+'</div>';
    }
    if(below) body += '<div class="dc-divider"></div>' + below;

    var foot = '';
    if(cur){
      if(gated) foot = state.guide ? '<button class="dc-btn provisional" data-dc-skip>Guide: skip the wait</button>' : '<div class="dc-lastnote">Not yet. Opens at '+escH(ch.gate.time)+'.</div>';
      else if(state.confirming==='here' && !arrived) foot = dcConfirmHTML('here');
      else if(state.confirming==='ready' && arrived && !isLast) foot = dcConfirmHTML('ready');
      else if(!arrived) foot = '<button class="dc-btn" data-dc-ask="here">I’m here</button>';
      else if(isLast) foot = '<div class="dc-lastnote">That’s the last chapter for today.</div>';
      else foot = '<button class="dc-btn" data-dc-ask="ready">'+escH(ch.readyLabel || 'Ready for what’s next')+'</button>';
    }
    return '<div class="dc-card" data-dc-card="'+escH(ch.id)+'"><div class="dc-card-body">'+body+'</div>' + (foot ? '<div class="dc-card-foot">'+foot+'</div>' : '') + '</div>';
  }

  function dcCardsHTML(day, data){
    var journal = day.status==='journal';
    var p = dayProg(day.n);
    var len = data.chapters.length;
    var done = journal ? len : Math.min(p.done, len-1);
    var count = journal ? len : done+1;
    var ctx = { p:p, done:done, len:len, data:data, day:day.n };
    var dots = '<div class="dc-dots" role="tablist" aria-label="Chapters reached so far">';
    var cards = '';
    for(var i=0;i<count;i++){
      dots += '<button class="dc-dot'+(i===count-1?' on':'')+'" data-dc-dot="'+i+'" aria-label="Chapter '+(i+1)+': '+escH(data.chapters[i].name)+'"></button>';
      cards += dcCardHTML(data.chapters[i], i, ctx);
    }
    dots += '</div>';
    return '<div class="dc-chapters-label">Chapters</div>' + dots + '<div class="dc-carousel">' + cards + '</div>';
  }

  /* moves the carousel to the newest card and syncs the dots -- used on first mount and
     by openDayFlip() (whose static preview has no handlers wired yet). */
  function dcSyncDots(root){
    var car = root.querySelector('.dc-carousel');
    if(!car) return;
    var cards = car.querySelectorAll('.dc-card');
    var step = cards.length>1 ? (cards[1].offsetLeft - cards[0].offsetLeft) : 0;
    var idx = step>0 ? Math.round(car.scrollLeft/step) : 0;
    root.querySelectorAll('.dc-dot').forEach(function(d, k){ d.classList.toggle('on', k===idx); });
  }
  function dcMount(root){
    var car = root.querySelector('.dc-carousel');
    if(!car) return;
    if(state.screen!=='stayDetail') car.scrollLeft = car.scrollWidth; /* stay cards start at the first card */
    dcSyncDots(root);
  }

  function dayDetailScreen(day, dayData, dayKey){
    var isJournal = day.status==='journal';
    var html = '<button class="close-fab" data-back aria-label="Close">'+closeIcon+'</button>';
    html += '<div class="dayhead">' +
      ((dayData && !isJournal && state.guide) ? '<button class="resetbtn" data-dc-reset>Guide · reset from this day</button>' : '') +
      '</div>';

    var dayLocked = day.status==='locked';
    html += '<div class="backhero-text"><div class="day-date">'+day.date+' &middot; Day '+day.n+'/10</div>' +
      (dayLocked ? '' : '<div class="day-title'+(state.guide?' guide-on':'')+'">'+day.title+'</div>') +
      '<div class="day-teaser">'+day.teaser+'</div></div>';

    if(dayData){
      html += '<div class="dc-essential-wrap"><button class="dc-pillbtn" data-dc-essential>Today’s essential info</button></div>';
      if(isJournal) html += '<div class="journalflag">Past day &middot; kept as trip journal &middot; fully unlocked</div>';
      html += dcCardsHTML(day, dayData);
    } else {
      var lockMsg = state.guide ? 'Opens when Day '+(day.n-1)+' is finished' : 'Unlocks '+day.unlock+' at 00:00 Japan time';
      html += '<div class="dc-carousel"><div class="dc-card dc-locked-card"><div class="dc-locked-msg">'+escH(lockMsg)+'</div></div></div>';
    }
    return html;
  }

  /* ---- actions ---- */
  function dcActive(){
    if(state.screen!=='day') return null;
    var day = DAYS.filter(function(d){ return d.n===state.openDay; })[0];
    var data = dayDataFor(day);
    if(!day || !data || day.status==='journal') return null;
    var p = dayProg(day.n);
    p.done = Math.min(p.done, data.chapters.length-1);
    return { day:day, data:data, p:p, ch:data.chapters[p.done], isLast:(p.done===data.chapters.length-1) };
  }
  function dcArrive(){
    var a = dcActive(); if(!a) return;
    a.p.arrived = true;
    delete a.p.tip[a.ch.id]; /* let the default rule fold Info away now that you are there */
    state.confirming = null;
    render();
  }
  function dcSkip(){
    var a = dcActive(); if(!a) return;
    a.p.arrived = true; /* Guide Mode stand-in for "the clock reached the gate time" */
    delete a.p.tip[a.ch.id];
    state.confirming = null;
    render();
  }
  function dcAdvance(){
    var a = dcActive(); if(!a || a.isLast) return;
    a.p.done++;
    var next = a.data.chapters[a.p.done];
    a.p.arrived = dcStartsArrived(next);
    delete a.p.tip[next.id];
    state.confirming = null;
    state.scrollToEnd = true;
    render();
  }

  /* a fixed (not re-randomized on every render) little tilt per day, so the deck reads as
     a naturally tossed pile rather than a mechanically even fan -- kept narrow (1-3deg)
     and, for now, only on the cards behind the front one. Front-card tilt is on hold
     until the deck-movement bug is sorted out, since it made that bug read worse. */
  var CARD_JITTER = [-2.1, 1.6, -1.3, 2.4, -1.8, 1.1, -2.6, 1.4, -1.9, 2.2];
  function cardJitter(idx){ return CARD_JITTER[idx % CARD_JITTER.length]; }

  function stackStyle(offset, idx){
    var a = Math.abs(offset);
    var tx = offset*24;
    var scale = Math.max(1 - a*0.05, 0.78);
    var rot = offset===0 ? 0 : offset*1.1 + cardJitter(idx||0);
    var op = a<=2 ? 1 : 0;
    var z = 100-a;
    var pe = a>2 ? 'none' : 'auto';
    return {tx:tx, scale:scale, rot:rot, op:op, z:z, pe:pe};
  }
  /* where the OTHER cards tuck to while one card opens/closes -- squared up into a
     perfectly neat, centered pile (no fan, no tilt) so there's real motion to see: the
     messy natural fan visibly straightens into a tidy stack on the way in, and on the
     way back out that tidy stack visibly un-stacks, spreading out into the fan again */
  function gatherStyle(offset, idx){
    var a = Math.abs(offset);
    return { tx: 0, scale: Math.max(0.93 - a*0.025, 0.84), rot: 0 };
  }
  function stackTransform(s){
    return 'translate(-50%,-50%) translateX('+s.tx+'px) scale('+s.scale+') rotate('+s.rot+'deg)';
  }

  /* shared by both the intro splash and the compact home hero -- same sub-element
     classes (.mark/.wordmark/.range) in both, sized differently via the .intro-hero
     modifier class, so goHome()/goIntro() can morph between them (see markMorph()). */
  function heroMarkupHTML(){
    return '<div class="mark"><img class="mark-light" src="'+MARK_LIGHT+'" alt="japan slowly" width="56" height="56"><img class="mark-dark" src="'+MARK_DARK+'" alt="japan slowly" width="56" height="56"></div><div class="wordmark">japan slowly</div><div class="range mono'+(state.guide?' guide-on':'')+'">25 SEP &ndash; 4 OCT 2026</div>';
  }

  /* the big centered splash shown on first load (round 9) -- see goHome()/goIntro() for
     the morph transition between this and the compact home hero. */
  function introScreen(){
    return '<div class="intro-screen">' +
      '<div class="intro-spacer-top"></div>' +
      '<div class="home-hero intro-hero">' + heroMarkupHTML() + '</div>' +
      '<div class="intro-spacer-mid"></div>' +
      '<button class="intro-cta" data-start>Start your journey</button>' +
    '</div>';
  }

  function homeScreen(excludeIdx){
    /* centered mark + wordmark + date-range hero, replacing the old left-aligned
       "reel-head" -- the old descriptive note beneath it has been removed entirely. */
    var html = '<div class="home-hero">' + heroMarkupHTML() + '</div>';
    html += '<div class="stack-wrap" id="stackwrap">';
    DAYS.forEach(function(d, i){
      if(i===excludeIdx) return; /* that card is off being flipped elsewhere -- it doesn't belong in the deck yet */
      if(d.extra && !copenhagenOpen()) return;
      var offset = i - state.stackIndex;
      var s = stackStyle(offset, i);
      var locked = d.status==='locked';
      var styleStr = 'transform:'+stackTransform(s)+'; opacity:'+s.op+'; z-index:'+s.z+'; pointer-events:'+s.pe+';';
      html += '<button class="stack-card '+(locked?'locked':'')+' '+(d.status==='active'?'active':'')+' '+(offset===0?'is-front':'')+'" data-idx="'+i+'" style="'+styleStr+'">' +
        '<div class="flip-inner">' +
          '<div class="flip-face flip-front">' + stackCardFrontHTML(d) + '</div>' +
          '<div class="flip-face flip-back"></div>' +
        '</div>' +
      '</button>';
    });
    html += '</div>';
    return html;
  }

  /* ---------- Stays screen ----------
     A 4-card bento/mosaic grid (1 full-width card, then 2 stacked left + 1 tall
     right, matching the wireframe the user sent) rather than the day deck's swipeable
     carousel -- these aren't meant to be flipped through one at a time, they're a
     reference the user dips into. Locking is day-based (stayLocked(), same status
     field DAYS already uses) not location-based, per the user's explicit ask. */
  function staysScreen(excludeStayId){
    var areas = ['top','left1','left2','right'];
    /* round 24: same hero the Explorer screen uses (see the CSS comment above), not a
       Stays-specific header. */
    var html = '<div class="stays-view">' +
      '<div class="home-hero">' + heroMarkupHTML() + '</div>' +
      '<div class="stays-grid">';
    STAYS.forEach(function(st, i){
      if(st.id===excludeStayId) return; /* off being flipped open elsewhere -- see openStayFlip() */
      var locked = stayLocked(st);
      /* round 24: locked cards drop the "Stay withheld" title entirely, per the user's
         explicit ask -- only the date range stays visible. */
      /* round 26: no more .flip-inner/.flip-face wrapper here -- the open/close
         animation is a plain expand/collapse now (see openStayFlip()/closeStayFlip()),
         so the card just renders its front content directly. */
      html += '<button class="stay-card'+(locked?' locked':'')+'" data-area="'+areas[i]+'" data-stay="'+st.id+'">' +
        stayCardFrontHTML(st) +
      '</button>';
    });
    html += '</div></div>';
    return html;
  }

  /* shared front-face markup for a Stays grid card -- reused by staysScreen() and by
     the transient flip element closeStayFlip() rebuilds for the reverse (close)
     animation, exactly mirroring stackCardFrontHTML()'s role for the day deck. */
  function stayCardFrontHTML(st){
    var locked = stayLocked(st);
    return '<div class="hero" style="'+heroStyleForStay(st, locked)+'"></div>' + grainDiv() + '<div class="shade"></div>' +
      (locked ? '<div class="status-pill">Locked</div>' : '') +
      '<div class="content">' +
        (locked ? '' : '<div class="stay-label">'+(st.areaName || st.label)+'</div>') +
        '<div class="stay-range">'+st.range+'</div>' +
      '</div>';
  }

  /* shared front-face markup, reused by the home stack cards and by the
     transient flip element rebuilt for the reverse (close) animation */
  function stackCardFrontHTML(d){
    var locked = d.status==='locked';
    /* the status pill is now only shown for locked cards -- journal/active (unlocked)
       cards no longer carry a status label at all. The old top-right "#02 / 10" frame-no
       badge is gone too: that position-in-trip info now lives after the bottom
       date instead ("SAT 26 SEP · Day 2/10"). */
    if(d.extra){
      return '<div class="hero" style="'+heroStyleForDay(d.n, false)+'"></div>' + grainDiv() + '<div class="shade"></div>' +
        '<div class="content"><div class="day-title">'+d.title+'</div><div class="day-teaser">'+d.teaser+'</div></div>';
    }
    return '<div class="hero" style="'+heroStyleForDay(d.n, locked)+'"></div>' + grainDiv() + '<div class="shade"></div>' +
      (locked ? '<div class="status-pill">Locked</div>' : '') +
      '<div class="content">' +
        '<div class="day-date">'+d.date+' &middot; Day '+d.n+'/10</div>' +
        (locked ? '' : '<div class="day-title">'+d.title+'</div>') +
        '<div class="day-teaser">'+d.teaser+'</div>' +
      '</div>';
  }

  function applyStack(){
    var wrap = document.getElementById('stackwrap');
    if(!wrap) return;
    wrap.querySelectorAll('.stack-card').forEach(function(el){
      var i = parseInt(el.getAttribute('data-idx'),10);
      var s = stackStyle(i - state.stackIndex, i);
      /* the card swinging INTO focus travels a much bigger transform delta (position,
         scale, and rotation all change substantially, going from a small tilted
         background card to full-size and untilted) than the outgoing card does, which
         made it read as noticeably snappier/faster than the rest of the deck even
         though every card shares the same .6s transition. Give just this one card a
         longer, gentler transition for its transform change, then clear the inline
         override once that transition finishes so it doesn't linger and affect some
         later, unrelated transform change on the same element (the round-4/7 bug was
         exactly this kind of leftover-inline-transition mistake). */
      var becomingFront = (i === state.stackIndex) && !el.classList.contains('is-front');
      if(becomingFront){
        el.style.transition = 'transform .85s cubic-bezier(.22,1,.36,1), opacity .5s ease, box-shadow .3s ease';
        el.addEventListener('transitionend', function onEnd(ev){
          if(ev.target===el && ev.propertyName==='transform'){ el.style.transition=''; el.removeEventListener('transitionend', onEnd); }
        });
      }
      el.style.transform = stackTransform(s);
      el.style.opacity = s.op;
      el.style.zIndex = s.z;
      el.style.pointerEvents = s.pe;
      el.classList.toggle('is-front', i===state.stackIndex);
    });
  }

  function setFocus(i){
    i = Math.max(0, Math.min(deckLast(), i));
    if(i===state.stackIndex) return;
    state.stackIndex = i;
    applyStack();
  }

  /* ---------- intro <-> home hero morph (round 9) ----------
     Only the .mark (the icon/circle) is animated with a true FLIP scale+move: it's the
     same image in both screens, so scaling it is a clean, distortion-free transform,
     exactly the reasoning the day-card open/close flip already uses for photos elsewhere
     in this file. The wordmark/date text is NOT scale-morphed the same way, on purpose:
     the intro screen's title wraps to two lines ("Japan," / "unscripted") at its larger
     size while the compact home title is one line -- scaling a single-line element up
     to stand in for a two-line one would show a visible text-reflow mismatch the instant
     the screen swaps. Cross-fading the text instead sidesteps that entirely and still
     reads as one coordinated motion alongside the mark's scale+move. */
  function markMorph(fromRect, toEl){
    var toRect = toEl.getBoundingClientRect();
    var scale = fromRect.width / toRect.width;
    var dx = (fromRect.left+fromRect.width/2) - (toRect.left+toRect.width/2);
    var dy = (fromRect.top+fromRect.height/2) - (toRect.top+toRect.height/2);
    toEl.style.transition = 'none';
    toEl.style.transformOrigin = 'center center';
    toEl.style.transform = 'translate('+dx+'px,'+dy+'px) scale('+scale+')';
    toEl.getBoundingClientRect(); /* flush the "from" state before animating */
    requestAnimationFrame(function(){
      toEl.style.transition = 'transform .5s cubic-bezier(.4,0,.2,1)';
      toEl.style.transform = 'none';
      toEl.addEventListener('transitionend', function onEnd(ev){
        if(ev.target===toEl && ev.propertyName==='transform'){
          toEl.style.transition = ''; toEl.style.transformOrigin = '';
          toEl.removeEventListener('transitionend', onEnd);
        }
      });
    });
  }

  /* fades an element out (in place) then back in from a slight offset -- used for the
     wordmark/date text and the CTA/deck, which cross-fade rather than scale-morph. */
  function crossfadeIn(el, delay){
    el.style.transition = 'none';
    el.style.opacity = '0';
    el.style.transform = 'translateY(6px)';
    el.getBoundingClientRect();
    requestAnimationFrame(function(){
      el.style.transition = 'opacity .35s ease '+delay+'s, transform .35s cubic-bezier(.4,0,.2,1) '+delay+'s';
      el.style.opacity = '1';
      el.style.transform = 'none';
    });
  }

  function goHome(){
    if(state.animating || state.screen!=='intro') return;
    if(reduceMotion){ state.screen='home'; state.sheetAbout=null; render(); return; }
    state.animating = true;
    var markEl = document.querySelector('.intro-hero .mark');
    var fromRect = markEl ? markEl.getBoundingClientRect() : null;
    var fadeOut = [document.querySelector('.intro-cta'), document.querySelector('.intro-hero .wordmark'), document.querySelector('.intro-hero .range')];
    fadeOut.forEach(function(el){ if(el){ el.style.transition='opacity .18s ease'; el.style.opacity='0'; } });
    setTimeout(function(){
      state.screen = 'home';
      render();
      var newMark = document.querySelector('.home-hero .mark');
      var newWordmark = document.querySelector('.home-hero .wordmark');
      var newRange = document.querySelector('.home-hero .range');
      var wrap = document.getElementById('stackwrap');
      if(newMark && fromRect) markMorph(fromRect, newMark);
      if(newWordmark) crossfadeIn(newWordmark, 0.15);
      if(newRange) crossfadeIn(newRange, 0.2);
      if(wrap) crossfadeIn(wrap, 0.15);
      setTimeout(function(){ state.animating=false; }, 650);
    }, 160);
  }

  function goIntro(){
    if(state.animating || state.screen!=='home') return;
    if(reduceMotion){ state.screen='intro'; state.sheetAbout=null; render(); return; }
    state.animating = true;
    var markEl = document.querySelector('.home-hero .mark');
    var fromRect = markEl ? markEl.getBoundingClientRect() : null;
    var wrap = document.getElementById('stackwrap');
    var oldWordmark = document.querySelector('.home-hero .wordmark');
    var oldRange = document.querySelector('.home-hero .range');
    [wrap, oldWordmark, oldRange].forEach(function(el){ if(el){ el.style.transition='opacity .18s ease'; el.style.opacity='0'; } });
    setTimeout(function(){
      state.screen = 'intro';
      render();
      var newMark = document.querySelector('.intro-hero .mark');
      var newWordmark = document.querySelector('.intro-hero .wordmark');
      var newRange = document.querySelector('.intro-hero .range');
      var cta = document.querySelector('.intro-cta');
      if(newMark && fromRect) markMorph(fromRect, newMark);
      if(newWordmark) crossfadeIn(newWordmark, 0.15);
      if(newRange) crossfadeIn(newRange, 0.2);
      if(cta) crossfadeIn(cta, 0.25);
      setTimeout(function(){ state.animating=false; }, 650);
    }, 160);
  }

  /* ---------- Stays tab <-> Explorer tab (segmented control) ----------
     A plain screen swap, not the intro/home hero-morph treatment above -- these two
     screens don't share a common hero element to morph between, and a simple
     cross-fade reads as a tab switch rather than a "journey" transition, which is
     the right register for a segmented control. */
  /* round 26: the user asked for the day deck sitting behind the Explorer screen to
     visibly settle before leaving for Stays, and to visibly unsettle back into its
     usual messy fan on the way back -- reusing the exact gather/spread motion (and
     gatherStyle()/stackStyle()/stackTransform() helpers) that openDayFlip()/
     closeDayFlip() already use for the same "tidy stack <-> fanned deck" transition,
     just triggered by a tab switch instead of a card opening. */
  function goStays(){
    if(state.animating || state.screen==='stays') return;
    state.sheetAbout = null;
    var stackwrap = state.screen==='home' ? document.getElementById('stackwrap') : null;
    if(stackwrap && !reduceMotion){
      state.animating = true;
      stackwrap.querySelectorAll('.stack-card').forEach(function(el){
        var i = parseInt(el.getAttribute('data-idx'),10);
        el.style.transition = 'transform .32s cubic-bezier(.4,0,.2,1), box-shadow .16s ease';
        el.style.transform = stackTransform(gatherStyle(i - state.stackIndex, i));
        el.style.boxShadow = 'none';
      });
      setTimeout(function(){
        state.animating = false;
        state.screen = 'stays';
        render();
      }, 320);
      return;
    }
    state.screen = 'stays';
    render();
  }
  function goExplore(){
    if(state.animating || state.screen==='home') return;
    state.sheetAbout = null;
    var wasStays = state.screen==='stays';
    state.screen = 'home';
    render();
    if(wasStays && !reduceMotion){
      var stackwrap = document.getElementById('stackwrap');
      if(stackwrap){
        var cards = Array.prototype.slice.call(stackwrap.querySelectorAll('.stack-card'));
        /* start gathered (no transition -- this is the "from" state, not itself
           animated), then transition out to each card's normal resting fan position */
        cards.forEach(function(el){
          var i = parseInt(el.getAttribute('data-idx'),10);
          el.style.transition = 'none';
          el.style.transform = stackTransform(gatherStyle(i - state.stackIndex, i));
          el.style.boxShadow = 'none';
        });
        stackwrap.getBoundingClientRect(); /* force reflow so the gathered "from" state is registered */
        requestAnimationFrame(function(){
          cards.forEach(function(el){
            var i = parseInt(el.getAttribute('data-idx'),10);
            var offset = i - state.stackIndex;
            el.style.transition = 'transform .5s cubic-bezier(.22,.9,.32,1), box-shadow .3s ease';
            el.style.transform = stackTransform(stackStyle(offset, i));
            el.style.boxShadow = '';
          });
        });
        /* drop the inline transition once settled so a later drag-to-browse gesture
           picks the deck's own default spring transition back up, not this one */
        setTimeout(function(){
          cards.forEach(function(el){ el.style.transition = ''; });
        }, 520);
      }
    }
  }

  function render(){
    applyStatuses(); /* Guide Mode's day chain depends on progress, which changes while you use the app */
    if(state.stackIndex > deckLast()) state.stackIndex = deckLast(); /* the Copenhagen card may not be in the deck */
    var el = document.getElementById('screen');
    /* el.innerHTML gets torn down and rebuilt on every render(), which by default
       creates a brand-new .view with scrollTop 0 -- so a same-screen re-render (e.g.
       revealing a chapter, opening/closing the confirm row, opening the about sheet)
       used to visibly snap the page back to the top even though nothing about the
       scroll position should have changed. Tag each .view with the screen+day it
       represents and only restore the old scrollTop when re-rendering the exact same
       one; a genuine navigation to a different screen/day (which tags differently)
       still correctly starts at the top. */
    var screenKey = (state.screen==='stayDetail' ? 'stays' : state.screen) + ':' + state.openDay + ':' + (state.screen==='stayDetail' ? null : state.openStay);
    var prevView = el.querySelector('.view');
    var keepScroll = (prevView && prevView.dataset.screenKey === screenKey) ? prevView.scrollTop : null;
    /* day cards: a same-screen re-render (confirm row, Info toggle, sheet...) must not
       throw the carousel back to card 0 or reset each card's own inner scroll. */
    var prevCar = (keepScroll!==null && prevView) ? prevView.querySelector('.dc-carousel') : null;
    var carLeft = prevCar ? prevCar.scrollLeft : null;
    var bodyTops = prevCar ? Array.prototype.map.call(prevCar.querySelectorAll('.dc-card-body'), function(n){ return n.scrollTop; }) : null;

    var isDetailScreen = (state.screen==='day');
    var dayForView = state.screen==='day' ? DAYS.filter(function(d){return d.n===state.openDay;})[0] : null;
    var hasCards = !!dayDataFor(dayForView) || (!!dayForView && dayForView.status==='locked');
    var html = '<div class="view'+(isDetailScreen ? ' view-day' : '')+(hasCards ? ' view-daycards' : '')+'" data-screen-key="'+screenKey+'">';
    if(state.screen==='intro'){
      html += introScreen();
    } else if(state.screen==='home'){
      html += homeScreen();
    } else if(state.screen==='stays' || state.screen==='stayDetail'){
      html += staysScreen();
    } else {
      var day = DAYS.filter(function(d){return d.n===state.openDay;})[0];
      html += dayDetailScreen(day, dayDataFor(day), 'day'+day.n);
    }
    html += '</div>';
    if(state.screen==='stayDetail'){
      var openSt = STAYS.filter(function(x){ return x.id===state.openStay; })[0];
      if(openSt) html += staySlideHTML(openSt);
    }
    /* the sheet is a sibling of .view, not a child -- it needs to cover the full
       screen and must never be clipped by .view's own overflow:scroll box. */
    html += sheetHTML();
    el.innerHTML = html;
    wire();
    if(state.screen==='stayDetail' && state.staySlideNew){
      state.staySlideNew = false;
      var slideEl = el.querySelector('.stay-slide');
      if(slideEl){
        slideEl.getBoundingClientRect(); /* register the closed position, then slide up */
        requestAnimationFrame(function(){ requestAnimationFrame(function(){ slideEl.classList.add('open'); }); });
      }
    }
    if(keepScroll !== null){
      var newView = el.querySelector('.view');
      if(newView) newView.scrollTop = keepScroll;
    }
    var newCar = el.querySelector('.dc-carousel');
    if(newCar){
      if(carLeft!==null){
        newCar.scrollLeft = carLeft;
        newCar.querySelectorAll('.dc-card-body').forEach(function(n, k){ if(bodyTops && bodyTops[k]) n.scrollTop = bodyTops[k]; });
        if(state.scrollToEnd){
          state.scrollToEnd = false;
          requestAnimationFrame(function(){ newCar.scrollTo({ left:newCar.scrollWidth, behavior: reduceMotion ? 'auto' : 'smooth' }); });
        }
        dcSyncDots(el);
      } else {
        state.scrollToEnd = false;
        dcMount(el);
      }
    }
    if(state.sheetAbout){ openSheetTransition(); wireSheetDrag(); }
    /* show the reload button on the intro screen and the home reel, but not on a
       day-detail screen -- that screen already has its own top-right control
       (Reset demo) in that same corner, and this button is fixed-position so it
       would sit directly on top of it there. (round 9: the app's default/initial
       screen changed from 'home' to 'intro', so this button has to be reachable
       from there too, or a user landing on the intro screen has no way at all to
       force-fetch a fresh copy of the app.) */
    var refreshBtn = document.getElementById('refreshBtn');
    if(refreshBtn) refreshBtn.hidden = (state.screen!=='home' && state.screen!=='intro');
    /* the segmented control only makes sense once there's more than one place to be --
       shown on the two screens it switches between (home/stays), hidden on the intro
       splash and on a day-detail screen (which already owns that corner/edge with its
       own chrome, same reasoning as refreshBtn above). */
    var tabbar = document.getElementById('tabbar');
    if(tabbar){
      tabbar.hidden = !(state.screen==='home' || state.screen==='stays' || state.screen==='stayDetail');
      var tabExplore = document.getElementById('tabExplore');
      var tabStays = document.getElementById('tabStays');
      if(tabExplore) tabExplore.classList.toggle('on', state.screen==='home');
      if(tabStays) tabStays.classList.toggle('on', state.screen==='stays' || state.screen==='stayDetail');
      var tabbarIndicator = document.getElementById('tabbarIndicator');
      if(tabbarIndicator) tabbarIndicator.classList.toggle('right', state.screen==='stays' || state.screen==='stayDetail');
    }
    updateStackClearance();
    saveProgress();
  }

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- open: flip the front card over while it grows to fill the screen ---------- */
  function openDayFlip(idx){
    if(state.animating) return;
    var day = DAYS[idx];
    if(reduceMotion){
      state.screen='day'; state.openDay=day.n; state.confirming=null; state.sheetAbout=null; render();
      return;
    }
    var screenEl = document.getElementById('screen');
    var cardEl = screenEl.querySelector('.stack-card[data-idx="'+idx+'"]');
    if(!cardEl){ state.screen='day'; state.openDay=day.n; state.sheetAbout=null; render(); return; }

    state.animating = true;
    var dayData = dayDataFor(day);
    var backEl = cardEl.querySelector('.flip-back');
    /* wrapped in the same .view shell render() will build, so the layout does not jump when
       render() swaps the real thing in at the end of the animation */
    backEl.innerHTML = '<div class="view view-day'+((dayData || day.status==='locked') ? ' view-daycards' : '')+'">' + dayDetailScreen(day, dayData, 'day'+day.n) + '</div>';
    dcMount(backEl);

    /* openDayFlip only ever opens the current front card (see the click handler in
       wireHome), which is supposed to be sitting at its settled resting transform --
       scale(1), rotate(0). But right after a swipe-to-focus drag, applyStack() kicks off
       a .6s transition that grows/un-tilts the newly-focused card from whatever smaller,
       jittered transform it had as a background card. Tapping to open before that
       transition finishes meant we measured the card mid-transition (still visibly
       scaled down / tilted) but then, below, sized the "from" box using its unrotated
       LAYOUT size (offsetWidth/offsetHeight, which transform never affects) -- so the
       card would suddenly pop up to full size the instant the open animation took over.
       Closing and reopening never hit this because by then the card had long since
       finished settling. Forcing the card to its resting transform synchronously here,
       before any measuring happens, guarantees what we measure always matches its
       resting size -- whether or not a swipe-snap transition was still in flight. */
    cardEl.style.transition = 'none';
    cardEl.style.transform = stackTransform(stackStyle(0, idx));
    cardEl.getBoundingClientRect(); /* flush the snap before measuring below */
    cardEl.style.transition = ''; /* clear the inline override -- left in place, it would
      permanently out-rank the ".opening" class's own transition (added below) since an
      inline style always beats a class rule, regardless of add order. That's exactly what
      broke the open animation: the box-morph grow-to-fullscreen stopped transitioning at
      all (still jumped instantly) while only the flip's own rotateY kept animating, making
      every open look like "already fullscreen, then it just flips." */

    /* the focused card can carry a few degrees of tilt now, so getBoundingClientRect()
       (the axis-aligned box AROUND the rotated card, inflated by the rotation) is the
       wrong source for the "from" box -- it would make the card visibly pop larger the
       instant we cancel its rotation below. Its rotation-invariant CENTER point is still
       reliable, so pair that with the card's own unrotated layout size instead. */
    var aabb = cardEl.getBoundingClientRect();
    var w = cardEl.offsetWidth, h = cardEl.offsetHeight;
    var rect = { top: aabb.top + aabb.height/2 - h/2, left: aabb.left + aabb.width/2 - w/2, width: w, height: h };
    var parentRect = screenEl.getBoundingClientRect();

    /* cache where this card sits, so the close animation can morph the fullscreen
       view back down to this exact spot instead of guessing at a target */
    state.closeTargetRect = { top: rect.top-parentRect.top, left: rect.left-parentRect.left, width: rect.width, height: rect.height };
    state.closeIdx = idx;

    /* reparent into #screen so the containing block for the following top/left/width/height
       math is actually #screen (not .stack-wrap) -- otherwise the card jumps to the wrong frame */
    screenEl.appendChild(cardEl);

    cardEl.style.zIndex = 500;
    cardEl.style.top = (rect.top-parentRect.top)+'px';
    cardEl.style.left = (rect.left-parentRect.left)+'px';
    cardEl.style.width = rect.width+'px';
    cardEl.style.height = rect.height+'px';
    cardEl.style.margin = '0';
    cardEl.style.transform = 'none';
    cardEl.classList.add('opening');
    cardEl.getBoundingClientRect(); /* force reflow so the "from" box is registered */

    requestAnimationFrame(function(){
      cardEl.style.top = '0px';
      cardEl.style.left = '0px';
      cardEl.style.width = parentRect.width+'px';
      cardEl.style.height = parentRect.height+'px';
      cardEl.style.borderRadius = '0px';
      cardEl.style.boxShadow = 'none'; /* a fullscreen view doesn't read as a floating card -- drop its shadow fast */
      cardEl.classList.add('flipped');

      /* the rest of the stack gathers inward and downscales at the same time, tucking out
         of sight under the growing/flipping front card -- fully visible the whole time.
         Only the SHADOW fades out fast: with several cards bunched close together their
         shadows piled into a smeared, detached-looking blob, so shadows drop out quickly
         while they're gathered and only reappear once the deck is spaced out again. */
      screenEl.querySelectorAll('#stackwrap .stack-card').forEach(function(el){
        var i = parseInt(el.getAttribute('data-idx'),10);
        el.style.transition = 'transform .5s cubic-bezier(.22,.9,.32,1), box-shadow .16s ease';
        el.style.transform = stackTransform(gatherStyle(i - state.stackIndex, i));
        el.style.boxShadow = 'none';
      });
    });

    setTimeout(function(){
      state.screen='day'; state.openDay=day.n; state.animating=false; state.sheetAbout=null;
      render();
    }, 580);
  }

  /* ---------- close: the true reverse of open -- unflip back to the photo while shrinking
     in place to the exact spot the card sits in the stack ---------- */
  function closeDayFlip(){
    if(reduceMotion){ state.screen='home'; state.confirming=null; state.sheetAbout=null; render(); return; }
    var screenEl = document.getElementById('screen');
    var viewEl = screenEl.querySelector('.view');
    var target = state.closeTargetRect;
    var day = DAYS[state.closeIdx];
    if(!viewEl || !target || !day || state.animating){ state.screen='home'; state.confirming=null; state.sheetAbout=null; render(); return; }
    state.animating = true;

    var parentRect = screenEl.getBoundingClientRect();
    var locked = day.status==='locked';

    /* rebuild the rest of the stack behind everything, gathered exactly the way
       openDayFlip left it -- fully visible, just compact -- and it spreads back out to
       its resting fan as the final part of this animation, timed with the front card
       landing back in its slot. Only the shadows start hidden: bunched together they'd
       pile into a smeared blob, so they stay off until the deck is spaced out again. */
    var bgEl = document.createElement('div');
    bgEl.className = 'view';
    bgEl.style.pointerEvents = 'none';
    bgEl.style.zIndex = 400;
    bgEl.innerHTML = homeScreen(state.closeIdx); /* the flipping card itself is excluded -- it doesn't rejoin the deck until it lands */
    screenEl.appendChild(bgEl);
    bgEl.querySelectorAll('.stack-card').forEach(function(el){
      var i = parseInt(el.getAttribute('data-idx'),10);
      el.style.transition = 'none';
      el.style.transform = stackTransform(gatherStyle(i - state.stackIndex, i));
      el.style.boxShadow = 'none';
    });
    bgEl.getBoundingClientRect(); /* force reflow so the gathered "from" state is registered */

    /* rebuild a transient flip element: the live view (still fully up to date --
       revealed chapters, expanded panels, etc.) becomes the back face, and a fresh
       front face carries that day's photo, exactly mirroring what openDayFlip built */
    var wrapper = document.createElement('div');
    /* match every class homeScreen() would give this card (not just 'locked') --
       otherwise anything status-driven (like the pill's colored background for
       'active' days) is missing for the whole animation and only appears the
       instant render() swaps this transient wrapper for the real card, which
       reads as a jump/pop right at the end */
    wrapper.className = 'stack-card flipped is-front closing' + (locked ? ' locked' : '') + (day.status==='active' ? ' active' : '');
    wrapper.style.position = 'absolute';
    wrapper.style.margin = '0';
    wrapper.style.zIndex = 500;
    wrapper.style.top = '0px';
    wrapper.style.left = '0px';
    wrapper.style.width = parentRect.width+'px';
    wrapper.style.height = parentRect.height+'px';
    wrapper.style.borderRadius = '0px';
    wrapper.style.boxShadow = 'none'; /* a fullscreen view doesn't need a card shadow -- comes back once it lands */

    var flipInner = document.createElement('div');
    flipInner.className = 'flip-inner';
    var flipFront = document.createElement('div');
    flipFront.className = 'flip-face flip-front';
    flipFront.innerHTML = stackCardFrontHTML(day);
    var flipBack = document.createElement('div');
    flipBack.className = 'flip-face flip-back';
