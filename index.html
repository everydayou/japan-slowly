<meta charset="UTF-8">
<!-- there was no charset declared anywhere (no meta tag, and GitHub Pages' own
     Content-Type header is the only other thing that could have supplied one) -- this
     file already had non-ASCII characters in it (the curly apostrophe in "you've
     arrived?") before this round, and now has more (the wordmark's "…" ellipsis, this
     round's app rename), so it shouldn't keep depending on the browser correctly
     guessing UTF-8 with zero explicit signal. Must be within the document's first
     1024 bytes to reliably take effect, hence right at the very top. -->
<title>japan slowly</title>
<!-- maximum-scale=1, user-scalable=no (round 25): the app is meant to be installed and
     used like a native app (see the "no gallery chrome" contract rule), so pinch/
     double-tap zoom on the UI itself doesn't serve a purpose here and was catching
     accidental gestures during the drag-heavy interactions (deck drag, sheet
     drag-to-dismiss). Caveat worth knowing about, not working around: iOS Safari has,
     since iOS 10, deliberately still allowed pinch-zoom regardless of this flag as an
     accessibility override for low-vision users (WCAG 1.4.4) -- this reliably blocks
     it in the standalone/home-screen app (no Safari UI involved at all) and blocks
     double-tap-zoom everywhere, but a user could still pinch-zoom while it's open as
     an ordinary Safari tab. That's an intentional accessibility escape hatch on
     Apple's part, not a bug in this meta tag. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- lets this be "installed" from the browser share/menu and launch full-screen off the
     home screen, like an app, instead of opening back into a browser tab -->
<link rel="manifest" href="manifest.json">
<!-- ?v=10 cache-busts the icon (round 9, bumped round 15) -- iOS/browsers cache an
     installed-app icon very aggressively by URL, so nothing tells the OS/browser a new
     copy exists unless this query string changes too. Bump it any time icon-512.png's
     contents change again. NOTE this only fixes it going forward for a fresh fetch/
     install -- an icon already on a phone's home screen was cached at install time and
     won't refresh on its own; removing and re-adding the app to the home screen is the
     only way to pick up a new icon on a device that already installed an old one.
     Round 15 found the real reason the icon "still wasn't updating" despite this
     cache-busting machinery already being in place since round 9: icon-512.png itself
     had never actually been replaced by any round that claimed to touch it (rounds 5/6/
     9's changelog entries described swapping in mark artwork, but the committed PNG was
     still literally the round-1 placeholder gradient) -- also, manifest.json's two icon
     entries had NO cache-busting query at all until round 15, only this apple-touch-icon
     link did, so even a correctly-updated file could still get stuck on Android/Chrome
     (which reads the manifest's icon list, not this link) indefinitely. Both are fixed
     now: the real user-supplied artwork is finally in icon-512.png, and both places that
     reference it carry the same ?v=10. -->
<link rel="apple-touch-icon" href="icon-512.png?v=11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="japan slowly">

<style>
  /* ============================================================================
     DESIGN TOKENS — ported from the leve design system (src/index.css).
     Same semantic roles (surface/content/border/accent), same light+dark remap
     pattern, same radius/shadow scale and Outfit type family — with the accent
     hue swapped from leve's mint to a torii-red so the app still reads as
     distinctly "Japan Slowly" rather than a mint iOS app. Variable NAMES below
     are unchanged from the original file (--bg, --ink, --accent, etc.) so no
     other rule in this stylesheet needed to be touched. */
  :root{
    --bg:#fafafa;              /* was --color-surface-muted (page backdrop) */
    --bg-elevated:#ffffff;     /* was --color-surface (cards, sheets, bars) */
    --frame:#f7f6f9;           /* was --color-surface-sunken (insets); tuned to match the light grey pixel-sampled from the Figma prep-block mock */
    --ink:#171717;             /* was --color-content (primary text) */
    --ink-soft:#767676;        /* was --color-content-secondary */
    --ink-faint:#a3a3a3;       /* was --color-content-muted */
    --accent:#E11401;          /* updated torii red (round 9) -- was #d6432e */
    --accent-soft:#ff3110;     /* lighter red — hover state (derived to keep the same L/S offset from --accent that the old palette had) */
    --reveal:#c08a2e;          /* warm gold, distinct 2nd accent (was rust) */
    --line:#efeff0;            /* was --color-border-field */
    --grain-opacity:.05;
    --stage-a:#ffffff;
    --stage-b:#f3f3f3;
    /* exposes env(safe-area-inset-bottom) as a plain custom property so JS can read its
       resolved px value via getComputedStyle -- env() itself isn't otherwise queryable
       from script. Read by the diagnostics panel (round 24); no longer needed by any
       layout logic as of round 25 (see .ui-layer's comment), kept for that. */
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#18181b;
      --bg-elevated:#1b1c1d;
      --frame:#161618;
      --ink:#e3e3e3;
      --ink-soft:#9c9c9c;
      --ink-faint:#7c7c81;
      --accent:#ff563f;        /* brighter red pops on near-black -- derived from the round-9 #E11401 base */
      --accent-soft:#ff2809;   /* darker red — hover state */
      --reveal:#e3ac55;
      --line:#212121;
      --grain-opacity:.09;
      --stage-a:#18181b;
      --stage-b:#131315;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#18181b;
    --bg-elevated:#1b1c1d;
    --frame:#161618;
    --ink:#e3e3e3;
    --ink-soft:#9c9c9c;
    --ink-faint:#7c7c81;
    --accent:#ff563f;
    --accent-soft:#ff2809;
    --reveal:#e3ac55;
    --line:#212121;
    --grain-opacity:.09;
    --stage-a:#18181b;
    --stage-b:#131315;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  /* this used to sit inside a gallery mockup (a title/description header, decorative
     film-strip dots, a phone bezel) for presenting the prototype as a demo. now that
     the page is meant to be opened directly -- including as a home-screen app shortcut --
     it should just BE the app, full-bleed, with none of that outer chrome. */
  /* Lock the actual document/viewport itself so it can never pan or rubber-band
     in either direction -- this is a full-bleed app shell, not a scrollable
     page. .screen fills 100% of this and .view (below) is the ONE element
     that's allowed its own internal vertical scroll for a day's detail content;
     overscroll-behavior:contain on .view stops even that from chaining up into
     a bounce on html/body once it hits the top/bottom of its own scroll range. */
  html, body{
    height:100%;
    width:100%;
    overflow:hidden;
    overscroll-behavior:none;
  }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Outfit',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    margin:0;
    position:fixed;
    inset:0;
  }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  .mono{ font-family:'Outfit',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }

  /* ---- screen (fills the viewport) ----
     Was `100svh` (small viewport height -- locked to the viewport's size when the
     browser's own chrome, e.g. Safari's address/toolbar, is fully expanded). That was
     a deliberate choice to stop the layout resizing/jumping every time that chrome
     shows or hides on scroll -- but the trade-off turned out worse than the jump it
     avoided: on a real phone, once Safari's chrome auto-hides (the common case after
     any scroll), the real visible viewport grows taller than 100svh, and `.screen`
     doesn't grow with it. The result is a dead strip of plain `body` background at the
     very bottom, below where `.screen` actually ends -- same color as the app itself
     (`body`'s `background:var(--bg)` matches `.screen`'s), so it reads as an unexplained
     "gap" rather than an obvious seam. Every element anchored to `.screen`'s bottom edge
     (`#tabbar`, `.intro-cta`, the day-view's safe-area padding) ends up sitting that same
     distance above the *true* bottom of the visible window -- which is exactly the two
     symptoms reported: the tabbar/segmented-control reading as pushed upward, and
     day-detail content reading as cropped (the actually-visible page is shorter than
     the real screen, so more of the content sits below the fold than it should).
     `100dvh` (dynamic viewport height) instead tracks the *current* real viewport at all
     times, so there's never a gap -- the "jump" the original comment worried about is,
     on current iOS/Android, a smooth live resize as the chrome animates, not an abrupt
     cut, and is the standard fix for this exact class of bug. */
  .screen{
    position:relative;
    width:100%;
    height:100dvh; /* fallback until the JS below runs (or if it's ever blocked) */
    height:var(--app-height, 100dvh); /* real measured height -- see the JS comment for why this is needed on top of dvh */
    background:var(--bg);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .view{ position:absolute; inset:0; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain; display:flex; flex-direction:column; }
  .view::-webkit-scrollbar{ width:0; }
  /* the day-detail view's content (chapters, the tomorrow card) had nothing reserving
     room for the iPhone home-indicator safe area at the very bottom of the scroll range
     -- .dayhead/.close-fab/.sheet-panel all already account for env(safe-area-inset-*)
     on their own edges (see their rules), but .view itself never did on its bottom edge,
     so scrolling all the way down still left the last ~24px of content (.tomorrow's own
     margin-bottom) sitting right at the safe-area boundary, reading as visibly cropped
     on a real device (fine in desktop/Playwright, which has no safe-area inset to miss).
     Scoped to the day screen only -- the home/intro screens' .view never scrolls and
     .stack-wrap's own bottom spacing is a separate, already-tuned value (round 8's
     shadow-bleed margin) that this shouldn't also stack with. */
  .view.view-day{ padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 24px); }

  /* ---- grain overlay ---- */
  .grain{ position:absolute; inset:0; pointer-events:none; opacity:var(--grain-opacity); mix-blend-mode:overlay; background-repeat:repeat; }

  /* ---- home stack ---- */
  /* replaces the old left-aligned wordmark+range "reel-head": a centered mark
     (red circle), title and trip date range, stacked as a small hero lockup.
     The old descriptive note beneath it is gone entirely -- see PROJECT-CONTEXT. */
  .home-hero{
    /* env(safe-area-inset-top) pushes this below the iPhone notch/Dynamic Island (and
       any other device inset) instead of a flat guess -- collapses to plain 24px on a
       device with no inset at all. Bottom padding is 0: the 48px gap down to the top
       of the card stack is entirely owned by .stack-wrap's margin-top below, so the two
       don't add together into something bigger than intended. */
    padding:calc(env(safe-area-inset-top, 0px) + 24px) 24px 0;
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  /* the mark is now the user's own icon artwork (round 5) -- a light-bg and a
     dark-bg variant, swapped with the same prefers-color-scheme / data-theme
     pattern the rest of the token system uses, instead of a plain CSS circle. */
  .home-hero .mark{ width:56px; height:56px; flex:none; }
  .home-hero .mark img{ display:block; width:100%; height:100%; object-fit:contain; }
  .home-hero .mark .mark-dark{ display:none; }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) .home-hero .mark .mark-light{ display:none; }
    :root:not([data-theme="light"]) .home-hero .mark .mark-dark{ display:block; }
  }
  :root[data-theme="dark"] .home-hero .mark .mark-light{ display:none; }
  :root[data-theme="dark"] .home-hero .mark .mark-dark{ display:block; }
  /* switched from a uniform flex `gap` to per-pair margins -- mark-to-title and
     title-to-date needed two different distances (4px, 2px), which `gap` can't express. */
  .home-hero .wordmark{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:600; font-size:22px; letter-spacing:.01em; margin-top:4px; }
  .home-hero .range{ font-size:14px; color:var(--ink-faint); font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; letter-spacing:.03em; margin-top:2px; }

  /* ---- intro splash (round 9) ----
     Sizing/spacing here is approximated from a screenshot of the user's Figma frame
     (the file itself needs a login WebFetch can't provide) by measuring the reference
     image's pixel proportions directly -- not pixel-exact to the source, but close.
     Flexible spacers (not fixed margins) distribute the vertical rhythm proportionally
     (~3.5 : 2 above/below the hero block) so this holds up across viewport heights
     instead of assuming one fixed screen size, the same lesson round 8's shadow-clip
     fix was about. */
  .intro-screen{ height:100%; display:flex; flex-direction:column; align-items:center; padding:0 24px; }
  .intro-spacer-top{ flex:3.5 1 0; min-height:12px; }
  .intro-spacer-mid{ flex:2 1 0; min-height:24px; }
  .home-hero.intro-hero{ padding:0; flex:none; }
  .home-hero.intro-hero .mark{ width:140px; height:140px; }
  /* max-width forces the wrap to land right after the comma ("Japan," / "unscripted",
     matching the reference) regardless of exact font-metric/kerning variance across
     browsers -- at 32px this string is wide enough to wrap somewhere on its own even
     without the constraint, but leaving that to chance risked an inconsistent break
     point instead of always the same one. */
  .home-hero.intro-hero .wordmark{ font-size:32px; line-height:1.08; margin-top:22px; max-width:230px; }
  .home-hero.intro-hero .range{ font-size:15px; margin-top:12px; }
  .intro-cta{
    flex:none;
    margin-bottom:calc(env(safe-area-inset-bottom, 0px) + 40px);
    background:var(--accent); color:#fff; border:0; border-radius:999px;
    font:inherit; font-weight:600; font-size:16px; letter-spacing:.01em;
    padding:16px 32px; cursor:pointer; -webkit-tap-highlight-color:transparent;
    box-shadow:0 12px 24px -12px rgba(225,20,1,.45);
  }
  .intro-cta:hover{ background:var(--accent-soft); }
  .intro-cta:active{ transform:scale(.97); }

  .stack-wrap{
    position:relative;
    /* was a fixed `flex:0 0 66%` of .view's height -- with the hero's own height now
       variable (env(safe-area-inset-top) can add 50px+ on a real iPhone), a fixed
       percentage stack-wrap could push the total content taller than the screen,
       forcing .view to scroll -- and the last card's box-shadow (which doesn't count
       toward scrollable overflow) got clipped at .view's bottom edge as a result. Using
       flex:1 1 auto instead makes the deck always take exactly the remaining space
       after the hero's real height is subtracted, so the two together can never exceed
       the screen. */
    flex:1 1 auto;
    min-height:280px;
    /* the stack-card children are absolutely positioned to exactly fill this box's
       top-to-bottom span (top:50%/height:100% + translateY(-50%) nets out to 0%-100%),
       so this margin-top IS the visible gap between the hero content above and the top
       edge of the cards -- kept at a flat 40px per spec, deliberately not stacked with
       .home-hero's own padding (which is 0 on its bottom edge; see above). */
    margin-top:40px;
    /* the fix above (flex:1 1 auto) stopped the PAGE from ever needing to scroll, but the
       front card's own box-shadow (0 22px 40px -18px, ~44px of visible bleed below the
       card) was still getting hard-clipped right at .view's bottom edge -- because the
       card's own box, via the abs-positioned-child containing-block rule, extends to
       stack-wrap's exact outer edge regardless of stack-wrap's own padding (padding is
       INCLUDED in that containing block, so it creates no usable slack below the card).
       The only way to give the shadow real room to render is to reserve genuine empty
       space *below* stack-wrap's box, inside .view, via a margin -- which flexbox still
       correctly subtracts from what flex:1 1 auto claims as "remaining space", so the
       page still never needs to scroll. 48px comfortably covers the shadow's ~44px bleed. */
    /* was a flat 48px (round 8, sized to cover the front card's own ~44px shadow bleed).
       Round 21: the user asked for the cards to leave a deliberate, screen-size-aware
       gap above #tabbar specifically (24px above the pill), not just enough room for
       the shadow -- so this is now driven by --stack-clearance, a custom property JS
       sets via updateStackClearance() (measuring #tabbar's actual rendered position,
       recalculated on every render() and on resize/orientationchange) rather than a
       second hardcoded number that could drift out of sync with the pill's own real
       height/offset. 48px remains the fallback (same as before) for the instant before
       that JS runs, and for any screen where #tabbar isn't shown at all (day-detail),
       where the plain shadow-bleed reasoning above still applies unchanged. */
    margin-bottom:var(--stack-clearance, 48px);
    padding:2px 0 14px;
    /* was pan-y -- but a real finger drag is never perfectly horizontal, so the
       browser's own vertical-pan gesture kept hijacking the drag-to-browse
       gesture as a native scroll/bounce (fine on mouse/trackpad, broken on
       touch). This zone's only job is the custom horizontal drag below, so it
       should fully opt out of native panning instead of partially allowing it. */
    touch-action:none;
    perspective:1600px;
  }
  .stack-card{
    position:absolute;
    top:50%; left:50%;
    width:min(320px, 82%); /* was 300px */
    height:100%;
    border-radius:22px;
    cursor:pointer;
    border:0; padding:0; margin:0; font:inherit; color:inherit; text-align:left;
    background:none;
    /* release-into-place snap after a drag (NOT the day open/close flip, which is a
       separate, protected animation elsewhere). Originally .5s with a curve that decelerated
       almost immediately, so nearly all the motion happened in the first sliver of the
       duration and the rest was an imperceptible creep -- that read as an abrupt snap
       regardless of the total time. Switched to a gentle spring/overshoot curve (settles
       slightly past rest, then eases back) which reads as a natural physical "landing"
       instead of a robotic stop. */
    transition:transform .6s cubic-bezier(.34,1.56,.64,1), opacity .5s ease, box-shadow .3s ease;
    box-shadow:0 22px 40px -18px rgba(0,0,0,.55);
    perspective:1600px;
    -webkit-tap-highlight-color:transparent;
  }
  .stack-card.dragging{ transition:none; cursor:grabbing; }
  /* box-shadow gets its own fast transition here so it can be snuffed out quickly the
     moment a card starts flipping (a huge fullscreen box with a small fixed-size card
     shadow looks wrong) and brought back in once it lands, without waiting on the much
     slower top/left/width/height box-morph */
  .stack-card.opening{ transition:top .52s cubic-bezier(.4,0,.2,1), left .52s cubic-bezier(.4,0,.2,1), width .52s cubic-bezier(.4,0,.2,1), height .52s cubic-bezier(.4,0,.2,1), border-radius .52s cubic-bezier(.4,0,.2,1), box-shadow .18s ease; }
  .flip-inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .56s cubic-bezier(.65,0,.35,1); border-radius:inherit; }
  .stack-card.flipped .flip-inner{ transform:rotateY(180deg); }
  .flip-face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden; border-radius:inherit; }
  .flip-back{ transform:rotateY(180deg); background:var(--bg); overflow-y:auto; }
  .flip-back::-webkit-scrollbar{ width:0; }
  /* clip-path (not overflow+border-radius) because a filtered descendant inside a
     preserve-3d ancestor (the flip) doesn't get clipped reliably by overflow:hidden
     in Chromium -- clip-path is a compositor-level clip and isn't affected */
  .stack-card .hero{ position:absolute; inset:0; border-radius:inherit; overflow:hidden; clip-path:inset(0 round 22px); -webkit-clip-path:inset(0 round 22px); }
  .stack-card.locked .hero{ filter:grayscale(1) blur(5px) brightness(.6) contrast(1.05); }
  .stack-card .shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 42%, rgba(0,0,0,.74) 100%); }
  .stack-card .content{ position:absolute; left:17px; right:17px; bottom:16px; color:#F3EEE1; opacity:0; transition:opacity .3s ease; }
  .stack-card.is-front .content{ opacity:1; }
  /* day-date now doubles as the card's only top-of-card-style label ("SAT 26 SEP · Day
     2/10") -- the old top-right "#02 / 10" frame-no badge was removed as redundant with it. */
  .stack-card .day-date{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:12px; letter-spacing:.08em; opacity:.85; text-transform:uppercase; }
  .stack-card .day-title{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:600; font-size:23px; margin-top:4px; }
  .stack-card .day-teaser{ font-size:14px; margin-top:5px; opacity:.92; line-height:1.4; }
  /* status-pill is now only ever rendered (in JS) for locked cards -- unlocked (journal /
     active) cards no longer carry a status label at all, so the .active background-color
     override that used to color it for "in progress" days no longer applies to anything. */
  .stack-card .status-pill{
    position:absolute; top:13px; left:15px;
    font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:12px; letter-spacing:.08em;
    padding:4px 9px; border-radius:20px; text-transform:uppercase;
    background:rgba(0,0,0,.35); color:#F3EEE1;
    opacity:0; transition:opacity .3s;
  }
  .stack-card.is-front .status-pill{ opacity:1; }
  .stack-card:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* ---- day detail ---- */
  .dayhead{
    display:flex; align-items:center; justify-content:flex-end;
    /* was space-between (back button on the left, reset on the right) -- the back
       button is gone now (see .close-fab below), so this row only ever holds the
       optional day-2 reset button and just needs to keep it pinned to the right.
       Still kept as a real row (not dropped from days without a reset button) purely
       for its own env(safe-area-inset-top) padding, which is what actually clears the
       iPhone status bar/clock for the title/teaser text that follows it. */
    padding:calc(env(safe-area-inset-top, 0px) + 16px) 24px 12px;
    /* round 27: was min-height:34px (the close button's own diameter, padding-bottom
       8px) -- still read as too tight/overlapping on a real device (the button's own
       box-shadow bleeds a few px past its 34px box, and safe-area-inset-top can round
       differently than in a simulator), on both the day-detail and Stays-detail
       screens. Bumped to a clearer 44px min-height plus 12px bottom padding, pushing
       the title text (.backhero-text) further below the fixed .close-fab (top:safe+14,
       34px tall, bottom edge at safe+48) with real margin to spare rather than a
       precise but fragile 10px gap. */
    min-height:44px;
    gap:8px; position:relative; z-index:5;
  }
  /* ---- floating close button (day-detail screen) ----
     Replaces the old inline "< The Reel" back button/label. That button scrolled away
     with the rest of .dayhead's content, so it wasn't reachable once you'd scrolled
     down a chapter list. This is `position:fixed` (not part of the scrolling .view
     content's normal flow) so it always stays put in the top-left corner, the same
     way .refresh-fab already does in the top-right on the home/intro screens -- same
     size/shape/shadow recipe, mirrored to the opposite corner, an X instead of a
     refresh glyph. Rendered as part of the day-detail screen's own HTML (not a
     persistent sibling of #screen like .refresh-fab) since it only ever needs to
     exist while state.screen==='day' -- render() naturally removes it on any other
     screen, no manual [hidden] toggling required. */
  .close-fab{
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 14px);
    left:14px;
    z-index:50;
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--bg-elevated);
    color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.14);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease;
  }
  .close-fab:active{ transform:scale(.9); }
  .close-fab svg{ width:14px; height:14px; }
  .resetbtn{
    background:none; border:1px solid var(--line); color:var(--ink-faint);
    font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:12px; letter-spacing:.05em;
    padding:6px 10px; border-radius:20px; cursor:pointer; text-transform:uppercase;
  }

  .backhero-text{ padding:14px 24px 16px; }
  .backhero-text .day-date{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); }
  .backhero-text .day-title{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:600; font-size:25px; margin-top:5px; color:var(--ink); }
  .backhero-text .day-title.hidden-title{ letter-spacing:.14em; opacity:.55; font-weight:500; font-size:17px; }
  .backhero-text .day-teaser{ font-size:14px; margin-top:6px; line-height:1.45; color:var(--ink-soft); }

  .lockednote{ margin:16px 24px 0; font-size:16px; color:var(--ink-faint); line-height:1.5; }
  .lockednote .mono{ color:var(--ink-soft); }

  /* ---- prep strip ---- */
  /* light grey background only, per the Figma design -- this component hasn't been
     otherwise designed yet, so nothing else about it changes here. --frame is the
     existing "sunken/inset surface" token (was already defined, just unused until
     now), so this reuses the token system rather than inventing a one-off grey.
     margin-top:0 (was 16px) -- combined with .backhero-text's own 16px bottom
     padding, that used to add up to a 32px gap above this card; the user wants an
     exact 16px, so the padding alone now supplies it. On the journal-day path
     (.journalflag sits between the header and this card), .journalflag's own
     margin-bottom supplies the same 16px instead -- see its rule below -- so that
     path's spacing is untouched by this change. */
  .prep{ margin:0 24px 0; border:1px solid var(--line); border-radius:16px; background:var(--frame); }
  .prep-row{ display:grid; grid-template-columns:repeat(3,1fr); }
  .prep-cell{ padding:11px 10px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .prep-cell:nth-child(3n){ border-right:0; }
  /* the last row's cells don't need a border-bottom -- it read as a stray separator
     sitting just above the container's own bottom edge/radius, not a real row divider. */
  .prep-row:last-child .prep-cell{ border-bottom:0; }
  .prep-label{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:12px; letter-spacing:.08em; color:var(--ink-faint); text-transform:uppercase; }
  .prep-value{ font-size:14px; margin-top:3px; color:var(--ink); line-height:1.3; }
  .weather-cell{ grid-column:1 / -1; border-right:0; padding:0; cursor:pointer; }
  .weather-top{ display:flex; align-items:center; justify-content:space-between; padding:11px 12px; }
  .weather-left{ display:flex; align-items:center; gap:9px; }
  .weather-temp{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:16px; font-variant-numeric:tabular-nums; }
  .weather-cond{ font-size:14px; color:var(--ink-soft); }
  .weather-caret{ font-size:10px; color:var(--ink-faint); transition:transform .2s; }
  .weather-cell.open .weather-caret{ transform:rotate(180deg); }
  .hourly{ display:grid; grid-template-columns:repeat(6,1fr); gap:2px; padding:0 10px; max-height:0; overflow:hidden; transition:max-height .28s ease, padding .28s ease; border-top:1px solid var(--line); }
  .weather-cell.open .hourly{ max-height:120px; padding:10px 10px 12px; }
  .hr-tick{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .hr-tick .t{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:12px; color:var(--ink-faint); text-transform:uppercase; }
  .hr-tick .v{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:14px; font-variant-numeric:tabular-nums; }

  .lastupdate{ margin:10px 24px 0; font-size:14px; color:var(--ink-faint); font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; display:flex; align-items:center; gap:6px; }
  .lastupdate .dot{ width:5px; height:5px; border-radius:50%; background:#5C8A5C; flex:none; }

  /* ---- chapters ---- */
  /* each chapter is its own floating card now (own background/border/radius/shadow,
     with a real gap between them), not rows joined by shared top/bottom borders in
     one continuous block -- per the Figma design. Gap/padding values below are exact,
     taken from the design's own dev-mode spacing export (16px between cards, 12px
     vertical / 16px horizontal card padding, radius/rounded-lg -> 16px to match the
     rest of the app's card-ish surfaces, e.g. .prep).

     The timeline (dot + dashed connector) lives OUTSIDE the card now, in its own
     48px-wide column to the left -- moved out in a follow-up fix after the first pass
     accidentally left it nested inside the card (as it always had been, pre-redesign).
     .chaprow is the per-chapter flex row (timeline + card); .chapters no longer owns
     the vertical rhythm directly (that's each row's own margin-bottom now), because
     the connecting dashed line needs to bleed past its own row's bottom edge into the
     gap to reach the next dot, which a shared flex `gap` can't do. */
  /* round 24: full-screen Stays detail view (openStayFlip()/closeStayFlip()) -- reuses
     the same .about-item/.about-group rows the bottom-sheet About panel already used
     for stay content (stayAboutHTML()), just laid out as plain flowing page content
     instead of inside a scrollable sheet-body. */
  .stay-detail-body{ margin:28px 24px 8px; display:flex; flex-direction:column; gap:18px; }
  .chapters{ margin:40px 24px 8px; display:flex; flex-direction:column; }
  .chapters-label{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:12px; letter-spacing:.1em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:10px; }
  .chaprow{ display:flex; align-items:stretch; margin-bottom:16px; }
  .chaprow.last{ margin-bottom:0; }
  /* width:32px (was 48px) so the card sits a clean 16px from the dot's center instead
     of 32px -- the dot's own `left` below is now a fixed 16px (not a 50%-based calc)
     so shrinking this column doesn't also drag the dot itself further left; only the
     card moves closer. */
  .timeline{ position:relative; flex:none; width:32px; }
  /* z-index so the dot always paints over the dashed line, not the other way round --
     the line's start/end deliberately reach all the way to each dot's CENTER (see
     .tl-line below), relying on this stacking to hide the overlap cleanly rather than
     needing to stop exactly at the dot's edge (which would be fragile to any future
     change in dot size). */
  /* background:var(--bg) (not transparent) on the outline states so the dashed line
     passing behind the dot's own circle is fully hidden by it, not visible through it
     -- var(--bg) because the timeline column sits on the page background, not a card.
     box-shadow adds a 4px solid halo in that same background color around every dot,
     on top of the line-hiding fill above -- so the dashed line visibly stops short of
     each dot with a gap, instead of appearing to run directly into it. A box-shadow
     (not a wider border) keeps the dot's own visual size/border-radius unchanged. */
  /* top:18px + width:9px puts the dot's own center 22.5px below the card's top edge,
     matching the measured vertical center of .ctitle's line box (12px card padding-top
     + a few px of line-height leading above the 16px glyph) -- was 24px, which sat the
     dot about 6px too low relative to the title text. left:16px is a fixed value (not
     a 50%-based calc) so it stays put regardless of .timeline's own width. */
  .tl-dot{
    position:absolute; top:18px; left:16px; transform:translateX(-50%); z-index:1;
    width:9px; height:9px; border-radius:50%;
    border:1.5px solid var(--ink-faint); background:var(--bg);
    box-shadow:0 0 0 4px var(--bg);
  }
  .tl-dot.revealed{ background:var(--accent); border-color:var(--accent); }
  /* "on the way" is an outline, same treatment as the default/hidden dot, just in the
     accent red instead of --ink-faint grey -- was a half-filled gold conic-gradient
     before; simplified to outline-only per the user's request. */
  .tl-dot.ontheway{ border-color:var(--accent); }
  /* spans from THIS row's dot center to the NEXT row's dot center (bottom:-34px =
     .chaprow's 16px margin-bottom + the next dot's own 18px top offset), so it reaches
     the next dot fully regardless of how tall this card's content makes the row -- no
     JS measurement needed. Was previously only bleeding -16px (just the margin, not
     the next dot's offset on top of it), which left a visible gap before the next dot;
     now it deliberately overshoots to the dot's center on both ends and relies on the
     dot's z-index (above) to paint over the overlap. The last row has no next dot to
     reach, so it stops at its own bottom instead. left:16px matches .tl-dot's fixed
     left value; margin-left:-1px centers the 2px border-left strip exactly on that
     16px line (a border is painted starting AT the box's left edge, not straddling it,
     so without this the dash sits ~2px right of the dot's true center instead of
     running through it). */
  .tl-line{ position:absolute; top:18px; left:16px; bottom:-34px; margin-left:-1px; border-left:2px dashed var(--ink-faint); opacity:.45; }
  .chaprow.last .tl-line{ bottom:0; }
  .chapter{
    flex:1; min-width:0; position:relative; overflow:hidden;
    background:var(--bg-elevated); border:1px solid var(--line); border-radius:16px;
    padding:12px 16px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
  }
  /* locked/not-yet-revealed chapters (ch.state==='hidden') get no shadow -- a flat
     card, to read as visually inert/inactive compared to the revealed and on-the-way
     cards, which keep the shadow. */
  .chapter.hidden{ box-shadow:none; }
  .ctitlerow{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .ctitle{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:500; font-size:16px; }
  .ctitle.dim{ font-style:italic; color:var(--ink-faint); font-weight:400; }
  .ctag{ flex:none; font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:12px; letter-spacing:.05em; color:var(--ink-faint); border:1px solid var(--line); padding:2px 6px; border-radius:5px; }
  .cblurb{ font-size:16px; color:var(--ink-soft); margin-top:3px; line-height:1.42; }
  .cmeta{ font-size:14px; color:var(--ink-faint); margin-top:5px; font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; }

  .herebtn{
    margin-top:9px; display:inline-flex; align-items:center; gap:6px;
    background:var(--accent); color:var(--bg); border:0; border-radius:20px;
    font:inherit; font-size:16px; font-weight:500; padding:8px 16px; cursor:pointer;
  }
  .herebtn:hover{ background:var(--accent-soft); }
  .fallbacklink{ margin-top:8px; background:none; border:0; padding:0; font:inherit; font-size:14px; color:var(--ink-faint); text-decoration:underline; text-underline-offset:2px; cursor:pointer; display:block; }
  .fallbacklink:hover{ color:var(--ink-soft); }

  .confirmrow{ margin-top:9px; display:flex; flex-direction:column; gap:8px; background:var(--bg-elevated); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .confirmtext{ font-size:14px; color:var(--ink-soft); }
  .confirmbtns{ display:flex; gap:8px; }
  .confirmyes{ background:var(--accent); color:var(--bg); border:0; border-radius:16px; font:inherit; font-size:14px; font-weight:500; padding:7px 14px; cursor:pointer; }
  .confirmyes:hover{ background:var(--accent-soft); }
  .confirmno{ background:none; border:1px solid var(--line); color:var(--ink-faint); border-radius:16px; font:inherit; font-size:14px; padding:7px 14px; cursor:pointer; }
  .confirmno:hover{ color:var(--ink-soft); }

  /* no leading icon (the design shows plain text, unlike the old chevron+text toggle
     affordance -- makes sense now that this opens a sheet, not an accordion). Size/
     weight set explicitly (14px/500) rather than the earlier pixel-measured guess. */
  .abouttoggle{ margin-top:8px; background:none; border:0; padding:0; font:inherit; font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:500; font-size:14px; color:var(--accent); cursor:pointer; display:inline-flex; align-items:center; gap:4px; }

  /* ---- bottom sheet ----
     replaces the old inline expand/collapse "about" panel (accordion, max-height
     transition) -- tapping the button now opens a modal that slides up from the
     bottom and covers half the screen instead of pushing the page content down.
     Rendered as a sibling of .view (see sheetHTML()/render()) so it isn't clipped by
     .view's own scroll box, and opening/closing it is a same-screen re-render
     (state.sheetAbout), which render()'s scroll-preserving fix keeps from resetting
     the page scroll position underneath -- see the render() comment for why that
     matters. */
  /* round 25: position:absolute instead of fixed, for both this and .sheet-panel below.
     Both are already rendered as direct children of #screen (see sheetHTML()'s own
     comment -- "a sibling of .view"), and #screen already has position:relative plus
     the same reliable height:var(--app-height,100dvh) sizing .ui-layer above reuses
     for #tabbar -- so #screen was ALREADY the correct containing block sitting right
     there; these two just weren't using it, and were resolving `inset:0`/`bottom:0`
     against the browser's own large-viewport concept instead, same underlying bug as
     #tabbar's (see .ui-layer's comment), which is what the user meant by "it actually
     feels like the same margin problem for the top nav bar" -- it was. This replaces
     positionSheetForIOS()'s JS-computed top/height (now deleted) with the plain
     `inset:0` / `bottom:0;height:50%` this already had; no new element needed. */
  .sheet-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,0); transition:background .28s ease; z-index:80; touch-action:none; }
  /* darker than a typical .4-.45 scrim (round 17 follow-up, was rgba(0,0,0,.44)) so the
     content behind the sheet reads as clearly backgrounded/non-interactive instead of
     still competing for attention -- kept in sync with the two matching values inside
     wireSheetDrag() (drag tracks this same darkness 1:1 as the sheet is pulled open/
     closed by hand, not just the two CSS-transition endpoints). */
  .sheet-backdrop.open{ background:rgba(0,0,0,.65); }
  .sheet-panel{
    position:absolute; left:0; right:0; bottom:0; height:50%; z-index:81;
    background:var(--bg-elevated); border-radius:20px 20px 0 0;
    box-shadow:0 -12px 32px rgba(0,0,0,.18);
    display:flex; flex-direction:column; overflow:hidden;
    transform:translateY(100%); transition:transform .32s cubic-bezier(.22,1,.36,1);
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .sheet-panel.open{ transform:translateY(0); }
  /* dragging (see wireSheetDrag()) sets transform/transition inline directly on this
     element while a gesture is active/settling, always out-ranking the class rules
     above -- same "inline beats class" fact the round-4/7 animation bug was about,
     used deliberately here instead of fought. */
  .sheet-handle{
    width:36px; height:4px; border-radius:2px; background:var(--line); margin:10px auto 0; flex:none;
    touch-action:none; /* this row's only job is the drag-to-dismiss gesture, never scrolling */
  }
  /* iOS-modal-style header: a fixed-width close button on the left, the title truly
     centered (not just flex-centered around whatever the close button's own width
     happens to be) via a 3-column grid whose outer tracks are both pinned to the
     close button's own footprint (32px) -- so the title's center lines up with the
     panel's center regardless of title length, matching the platform convention this
     was asked to feel like. touch-action:none for the same reason as .sheet-handle:
     this row doesn't scroll, it only starts a drag (see wireSheetDrag() -- the close
     button itself is explicitly excluded from that, so it keeps working as a plain
     tap target). `position:sticky` + a solid background pins it to the panel's own
     top edge for real (round-17 follow-up ask) -- it was already effectively fixed in
     practice (a flex:none row above the one scrolling child, never inside the scroll
     box), but this makes that literal rather than incidental, and matters once
     anything else about the panel's layout changes later. Bottom padding widened from
     0 to 18px (was flush against .sheet-body's own top padding) for real breathing
     room between the header and the first row of content, also asked for. */
  .sheet-header{
    position:sticky; top:0; z-index:2; background:var(--bg-elevated);
    display:grid; grid-template-columns:32px 1fr 32px; align-items:center; gap:8px;
    padding:10px 16px 18px; flex:none; touch-action:none;
  }
  .sheet-title{ grid-column:2; text-align:center; font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:16px; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sheet-close{
    grid-column:1; width:32px; height:32px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--frame); border:0; color:var(--ink-soft); cursor:pointer;
  }
  .sheet-close:hover{ color:var(--ink); }
  /* round 27: gap was 10px -- user asked for more breathing room between each
     "Why it matters" / "A little context" / "Look for" ... section in this list.
     Bumped by 8px across the board (here, .about-group-rows and .stay-detail-body
     below, which are the three places this same row list can appear). */
  .sheet-body{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; display:flex; flex-direction:column; gap:18px; padding:14px 24px 24px; }
  .about-item .k{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:12px; letter-spacing:.07em; color:var(--reveal); text-transform:uppercase; }
  .about-item .v{ font-size:16px; color:var(--ink-soft); line-height:1.45; margin-top:2px; }
  /* grouped About panels (content-upgrade round) -- a chapter's `about` can now be either
     the original flat [label,value] row list (rendered exactly as before), or a list of
     named sub-places (Shibuya's About panel opening into "Shibuya Crossing", "Hachiko",
     etc). A chapter with exactly ONE group (e.g. nightlife/MITSUKI) renders it plain and
     always-expanded, same as before -- the collapse UI below only kicks in once there's
     actually more than one place to choose between. */
  .about-group + .about-group{ margin-top:10px; padding-top:18px; border-top:1px solid var(--line); }
  .about-group-head{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:2px; }
  .about-group-title{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:600; font-size:16px; color:var(--ink); }
  .about-group-tag{ flex:none; font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:11px; letter-spacing:.05em; color:var(--ink-faint); text-transform:uppercase; }
  .about-group-rows{ display:flex; flex-direction:column; gap:18px; margin-top:8px; }
  /* ---- collapsible variant: more than one place in this chapter's About panel ----
     Rendered as a flat list of tappable rows (not the plain-group layout above), each
     starting collapsed; opening one closes whichever other row was open (see the
     data-group-toggle handler in wireCommon()). Reuses .about-group-rows/.about-item
     unchanged for the revealed content -- only the row chrome and the collapse
     mechanics are new. */
  .about-group.collapsible{ border-top:1px solid var(--line); margin-top:0; padding-top:0; }
  .about-group.collapsible:first-child{ border-top:0; }
  .about-group-toggle{
    display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
    background:none; border:0; padding:12px 0; margin:0; font:inherit; text-align:left; cursor:pointer; color:inherit;
  }
  .about-group-toggle .about-group-title{ font-weight:500; }
  .about-group-headright{ display:flex; align-items:center; gap:8px; flex:none; }
  .about-group-caret{ display:flex; color:var(--ink-faint); transition:transform .2s ease; }
  .about-group-caret svg{ width:10px; height:10px; }
  .about-group.collapsible.open .about-group-caret{ transform:rotate(90deg); }
  .about-group-collapse{ max-height:0; overflow:hidden; transition:max-height .3s cubic-bezier(.22,1,.36,1); }
  .about-group-collapse .about-group-rows{ padding-bottom:14px; }
  @media (prefers-reduced-motion: reduce){ .sheet-backdrop, .sheet-panel, .about-group-collapse, .about-group-caret{ transition:none; } }

  @keyframes sweep{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(200%); }
  }
  .chapter.justrevealed::before{
    content:''; position:absolute; inset:0; width:60%;
    background:linear-gradient(100deg, transparent, rgba(184,90,52,.22), transparent);
    animation:sweep .9s ease;
    pointer-events:none;
  }
  @media (prefers-reduced-motion: reduce){ .chapter.justrevealed::before{ animation:none; display:none; } }

  /* ---- tomorrow stub ---- */
  /* background matches .prep (the weather/day-details block up top) -- both are
     var(--frame), the same "inset/sunken surface" token, so the two bookend cards
     of the day-detail view read as a consistent pair. Was unstyled (page background
     showing through) in the dashed/not-ready state and --bg-elevated in the solid/
     ready state; both now share --frame, differing only in border-style. */
  .tomorrow{ margin:6px 24px 26px; border:1px dashed var(--line); border-radius:14px; padding:13px 14px; background:var(--frame); }
  .tomorrow.ready{ border-style:solid; }
  .tomorrow-label{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:12px; letter-spacing:.1em; color:var(--ink-faint); text-transform:uppercase; }
  .tomorrow-text{ font-size:16px; color:var(--ink-soft); margin-top:6px; line-height:1.45; }
  .tomorrow.ready .tomorrow-text{ color:var(--ink); }

  /* margin-bottom:16px (was 0) preserves the previous gap down to .prep now that
     .prep's own margin-top has been zeroed out (see the .prep rule above) -- keeps
     the journal-day path's spacing unchanged while the non-journal path picks up
     the new, smaller 16px total gap from .backhero-text's padding alone. */
  .journalflag{ margin:6px 24px 16px; font-size:14px; color:var(--ink-faint); font-style:italic; }

  /* ---- reload-latest button (top-right, all screens) ---- */
  .refresh-fab{
    position:fixed;
    top:calc(env(safe-area-inset-top,0px) + 14px);
    right:14px;
    z-index:50;
    width:34px; height:34px;
    border-radius:50%;
    border:1px solid var(--line);
    background:var(--bg-elevated);
    color:var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 2px 10px rgba(0,0,0,.14);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease, opacity .15s ease;
  }
  .refresh-fab[hidden]{ display:none; } /* the class below sets display:flex, which
    would otherwise out-rank the UA's [hidden] rule and keep it visible */
  .refresh-fab:active{ transform:scale(.9); }
  .refresh-fab.spinning{ pointer-events:none; opacity:.7; }
  .refresh-fab.spinning svg{ animation:refreshspin .7s linear infinite; }
  @keyframes refreshspin{ to{ transform:rotate(360deg); } }

  /* ---- persistent UI layer (round 25) ----
     Exists purely to give #tabbar (and nothing else yet -- scoped to just the element
     that was actually reported broken) a containing block that tracks the real
     viewport the same reliable way .screen does: an explicit height:var(--app-height,
     100dvh) rather than `inset:0`/`bottom:0`, which is what a plain `position:fixed`
     element resolves against the browser's own "large viewport" concept with --
     the thing that on iOS Safari can (a) stay reported as though a floating bottom
     toolbar were docked and taking up space even once it's visually not (the
     standalone-vs-browser-tab "gap" report), or (b) not shrink to leave room for that
     toolbar consistently, letting it sit on top of content instead of the content
     safely stopping short of it. Sibling of #screen (not a child -- see the HTML
     comment above this element for why), so this needs its own independent height
     source; reuses --app-height rather than inventing a second one. `top:0; left:0`
     are explicit (not relied on via `inset`) so nothing here depends on the same
     large-viewport default this exists to avoid. pointer-events:none so this
     transparent, full-screen layer never intercepts taps meant for #screen
     underneath -- #tabbar turns pointer-events back on for itself below. */
  .ui-layer{
    position:fixed;
    top:0; left:0;
    width:100%;
    height:100dvh;
    height:var(--app-height, 100dvh);
    pointer-events:none;
    z-index:40; /* above .screen's own content, below .sheet-backdrop/.sheet-panel (80/81) */
  }

  /* ---- bottom segmented control bar (Explorer / Stays) ----
     A floating pill, bottom-center, that hugs its content instead of spanning full
     width -- the user was explicit this should read as a small segmented control,
     not a full-width tab bar. Icon-only (no labels), lives inside #ui-layer (a
     persistent sibling of #screen, same as .refresh-fab) so it survives render()
     without re-wiring, shown only on the two screens it actually switches between
     (home/stays) -- see render()'s tabbar[hidden] toggle at the bottom of that
     function. round 25: position:absolute instead of fixed -- see .ui-layer's own
     comment for why; this is what lets a plain CSS `bottom` value work correctly on
     iOS without the JS-computed `top` positionTabbarForIOS() used to need (now
     deleted). Also restores the round-23 value (16px from the bottom) for every
     platform -- the round-24 iOS-only 8px override existed only to compensate for
     the large-viewport bug this fix removes at the root. round 25 follow-up: seen live
     on a device (both a Safari tab and standalone), the 16px design gap on top of
     standalone's mandatory 34px safe-area read as noticeably more floaty than the
     Safari-tab pill sitting close under its own chrome -- the user asked for the pill
     to just sit down at the bottom, not hover. Tried 6px first; still read as not low
     enough on a real device. This is now the actual floor: `env(safe-area-inset-bottom)`
     with zero added margin of this app's own -- the pill sits directly flush against
     the mandatory safe-area boundary (34px on standalone, since that's Apple's own
     home-indicator gesture-zone contract and can't shrink; 0px in a Safari tab, where
     Safari's own chrome already owns that strip). There's no lower this can go without
     the pill starting to sit inside the actual system gesture zone, which isn't a
     tuning choice, it's Apple's own reserved area -- if this still doesn't look flush
     enough on a device, that's no longer a "reduce the gap further" problem, it's a
     "something else is adding space" problem. */
  .tabbar{
    position:absolute;
    pointer-events:auto;
    left:50%;
    bottom:env(safe-area-inset-bottom, 0px);
    transform:translateX(-50%);
    z-index:50;
    display:flex; align-items:center; gap:2px;
    background:var(--bg-elevated);
    border:1px solid var(--line);
    border-radius:999px;
    padding:4px;
    /* was 0 8px 24px -8px (24px blur, -8px spread -- a ~20px effective downward reach).
       Round 23: user asked for a smaller shadow, capped at a 12px max spread -- reduced
       blur to 12px and offset-y to 4px to match (4px offset + 12px blur's ~6px per-side
       falloff keeps the total visible reach at roughly 12px, not stacking a separate
       12px on top of the existing offset), spread tightened from -8 to -4 to match the
       smaller blur proportionally. */
    box-shadow:0 4px 12px -4px rgba(0,0,0,.25);
  }
  .tabbar[hidden]{ display:none; }
  /* ---- sliding selection indicator (round 24) ----
     Previously each button's own background/color just snapped between "on"/"off" --
     the user asked for the highlight to smoothly slide sideways between the two
     options instead, like a native iOS segmented control. Implemented as a single
     pill sitting BEHIND both buttons (z-index 0, buttons at z-index 1) that translates
     between the two button slots, rather than animating each button's own background
     -- animating one shared element's transform is what produces the "sliding" look;
     cross-fading two separately-colored buttons would not. `calc(100% + 2px)` (not a
     fixed px value) rides on the indicator's own width already matching a button's
     width exactly, plus the row's 2px button gap -- so this keeps working correctly
     without a matching JS-measured pixel value if a button's size ever changes. */
  .tabbar-indicator{
    position:absolute; top:4px; left:4px;
    width:44px; height:40px; border-radius:999px;
    background:var(--accent);
    transition:transform .28s cubic-bezier(.4,0,.2,1);
    z-index:0;
    pointer-events:none;
  }
  .tabbar-indicator.right{ transform:translateX(calc(100% + 2px)); }
  @media (prefers-reduced-motion: reduce){ .tabbar-indicator{ transition:none; } }
  .tabbar-btn{
    position:relative; z-index:1;
    width:44px; height:40px;
    display:flex; align-items:center; justify-content:center;
    border:0; border-radius:999px; background:transparent;
    color:var(--ink-faint); cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:color .18s ease;
  }
  .tabbar-btn:active{ transform:scale(.92); }
  /* background removed here (round 24) -- the sliding .tabbar-indicator behind the
     buttons supplies the accent-red fill now; .on only needs to flip the icon color */
  .tabbar-btn.on{ color:#fff; }
  /* ---- tabbar icons: external SVG files, colorable via mask (round 24) ----
     The user supplied their own cards.svg/stays.svg (pushed to the repo root, same
     folder as index.html) to replace the inline hand-drawn glyphs. An <img src="...">
     can't be recolored to match .tabbar-btn's current/inactive text color the way the
     old inline `stroke="currentColor"` SVG could -- so these are applied as a CSS
     mask instead: `background:currentColor` supplies the actual visible color (so it
     still inherits .tabbar-btn's color/`.on` white exactly like before), and
     `mask-image` supplies the icon's SHAPE only, from the external file. If
     cards.svg/stays.svg aren't present in the deployed folder, this renders as a
     blank icon (no error, no broken-image glyph) rather than breaking the button. */
  .tabbar-icon{
    display:block; width:19px; height:19px;
    background:currentColor;
    -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
    -webkit-mask-position:center; mask-position:center;
    -webkit-mask-size:contain; mask-size:contain;
  }
  .tabbar-icon-cards{ -webkit-mask-image:url('cards.svg'); mask-image:url('cards.svg'); }
  .tabbar-icon-stays{ -webkit-mask-image:url('stays.svg'); mask-image:url('stays.svg'); }

  /* ---- Stays screen: mosaic/bento grid ----
     Matches the shape of the wireframe the user sent: one full-width card on top,
     then two columns below it -- two smaller cards stacked in the left column, one
     tall card spanning both rows in the right column. Expressed with named grid
     areas rather than nth-child math so the shape stays legible and easy to re-tune. */
  /* top padding removed here -- .home-hero (rendered inside .stays-view, same as on
     the home/Explorer screen) already reserves calc(safe-area-top + 24px) of its own
     top padding, so stacking .stays-view's own top padding on top of that pushed the
     whole Stays screen (hero + grid) down noticeably further than the Explorer
     screen's hero sits. Horizontal/bottom padding unchanged. */
  .stays-view{ padding:0 20px calc(env(safe-area-inset-bottom, 0px) + 110px); }
  /* round 24: the old .stays-head ("Stays" / "Where you're sleeping...") is gone --
     the user asked for the same top hero the Explorer screen uses (mark + "japan
     slowly" wordmark + date range, via the same heroMarkupHTML()/.home-hero the home
     screen renders) for visual consistency between the two tabs, rather than each
     screen having its own distinct header treatment. staysScreen() now wraps
     heroMarkupHTML() in a plain .home-hero the same way homeScreen() does -- no
     Stays-specific header CSS needed any more. */
  .stays-view .home-hero{ margin-bottom:28px; }
  .stays-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    /* round 25: reverted round 24's left1/left2 sizing -- left1 (Stay 2,
       Kiso-Fukushima, a single-night stop) was reading as the larger of the two left
       cards, while left2 (Stay 3, Gion, a 3-night stop) read as the smaller one --
       backwards relative to how long each stay actually is. Swapped back so left1's
       row is the smaller 105px and left2's row is the larger 145px. The tall right
       card spans both rows either way, so its total height is unaffected. */
    grid-template-rows:150px 105px 145px;
    grid-template-areas:"top top" "left1 right" "left2 right";
    gap:12px;
    /* round 24: "center the grid the same way we do for the cards" -- the home
       deck's cards cap at min(320px, 82%) and sit centered; this grid needs to be
       wider than a single card (it's two columns), so it caps at a proportionally
       similar but wider value instead of stretching to the full available width. */
    max-width:min(400px, 94%);
    margin:0 auto;
  }
  .stay-card{
    position:relative; overflow:hidden; border-radius:20px;
    border:0; padding:0; text-align:left; cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    /* round 26: was 0 10px 22px -14px -- read as basically invisible against the
       grid's own background (the -14px spread was eating almost all of the 22px
       blur). Two layers now: a soft, wide-spread ambient shadow plus a tighter,
       darker contact shadow close under the card, the same recipe modern card UIs
       use for a shadow that reads clearly without looking heavy. */
    box-shadow:0 16px 28px -12px rgba(0,0,0,.32), 0 5px 10px -4px rgba(0,0,0,.22);
    /* round 26: simplified from a 3D flip to a plain box expand/collapse -- see
       openStayFlip()/closeStayFlip(). .opening's transition covers the box-morph
       (top/left/width/height/border-radius); the plain `transition` here just
       covers the resting hover/settle box-shadow case. */
    transition:box-shadow .3s ease;
  }
  .stay-card:active{ transform:scale(.98); }
  .stay-card.locked{ cursor:default; }
  .stay-card.opening{ transition:top .52s cubic-bezier(.4,0,.2,1), left .52s cubic-bezier(.4,0,.2,1), width .52s cubic-bezier(.4,0,.2,1), height .52s cubic-bezier(.4,0,.2,1), border-radius .52s cubic-bezier(.4,0,.2,1), box-shadow .18s ease; }
  /* ---- round 26: "zoom to white, then grow" open/close flash ----
     A thin overlay (the page's own --bg tone, not necessarily pure white, so it also
     reads correctly in dark mode) that briefly covers the card: a quick zoom+fade-in
     right at the tap (openStayFlip's phase A), stays opaque white through the whole
     box-morph grow/shrink (so the visible motion during that phase is a plain white
     rectangle changing size, not the photo itself), then fades back out once the box
     has landed, revealing whatever's now underneath (the detail screen on open, the
     card's own photo on close). `.stay-flash-fixed` is the same overlay repositioned
     as `position:fixed` for the brief moment it needs to survive a render() swap
     (openStayFlip's phase C) or bridge the live view being torn down (closeStayFlip's
     phase A) -- render() replaces #screen's innerHTML wholesale, so anything that
     needs to outlive that swap has to be reparented outside #screen first. */
  .stay-flash{ position:absolute; inset:0; background:var(--bg); opacity:0; pointer-events:none; z-index:5; }
  .stay-flash-fixed{ position:fixed; inset:0; background:var(--bg); opacity:1; pointer-events:none; z-index:600; }
  .stay-card[data-area="top"]{ grid-area:top; }
  .stay-card[data-area="left1"]{ grid-area:left1; }
  .stay-card[data-area="left2"]{ grid-area:left2; }
  .stay-card[data-area="right"]{ grid-area:right; }
  .stay-card .hero{ position:absolute; inset:0; }
  .stay-card.locked .hero{ filter:grayscale(1) blur(4px) brightness(.6) contrast(1.05); }
  .stay-card .shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 45%, rgba(0,0,0,.7) 100%); }
  .stay-card .content{ position:absolute; left:14px; right:14px; bottom:12px; color:#F3EEE1; }
  .stay-card .stay-label{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:600; font-size:15px; }
  .stay-card .stay-range{ font-size:11px; opacity:.85; margin-top:2px; letter-spacing:.03em; }
  .stay-card .status-pill{
    position:absolute; top:11px; left:12px;
    font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:700; font-size:10px; letter-spacing:.07em;
    padding:3px 8px; border-radius:20px; text-transform:uppercase;
    background:rgba(0,0,0,.4); color:#F3EEE1;
  }
  /* ---- Stay detail sheet body (open point) ----
     Reuses the same .about-item row styling the day-chapter sheet already has, plus
     a small explicit "TBD" note so nobody mistakes the placeholder for real content. */
  .stay-tbd-note{
    font-size:13px; color:var(--ink-faint); line-height:1.5;
    background:var(--frame); border-radius:12px; padding:10px 12px;
  }

</style>

<div class="screen" id="screen"></div>

<!-- Lives outside #screen (which render() fully replaces on every navigation) so it
     persists across home/day views without being re-wired each time. Installed as a
     standalone home-screen app there's no browser chrome at all -- no address bar,
     no pull-to-refresh, no way to get a fresh copy of the page except force-quitting
     and reopening the app. This gives an explicit, always-visible way to grab the
     latest published version instead. -->
<button id="refreshBtn" class="refresh-fab" aria-label="Reload latest version" title="Reload latest version">
  <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
</button>

<!-- round 25: #tabbar's real containing block -- full reasoning lives on .ui-layer's
     CSS rule below. Rounds 22-24 tried to fix #tabbar's position by leaving it
     `position:fixed` directly on the page and computing its `top` in JS every time
     the viewport changed (positionTabbarForIOS(), now deleted) -- structurally
     reasonable, but it was working around a `position:fixed` element's containing
     block being the browser's own ambiguous "large viewport" on iOS Safari, which is
     also the reason .screen itself moved off plain CSS sizing and onto a JS-measured
     --app-height custom property (round 20). Rather than hand-roll that same fix a
     second time for #tabbar, this wraps it in a persistent element that's sized with
     that exact same already-proven --app-height mechanism, so #tabbar can go back to
     being plain, static CSS (`position:absolute; bottom:...`) and never needs its own
     JS at all. Still a sibling of #screen, same reason as #refreshBtn: it must
     survive render()'s full innerHTML rebuild of #screen without being re-wired on
     every navigation. -->
<div id="uiLayer" class="ui-layer">
  <!-- Bottom segmented control (Explorer / Stays). -->
  <div id="tabbar" class="tabbar" hidden>
    <span class="tabbar-indicator" id="tabbarIndicator"></span>
    <button class="tabbar-btn" id="tabExplore" aria-label="Explorer" title="Explorer">
      <span class="tabbar-icon tabbar-icon-cards"></span>
    </button>
    <button class="tabbar-btn" id="tabStays" aria-label="Stays" title="Stays">
      <span class="tabbar-icon tabbar-icon-stays"></span>
    </button>
  </div>
</div>

<script>
(function(){

  /* ---------- real viewport height (belt-and-suspenders for iOS standalone PWA) ----------
     Round 20 switched .screen from `100svh` to `100dvh` to close a dead-space gap at the
     bottom of the screen. That fix is correct for the general "Safari tab, address bar
     shows/hides" case, but the user then reported the gap specifically when the app is
     ADDED TO THE HOME SCREEN and opened standalone (no browser chrome at all) -- which
     `dvh`'s own definition shouldn't be affected by (there's no chrome to dynamically
     account for), but iOS's actual WebKit implementation has a long-documented history of
     getting `dvh`/`vh` wrong specifically in standalone `display-mode`. CSS alone can't work
     around a viewport-unit bug in the engine computing that unit -- so this measures the
     real visible height directly and exposes it as `--app-height`, which `.screen` now
     prefers via `var(--app-height, 100dvh)` -- `100dvh` stays as the fallback for the
     instant before this runs, or on any environment where this script is blocked.
     Round 20 follow-up #2: that JS fix STILL didn't close the gap, and the user's own
     description of what they saw pinned down why -- other sites don't reserve any space
     for Safari's bottom bar at all ("it's floating"), matching iOS 15+'s compact/floating
     tab-bar mode, where Safari's own chrome overlays on top of the page instead of
     docking and resizing the page's layout viewport. `window.innerHeight` reflects the
     LAYOUT viewport, which in this floating-chrome mode can still be reported as though
     the bar were docked and taking up permanent space, even though visually it no longer
     is. `window.visualViewport.height` is the API actually designed for this exact
     situation -- it tracks the real visible/rendered area, correctly shrinking only for
     things that truly overlay content (the keyboard, a floating toolbar) -- so this now
     prefers it over `innerHeight` wherever it's available (all real iOS Safari versions
     that have the floating-bar behavior in the first place; falls back to `innerHeight`
     only on the rare engine with no visualViewport support at all). */
  function setAppHeight(){
    var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h + 'px');
  }
  setAppHeight();

  /* ---------- home-deck bottom clearance above #tabbar (round 21) ----------
     The user asked for the home screen's card deck to resize with the screen and leave
     a deliberate 24px gap above the floating Explorer/Stays segmented control, rather
     than a flat shadow-bleed-only margin that doesn't know the pill is there. Reads
     #tabbar's own ACTUAL rendered position (not a second, easily-drifting recalculation
     of its CSS formula) so this stays correct even if the pill's own size/offset/safe-
     area math ever changes independently -- one source of truth, measured, not
     duplicated. Only applies while #tabbar is actually visible (home/stays screens);
     everywhere else falls back to the plain 48px shadow-bleed value, unchanged from
     round 8. Called from render() (so it's current after every navigation/re-render)
     and from resize/orientationchange (so rotating the device or a viewport-size change
     recalculates it without needing a full re-render). */
  function updateStackClearance(){
    var wrap = document.querySelector('.stack-wrap');
    if(!wrap) return; // not on the home screen right now -- nothing to size
    var tabbar = document.getElementById('tabbar');
    var screenEl = document.querySelector('.screen');
    if(tabbar && !tabbar.hidden && screenEl){
      var tabRect = tabbar.getBoundingClientRect();
      var screenRect = screenEl.getBoundingClientRect();
      var clearance = Math.round((screenRect.bottom - tabRect.top) + 24);
      document.documentElement.style.setProperty('--stack-clearance', Math.max(48, clearance) + 'px');
    } else {
      document.documentElement.style.removeProperty('--stack-clearance'); // falls back to the CSS default (48px)
    }
  }

  /* ---------- iOS platform check ----------
     Kept for the diagnostics panel (it reports this alongside navigator.platform/
     userAgent) even though, as of round 25, nothing here branches on it for layout
     any more -- see .ui-layer's CSS comment for why rounds 22-24's iOS-only JS
     repositioning (positionTabbarForIOS()/positionSheetForIOS(), both deleted this
     round) turned out to be working around a fixable containing-block issue rather
     than a platform difference that genuinely needed its own code path. isIOS also
     matches iPadOS 13+, which reports its platform as "MacIntel" but exposes touch
     points, unlike a real Mac. */
  var isIOS = /iP(hone|od|ad)/.test(navigator.platform) ||
    (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);

  /* ---------- single consolidated viewport-change handler ----------
     Just setAppHeight() + updateStackClearance() as of round 25 -- #tabbar and
     .sheet-panel/.sheet-backdrop no longer need their own JS repositioning (they're
     plain CSS now, see .ui-layer's and .sheet-backdrop's comments), so there's
     nothing left for them to do here. updateStackClearance() still needs to run
     after setAppHeight() (it measures #tabbar's live rendered position, which CSS
     derives from --app-height, so --app-height has to be current first). */
  function onViewportChange(){
    setAppHeight();
    updateStackClearance();
  }
  window.addEventListener('resize', onViewportChange);
  window.addEventListener('orientationchange', onViewportChange);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', onViewportChange);

  /* ---------- noise texture ---------- */
  function noiseDataURL(size){
    var c=document.createElement('canvas'); c.width=c.height=size;
    var ctx=c.getContext('2d');
    var id=ctx.createImageData(size,size);
    for(var i=0;i<id.data.length;i+=4){
      var v=Math.floor(Math.random()*255);
      id.data[i]=v; id.data[i+1]=v; id.data[i+2]=v; id.data[i+3]=Math.random()*70;
    }
    ctx.putImageData(id,0,0);
    return c.toDataURL();
  }
  var NOISE = noiseDataURL(160);
  document.documentElement.style.setProperty('--noise','url('+NOISE+')');

  /* ---------- generative hero moods ---------- */
  var MOODS = {
    1:['#3B4A57','#8C6B4F','#D9A566'],
    2:['#241436','#B23D6B','#3FA6C9'],
    3:['#2E3B2C','#6E7A56','#B7B196'],
    4:['#26312A','#4C5F4B','#8C9A78'],
    5:['#2A2038','#7A4F3A','#C98A4B'],
    6:['#3A2620','#B4552E','#E8A24A'],
    7:['#331E33','#C0344F','#E8B23A'],
    8:['#1F2B22','#3F5C3D','#8FA37A'],
    9:['#2B3A4A','#6E8CAA','#CBD8DE'],
    10:['#3A2E33','#7A5A63','#C7A9A0']
  };

          {group:'Hachiko', tag:'Priority A', rows:[
            ['Why it matters','The bronze dog beside Shibuya Station is a small monument with an outsized place in Japanese popular memory. Knowing the story transforms it from a crowded selfie point into a symbol of loyalty and of Shibuya itself.'],
            ['A little history','Hachiko was an Akita who met his owner at Shibuya Station. After his owner died suddenly in the 1920s, Hachiko continued returning to wait for him for roughly nine more years. The story spread nationally and Hachiko became an enduring symbol of faithfulness.'],
            ['Look for','The statue is physically modest compared with the crossing around it. Notice how it functions socially: it remains one of Tokyo’s best-known rendezvous points, with people constantly waiting nearby.'],
            ['How to experience it','Treat it as a two-minute story rather than a major stop. Read the story while standing there, look at the crowd using it as a meeting point, then continue into the crossing.'],
            ['Etiquette / sensitivity','The area is extremely busy. Keep the group together without blocking the meeting area for long photographs.'],
            ['One memorable story','The emotional power comes from repetition: after his owner never came home, Hachiko returned to the station day after day for years. That repeated act is why the story survived far beyond the dog’s lifetime.']]},
          {group:'Nonbei Yokocho', tag:'Priority A', rows:[
            ['Why it matters','Nonbei Yokocho shows a completely different scale of Tokyo from the crossing only metres away: tiny bars, narrow alleys, close conversation and Showa-era atmosphere pressed against the railway.'],
            ['A little history','Tokyo’s yokocho culture developed strongly in the post-war years as compact clusters for inexpensive food and drink. Nonbei Yokocho dates to the early 1950s and retains the intimate proportions associated with that period. Official Tokyo tourism lists 39 small bars and eateries there.'],
            ['Look for','Red lanterns, the width of the passageways, bars with only a handful of seats and the contrast between the alley and Shibuya’s giant commercial architecture.'],
            ['How to experience it','Go for one drink or small bite, not to “complete” the alley. The experience is the closeness: sitting beside locals in a room that may only hold four or five people.'],
            ['Etiquette / sensitivity','Space is limited. Some bars are not set up for large groups or English service. Order something if you enter, avoid using the alley only as a photo set, and do not linger when people are waiting for seats.'],
            ['One memorable story','Its survival beside one of the world’s most futuristic-looking intersections is the story: within a few steps, Shibuya can jump from giant screens and thousands of pedestrians to a bar where almost everyone inside can hear the same conversation.']]},
          {group:'Center-gai', rows:[
            ['Why it matters','Center-gai is one of the clearest street-level expressions of Shibuya’s youth culture: narrow, busy, retail-heavy and very different from the polished towers around the station.'],
            ['A little context','The pedestrian street became closely associated with youth fashion, music and nightlife as Shibuya developed into a major teen/young-adult cultural centre.'],
            ['Look for','Dense signage, fast-changing retail, arcades, casual food and the way crowds funnel from the crossing into much narrower streets.'],
            ['How to experience it','Walk through once as texture. It does not need its own stop or “achievement”; it is part of the cinematic movement from the crossing into Shibuya’s interior.'],
            ['Etiquette / sensitivity','Keep moving with pedestrian traffic; step into a side space before checking navigation.'],
            ['One memorable detail','The shift from the enormous open crossing to Center-gai’s compressed lane happens in under a minute — a good example of Tokyo’s rapid spatial changes.']]},
          {group:'Dogenzaka', rows:[
            ['Why it matters','Dogenzaka is the night-facing side of Shibuya and the practical bridge between karaoke, tiny bars and several club options. It gives the evening a darker, steeper and more intimate visual language.'],
            ['A little context','The slope west of Shibuya Station has long been associated with entertainment and nightlife. Today the area mixes restaurants, clubs, bars, hotels and newer redevelopment around the older street pattern.'],
            ['Look for','The literal incline, vertical signage, basement entrances and the transition away from the giant station screens.'],
            ['How to experience it','Use Dogenzaka as an atmospheric corridor. Explorer copy should say enough to heighten awareness — “the city goes underground here” — without naming the next club too early.'],
            ['Etiquette / sensitivity','Nightlife districts are still normal public streets. Be discreet around hotels and avoid photographing strangers at close range.'],
            ['One memorable detail','Many of Shibuya’s best-known music spaces are not visible from far away; basement doors and narrow staircases are part of the city’s club culture.']]},
          {group:'SHIBUYA SKY', rows:[
            ['Why it matters','This is the optional “zoom out” moment: after street-level overload, the city becomes a legible grid from 229 metres above Shibuya.'],
            ['A little context','SHIBUYA SKY opened as part of Shibuya Scramble Square and represents the district’s recent high-rise redevelopment. Its defining feature is the open-air rooftop rather than an enclosed classic observatory.'],
            ['Look for','The crossing from above, layered rail lines, the Shinjuku skyline and — in clear conditions — much wider views across Tokyo. The exposed rooftop makes weather part of the experience.'],
            ['How to experience it','Keep it genuinely optional. If the day is flowing well at street level, do not interrupt it just to “tick” an observation deck. If used, sunset/early night is the obvious cinematic slot, but those times sell out first.'],
            ['Etiquette / sensitivity','Large bags and loose items are restricted on the rooftop for safety; follow storage instructions and staff guidance.'],
