      wrapper.style.width = parentRect.width+'px';
      wrapper.style.height = parentRect.height+'px';
      wrapper.style.borderRadius = '0px';
      wrapper.style.boxShadow = 'none';
      screenEl.appendChild(wrapper);

      /* the flash keeps covering everything (still fully opaque) -- move it from the
         fixed overlay into a child of `wrapper` so it shrinks along with the box-morph
         below, same opacity throughout so there's no visible seam. */
      var flash = document.createElement('div');
      flash.className = 'stay-flash';
      flash.style.opacity = '1';
      wrapper.appendChild(flash);
      fixedFlash.remove();

      wrapper.getBoundingClientRect(); /* force reflow so the "from" (fullscreen) state is registered */
      wrapper.classList.add('opening'); /* reuse its box-morph transition timing */

      requestAnimationFrame(function(){
        wrapper.style.top = target.top+'px';
        wrapper.style.left = target.left+'px';
        wrapper.style.width = target.width+'px';
        wrapper.style.height = target.height+'px';
        wrapper.style.borderRadius = '20px';
      });

      setTimeout(function(){
        /* phase C: landed at the grid slot -- fade the flash out to reveal the
           card's own photo underneath, and bring its resting shadow back. */
        flash.style.transition = 'opacity '+STAY_PHASE_REVEAL+'ms ease';
        requestAnimationFrame(function(){ flash.style.opacity = '0'; });

        wrapper.style.transition = 'box-shadow .12s ease';
        wrapper.style.boxShadow = '0 16px 28px -12px rgba(0,0,0,.32), 0 5px 10px -4px rgba(0,0,0,.22)';
      }, STAY_PHASE_GROW);

      setTimeout(function(){
        state.screen='stays'; state.openStay=null; state.animating=false; state.sheetAbout=null;

        /* fold `wrapper` directly into the grid as its real card -- avoids a full
           render() swap for the same GPU-compositing/shimmer reason explained in
           closeDayFlip() */
        flash.remove();
        wrapper.className = 'stay-card' + (locked ? ' locked' : '');
        wrapper.style.position = '';
        wrapper.style.top = '';
        wrapper.style.left = '';
        wrapper.style.width = '';
        wrapper.style.height = '';
        wrapper.style.margin = '';
        wrapper.style.borderRadius = '';
        wrapper.style.transition = '';
        wrapper.style.zIndex = '';
        wrapper.style.boxShadow = '';
        wrapper.style.transform = '';

        var gridEl = bgEl.querySelector('.stays-grid');
        if(gridEl) gridEl.appendChild(wrapper);

        bgEl.style.pointerEvents = '';
        bgEl.style.zIndex = '';

        /* mirrors closeDayFlip()'s own refreshBtn/tabbar/updateStackClearance/
           saveProgress bypass-of-render() fix -- same reasoning */
        var refreshBtn = document.getElementById('refreshBtn');
        if(refreshBtn) refreshBtn.hidden = false;
        var tabbarEl = document.getElementById('tabbar');
        if(tabbarEl){
          tabbarEl.hidden = false;
          var tabExploreEl = document.getElementById('tabExplore');
          var tabStaysEl = document.getElementById('tabStays');
          if(tabExploreEl) tabExploreEl.classList.remove('on');
          if(tabStaysEl) tabStaysEl.classList.add('on');
          var tabbarIndicatorEl = document.getElementById('tabbarIndicator');
          if(tabbarIndicatorEl) tabbarIndicatorEl.classList.add('right');
        }
        updateStackClearance();
        saveProgress();

        wire();
      }, STAY_PHASE_GROW + STAY_PHASE_REVEAL + 70);
    }, STAY_PHASE_ZOOM);
  }

  /* ---------- shared handlers for the day-detail content (chapters, about, weather, back, reset) ---------- */
  function wireCommon(root){
    var back = root.querySelector('[data-back]');
    if(back) back.addEventListener('click', function(){ closeDayFlip(); });
    var stayBack = root.querySelector('[data-stay-back]');
    if(stayBack) stayBack.addEventListener('click', function(){ closeStayFlip(); });
    var reset = root.querySelector('[data-reset]');
    if(reset) reset.addEventListener('click', function(){ state.day2 = JSON.parse(JSON.stringify(DAY2)); state.confirmId=null; render(); });

    root.querySelectorAll('[data-here]').forEach(function(b){
      b.addEventListener('click', function(){ state.confirmId = b.getAttribute('data-here'); render(); });
    });
    root.querySelectorAll('[data-confirm-yes]').forEach(function(b){
      b.addEventListener('click', function(){ var id=b.getAttribute('data-confirm-yes'); state.confirmId=null; revealChapter(id); });
    });
    root.querySelectorAll('[data-confirm-no]').forEach(function(b){
      b.addEventListener('click', function(){ state.confirmId=null; render(); });
    });

    root.querySelectorAll('[data-about]').forEach(function(b){
      b.addEventListener('click', function(){
        state.sheetAbout = b.getAttribute('data-about');
        render();
      });
    });
    root.querySelectorAll('[data-sheet-close]').forEach(function(b){
      b.addEventListener('click', function(){ closeSheet(); });
    });
    /* a chapter's About sheet with more than one place (see aboutItemsHTML()) renders
       them as a collapsed list -- tapping one expands it and collapses whichever other
       one was open, one at a time. Toggled by directly mutating the existing DOM nodes
       (classList + measured max-height), the same technique the weather-cell accordion
       above already uses, rather than going through state+render() -- that keeps the
       CSS transition intact (a full render() would swap in a fresh, already-in-its-
       final-state node with nothing to visibly animate from) and means this needs no
       app-state field of its own; the open/closed state simply lives in the DOM for as
       long as the sheet itself does, and a fresh sheet always starts fully collapsed
       (see aboutItemsHTML()) since render() rebuilds the sheet's nodes from scratch. */
    root.querySelectorAll('[data-group-toggle]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var item = btn.closest('.about-group.collapsible');
        var collapse = item && item.querySelector('.about-group-collapse');
        var sheetBody = item && item.closest('.sheet-body');
        if(!item || !collapse || !sheetBody) return;
        var opening = !item.classList.contains('open');

        /* collapsing siblings ABOVE `item` in the list shrink over the same .3s
           transition as item's own expand -- which shifts item's own top position
           throughout that .3s, not just at the end. Measuring/scrolling too early
           (the original round-17 version did this on the very next animation frame)
           computed the target against item's pre-shift position, so the scroll landed
           partway into item's revealed content instead of at its header once the
           layout actually settled. Track whichever siblings are actually collapsing
           here and wait for their own max-height transition to finish before
           measuring anything, so the scroll target reflects the final, settled
           layout. */
        var collapsingOthers = [];
        sheetBody.querySelectorAll('.about-group.collapsible.open').forEach(function(other){
          if(other===item) return;
          other.classList.remove('open');
          var otherBtn = other.querySelector('[data-group-toggle]');
          if(otherBtn) otherBtn.setAttribute('aria-expanded','false');
          var otherCollapse = other.querySelector('.about-group-collapse');
          if(otherCollapse){
            otherCollapse.style.maxHeight = '0px';
            collapsingOthers.push(otherCollapse);
          }
        });

        item.classList.toggle('open', opening);
        btn.setAttribute('aria-expanded', String(opening));
        collapse.style.maxHeight = opening ? (collapse.scrollHeight+'px') : '0px';

        if(opening){
          /* scroll so the newly opened row's own header (the start of its now-visible
             content) is visible within the sheet's scroll box. Measured via
             getBoundingClientRect (not offsetTop) so it's correct regardless of which
             element ends up being the nearest positioned ancestor. */
          var scrolled = false;
          var doScroll = function(){
            if(scrolled) return;
            scrolled = true;
            var sbRect = sheetBody.getBoundingClientRect();
            var itemRect = item.getBoundingClientRect();
            var target = sheetBody.scrollTop + (itemRect.top - sbRect.top) - 8;
            sheetBody.scrollTo({ top:Math.max(0,target), behavior: reduceMotion ? 'auto' : 'smooth' });
          };
          if(reduceMotion || !collapsingOthers.length){
            /* nothing else is collapsing (item was the only thing changing height
               above the fold), or motion is reduced and nothing will animate at all
               -- either way item's position is already final, no need to wait. */
            requestAnimationFrame(doScroll);
          } else {
            var pending = collapsingOthers.length;
            collapsingOthers.forEach(function(el){
              var onEnd = function(ev){
                if(ev.target!==el || ev.propertyName!=='max-height') return;
                el.removeEventListener('transitionend', onEnd);
                pending--;
                if(pending<=0) doScroll();
              };
              el.addEventListener('transitionend', onEnd);
            });
            /* safety net in case a transitionend somehow never fires (e.g. the
               collapsing row had zero height to begin with, so no property actually
               changed) -- matches .about-group-collapse's own .3s transition. */
            setTimeout(doScroll, 350);
          }
        }
      });
    });
    var wc = root.querySelector('[data-weather]');
    if(wc) wc.addEventListener('click', function(){ wc.classList.toggle('open'); });
  }

  /* ---------- drag-to-browse + tap-to-flip-open on the home stack ---------- */
  function wireHome(){
    var el = document.getElementById('screen');
    /* tapping the compact hero (mark/title/date, up top) returns to the intro splash --
       round 9. Scoped safely here since wireHome() only ever runs while state.screen
       is 'home' (see wire() below), so this never fires for the intro screen's own
       (much bigger) hero, which has no tap behavior of its own -- only its CTA does. */
    var hero = el.querySelector('.home-hero');
    if(hero){
      hero.style.cursor = 'pointer';
      hero.addEventListener('click', function(){ goIntro(); });
    }
    el.querySelectorAll('.stack-card').forEach(function(b){
      b.addEventListener('pointerdown', function(e){
        if(state.animating || !b.classList.contains('is-front')) return;
        dragState.active = true;
        dragState.moved = false;
        dragState.startX = e.clientX;
        dragState.lastX = e.clientX;
        dragState.lastT = performance.now();
        dragState.vx = 0;
        dragState.el = b;
        b.classList.add('dragging');
        try{ b.setPointerCapture(e.pointerId); }catch(err){}
      });
      b.addEventListener('pointermove', function(e){
        if(!dragState.active || dragState.el!==b) return;
        if(e.cancelable) e.preventDefault(); /* belt-and-suspenders alongside touch-action:none above */
        var dx = e.clientX - dragState.startX;
        if(Math.abs(dx) > 6) dragState.moved = true;
        var now = performance.now();
        var dt = now - dragState.lastT;
        if(dt > 0) dragState.vx = (e.clientX - dragState.lastX) / dt;
        dragState.lastX = e.clientX; dragState.lastT = now;
        b.style.transform = 'translate(-50%,-50%) translateX('+dx+'px) rotate('+(dx/16)+'deg)';
      });
      function endDrag(e){
        if(!dragState.active || dragState.el!==b) return;
        dragState.active = false;
        b.classList.remove('dragging');
        var dx = (e.clientX!==undefined) ? (e.clientX - dragState.startX) : 0;
        var w = b.getBoundingClientRect().width || 260;
        var commit = Math.abs(dx) > w*0.3 || Math.abs(dragState.vx) > 0.55;
        var dir = dx < 0 ? 1 : -1;
        var target = state.stackIndex + dir;
        if(commit && target>=0 && target<=DAYS.length-1){
          state.stackIndex = target;
        }
        applyStack();
      }
      b.addEventListener('pointerup', endDrag);
      b.addEventListener('pointercancel', endDrag);
      b.addEventListener('click', function(){
        if(dragState.moved){ dragState.moved = false; return; }
        var idx = parseInt(b.getAttribute('data-idx'),10);
        if(idx===state.stackIndex){ openDayFlip(idx); } else { setFocus(idx); }
      });
    });
  }

  function wireIntro(){
    var el = document.getElementById('screen');
    var cta = el.querySelector('[data-start]');
    if(cta) cta.addEventListener('click', function(){ goHome(); });
  }

  /* ---------- Stays grid ---------- */
  function wireStays(){
    var el = document.getElementById('screen');
    el.querySelectorAll('.stay-card').forEach(function(b){
      if(b.classList.contains('locked')) return; /* no detail view for a stay that hasn't unlocked yet */
      b.addEventListener('click', function(){
        openStayFlip(b.getAttribute('data-stay'));
      });
    });
  }

  function wire(){
    var el = document.getElementById('screen');
    if(state.screen==='intro'){ wireIntro(); }
    else if(state.screen==='home'){ wireHome(); }
    else if(state.screen==='stays'){ wireStays(); wireCommon(el); }
    else { wireCommon(el); }
  }

  /* ---------- reload-latest button ---------- */
  (function wireRefresh(){
    var btn = document.getElementById('refreshBtn');
    if(!btn) return;
    btn.addEventListener('click', function(){
      btn.classList.add('spinning');
      /* a plain reload can still be served from the browser/CDN's HTTP cache; a
         unique query string forces a genuinely fresh network fetch of this file. */
      setTimeout(function(){
        location.replace(location.pathname + '?v=' + Date.now());
      }, 220);
    });
  })();

  /* ---------- bottom segmented control (Explorer / Stays) ----------
     Persistent sibling of #screen, wired once (not inside wire(), which reruns on
     every render()) -- same reasoning as wireRefresh() above. */
  (function wireTabbar(){
    var tabExplore = document.getElementById('tabExplore');
    var tabStays = document.getElementById('tabStays');
    if(tabExplore) tabExplore.addEventListener('click', function(){ goExplore(); });
    if(tabStays) tabStays.addEventListener('click', function(){ goStays(); });
  })();

  render();
})();
</script>
