<title>Japan Slowly</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- lets this be "installed" from the browser share/menu and launch full-screen off the
     home screen, like an app, instead of opening back into a browser tab -->
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japan Slowly">
<meta name="theme-color" content="#fafafa">
<style>
  /* ============================================================================
     DESIGN TOKENS — ported from the leve design system (src/index.css).
     Same semantic roles (surface/content/border/accent), same light+dark remap
     pattern, same radius/shadow scale and Outfit type family — with the accent
     hue swapped from leve's mint to a torii-red so the app still reads as
     distinctly "Japan Slowly" rather than a mint iOS app. Variable NAMES below
     are unchanged from the original file (--bg, --ink, --accent, etc.) so no
     other rule in this stylesheet needed to be touched. */
  :root{
    --bg:#fafafa;              /* was --color-surface-muted (page backdrop) */
    --bg-elevated:#ffffff;     /* was --color-surface (cards, sheets, bars) */
    --frame:#f3f3f3;           /* was --color-surface-sunken (insets) */
    --ink:#171717;             /* was --color-content (primary text) */
    --ink-soft:#767676;        /* was --color-content-secondary */
    --ink-faint:#a3a3a3;       /* was --color-content-muted */
    --accent:#d6432e;          /* torii vermillion, in place of leve's mint */
    --accent-soft:#e2694f;     /* lighter red — hover state */
    --reveal:#c08a2e;          /* warm gold, distinct 2nd accent (was rust) */
    --line:#efeff0;            /* was --color-border-field */
    --grain-opacity:.05;
    --stage-a:#ffffff;
    --stage-b:#f3f3f3;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#18181b;
      --bg-elevated:#1b1c1d;
      --frame:#161618;
      --ink:#e3e3e3;
      --ink-soft:#9c9c9c;
      --ink-faint:#7c7c81;
      --accent:#ff7a61;        /* brighter red pops on near-black, like leve's mint did */
      --accent-soft:#e85d42;   /* darker red — hover state */
      --reveal:#e3ac55;
      --line:#212121;
      --grain-opacity:.09;
      --stage-a:#18181b;
      --stage-b:#131315;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#18181b;
    --bg-elevated:#1b1c1d;
    --frame:#161618;
    --ink:#e3e3e3;
    --ink-soft:#9c9c9c;
    --ink-faint:#7c7c81;
    --accent:#ff7a61;
    --accent-soft:#e85d42;
    --reveal:#e3ac55;
    --line:#212121;
    --grain-opacity:.09;
    --stage-a:#18181b;
    --stage-b:#131315;
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  /* this used to sit inside a gallery mockup (a title/description header, decorative
     film-strip dots, a phone bezel) for presenting the prototype as a demo. now that
     the page is meant to be opened directly -- including as a home-screen app shortcut --
     it should just BE the app, full-bleed, with none of that outer chrome. */
  html, body{ height:100%; }
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Outfit',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    margin:0;
  }
  h1,h2,h3{ text-wrap:balance; margin:0; }
  .mono{ font-family:'Outfit',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; }

  /* ---- screen (fills the viewport; svh not dvh so a mobile browser's address bar
     showing/hiding doesn't resize -- and jump -- the whole layout) ---- */
  .screen{
    position:relative;
    width:100%;
    height:100svh;
    background:var(--bg);
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  .view{ position:absolute; inset:0; overflow-y:auto; display:flex; flex-direction:column; }
  .view::-webkit-scrollbar{ width:0; }

  /* ---- grain overlay ---- */
  .grain{ position:absolute; inset:0; pointer-events:none; opacity:var(--grain-opacity); mix-blend-mode:overlay; background-repeat:repeat; }

  /* ---- home stack ---- */
  .reel-head{
    padding:44px 20px 4px;
    display:flex; flex-direction:column; gap:2px;
  }
  .reel-head .wordmark{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:600; font-size:20px; letter-spacing:.01em; }
  .reel-head .range{ font-size:11.5px; color:var(--ink-faint); font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; letter-spacing:.03em; }
  .reel-note{ margin:8px 20px 0; font-size:11px; color:var(--ink-faint); }

  .stack-wrap{
    position:relative;
    flex:0 0 66%;
    min-height:280px;
    margin-top:6px;
    padding:2px 0 14px;
    /* was pan-y -- but a real finger drag is never perfectly horizontal, so the
       browser's own vertical-pan gesture kept hijacking the drag-to-browse
       gesture as a native scroll/bounce (fine on mouse/trackpad, broken on
       touch). This zone's only job is the custom horizontal drag below, so it
       should fully opt out of native panning instead of partially allowing it. */
    touch-action:none;
    perspective:1600px;
  }
  .stack-card{
    position:absolute;
    top:50%; left:50%;
    width:min(300px, 82%);
    height:100%;
    border-radius:22px;
    cursor:pointer;
    border:0; padding:0; margin:0; font:inherit; color:inherit; text-align:left;
    background:none;
    transition:transform .5s cubic-bezier(.22,.9,.32,1), opacity .5s ease, box-shadow .3s ease;
    box-shadow:0 22px 40px -18px rgba(0,0,0,.55);
    perspective:1600px;
    -webkit-tap-highlight-color:transparent;
  }
  .stack-card.dragging{ transition:none; cursor:grabbing; }
  /* box-shadow gets its own fast transition here so it can be snuffed out quickly the
     moment a card starts flipping (a huge fullscreen box with a small fixed-size card
     shadow looks wrong) and brought back in once it lands, without waiting on the much
     slower top/left/width/height box-morph */
  .stack-card.opening{ transition:top .52s cubic-bezier(.4,0,.2,1), left .52s cubic-bezier(.4,0,.2,1), width .52s cubic-bezier(.4,0,.2,1), height .52s cubic-bezier(.4,0,.2,1), border-radius .52s cubic-bezier(.4,0,.2,1), box-shadow .18s ease; }
  .flip-inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; transition:transform .56s cubic-bezier(.65,0,.35,1); border-radius:inherit; }
  .stack-card.flipped .flip-inner{ transform:rotateY(180deg); }
  .flip-face{ position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; overflow:hidden; border-radius:inherit; }
  .flip-back{ transform:rotateY(180deg); background:var(--bg); overflow-y:auto; }
  .flip-back::-webkit-scrollbar{ width:0; }
  /* clip-path (not overflow+border-radius) because a filtered descendant inside a
     preserve-3d ancestor (the flip) doesn't get clipped reliably by overflow:hidden
     in Chromium -- clip-path is a compositor-level clip and isn't affected */
  .stack-card .hero{ position:absolute; inset:0; border-radius:inherit; overflow:hidden; clip-path:inset(0 round 22px); -webkit-clip-path:inset(0 round 22px); }
  .stack-card.locked .hero{ filter:grayscale(1) blur(5px) brightness(.6) contrast(1.05); }
  .stack-card .shade{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0) 42%, rgba(0,0,0,.74) 100%); }
  .stack-card .content{ position:absolute; left:17px; right:17px; bottom:16px; color:#F3EEE1; opacity:0; transition:opacity .3s ease; }
  .stack-card.is-front .content{ opacity:1; }
  .stack-card .frame-no{ position:absolute; top:13px; right:15px; font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:9.5px; letter-spacing:.06em; color:rgba(243,238,225,.75); opacity:0; transition:opacity .3s; }
  .stack-card.is-front .frame-no{ opacity:1; }
  .stack-card .day-date{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:10.5px; letter-spacing:.08em; opacity:.85; text-transform:uppercase; }
  .stack-card .day-title{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:600; font-size:23px; margin-top:4px; }
  .stack-card .day-teaser{ font-size:12px; margin-top:5px; opacity:.92; line-height:1.4; }
  .stack-card .status-pill{
    position:absolute; top:13px; left:15px;
    font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:9px; letter-spacing:.08em;
    padding:3px 8px; border-radius:20px; text-transform:uppercase;
    background:rgba(0,0,0,.35); color:#F3EEE1;
    opacity:0; transition:opacity .3s;
  }
  .stack-card.is-front .status-pill{ opacity:1; }
  .stack-card.active .status-pill{ background:var(--reveal); color:#221208; }
  .stack-card:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* ---- day detail ---- */
  .dayhead{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 16px 8px; gap:8px; position:relative; z-index:5;
  }
  .backbtn{
    display:flex; align-items:center; gap:6px;
    background:none; border:0; color:var(--ink-soft); font:inherit; cursor:pointer;
    font-size:12.5px; padding:6px 4px;
  }
  .backbtn svg{ width:13px; height:13px; }
  .resetbtn{
    background:none; border:1px solid var(--line); color:var(--ink-faint);
    font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:10px; letter-spacing:.05em;
    padding:5px 9px; border-radius:20px; cursor:pointer; text-transform:uppercase;
  }
  .resetbtn:hover{ color:var(--ink-soft); border-color:var(--ink-faint); }

  .backhero-text{ padding:14px 20px 16px; border-bottom:1px solid var(--line); }
  .backhero-text .day-date{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); }
  .backhero-text .day-title{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:600; font-size:25px; margin-top:5px; color:var(--ink); }
  .backhero-text .day-title.hidden-title{ letter-spacing:.14em; opacity:.55; font-weight:500; font-size:17px; }
  .backhero-text .day-teaser{ font-size:13px; margin-top:6px; line-height:1.45; color:var(--ink-soft); }

  .lockednote{ margin:16px 20px 0; font-size:12px; color:var(--ink-faint); line-height:1.5; }
  .lockednote .mono{ color:var(--ink-soft); }

  /* ---- prep strip ---- */
  .prep{ margin:16px 16px 0; border:1px solid var(--line); border-radius:16px; background:var(--bg-elevated); }
  .prep-row{ display:grid; grid-template-columns:repeat(3,1fr); }
  .prep-cell{ padding:11px 10px; border-right:1px solid var(--line); border-bottom:1px solid var(--line); }
  .prep-cell:nth-child(3n){ border-right:0; }
  .prep-label{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:9px; letter-spacing:.08em; color:var(--ink-faint); text-transform:uppercase; }
  .prep-value{ font-size:12.5px; margin-top:3px; color:var(--ink); line-height:1.3; }
  .weather-cell{ grid-column:1 / -1; border-right:0; padding:0; cursor:pointer; }
  .weather-top{ display:flex; align-items:center; justify-content:space-between; padding:11px 12px; }
  .weather-left{ display:flex; align-items:center; gap:9px; }
  .weather-temp{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:15px; font-variant-numeric:tabular-nums; }
  .weather-cond{ font-size:11.5px; color:var(--ink-soft); }
  .weather-caret{ font-size:10px; color:var(--ink-faint); transition:transform .2s; }
  .weather-cell.open .weather-caret{ transform:rotate(180deg); }
  .hourly{ display:grid; grid-template-columns:repeat(6,1fr); gap:2px; padding:0 10px; max-height:0; overflow:hidden; transition:max-height .28s ease, padding .28s ease; border-top:1px solid var(--line); }
  .weather-cell.open .hourly{ max-height:100px; padding:10px 10px 12px; }
  .hr-tick{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .hr-tick .t{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:9px; color:var(--ink-faint); }
  .hr-tick .v{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:11px; font-variant-numeric:tabular-nums; }

  .lastupdate{ margin:10px 20px 0; font-size:10.5px; color:var(--ink-faint); font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; display:flex; align-items:center; gap:6px; }
  .lastupdate .dot{ width:5px; height:5px; border-radius:50%; background:#5C8A5C; flex:none; }

  /* ---- chapters ---- */
  .chapters{ margin:18px 16px 8px; display:flex; flex-direction:column; }
  .chapters-label{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:9.5px; letter-spacing:.1em; color:var(--ink-faint); text-transform:uppercase; margin-bottom:8px; }
  .chapter{ position:relative; border-top:1px solid var(--line); padding:13px 2px; overflow:hidden; }
  .chapter:last-child{ border-bottom:1px solid var(--line); }
  .chrow{ display:flex; gap:11px; align-items:flex-start; }
  .cmarker{ flex:none; width:9px; height:9px; border-radius:50%; margin-top:5px; border:1.5px solid var(--ink-faint); background:transparent; }
  .chapter.revealed .cmarker{ background:var(--accent); border-color:var(--accent); }
  .chapter.ontheway .cmarker{ border-color:var(--reveal); background:repeating-conic-gradient(var(--reveal) 0 180deg, transparent 0 360deg); }
  .cbody{ flex:1; min-width:0; }
  .ctitlerow{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
  .ctitle{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-weight:500; font-size:15.5px; }
  .ctitle.dim{ font-style:italic; color:var(--ink-faint); font-weight:400; }
  .ctag{ flex:none; font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:8.5px; letter-spacing:.05em; color:var(--ink-faint); border:1px solid var(--line); padding:1.5px 5px; border-radius:5px; }
  .cblurb{ font-size:12.5px; color:var(--ink-soft); margin-top:3px; line-height:1.42; }
  .cmeta{ font-size:11px; color:var(--ink-faint); margin-top:5px; font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; }

  .herebtn{
    margin-top:9px; display:inline-flex; align-items:center; gap:6px;
    background:var(--accent); color:var(--bg); border:0; border-radius:20px;
    font:inherit; font-size:12px; font-weight:500; padding:7px 14px; cursor:pointer;
  }
  .herebtn:hover{ background:var(--accent-soft); }
  .fallbacklink{ margin-top:8px; background:none; border:0; padding:0; font:inherit; font-size:11px; color:var(--ink-faint); text-decoration:underline; text-underline-offset:2px; cursor:pointer; display:block; }
  .fallbacklink:hover{ color:var(--ink-soft); }

  .confirmrow{ margin-top:9px; display:flex; flex-direction:column; gap:8px; background:var(--bg-elevated); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .confirmtext{ font-size:11.5px; color:var(--ink-soft); }
  .confirmbtns{ display:flex; gap:8px; }
  .confirmyes{ background:var(--accent); color:var(--bg); border:0; border-radius:16px; font:inherit; font-size:11.5px; font-weight:500; padding:6px 13px; cursor:pointer; }
  .confirmyes:hover{ background:var(--accent-soft); }
  .confirmno{ background:none; border:1px solid var(--line); color:var(--ink-faint); border-radius:16px; font:inherit; font-size:11.5px; padding:6px 13px; cursor:pointer; }
  .confirmno:hover{ color:var(--ink-soft); }

  .abouttoggle{ margin-top:9px; background:none; border:0; padding:0; font:inherit; font-size:11.5px; color:var(--accent); cursor:pointer; display:inline-flex; align-items:center; gap:4px; }
  .abouttoggle svg{ width:9px; height:9px; transition:transform .2s; }
  .abouttoggle.open svg{ transform:rotate(90deg); }
  .about{ max-height:0; overflow:hidden; transition:max-height .3s ease; }
  .about.open{ max-height:320px; }
  .about-inner{ padding-top:10px; display:flex; flex-direction:column; gap:8px; }
  .about-item .k{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:9px; letter-spacing:.07em; color:var(--reveal); text-transform:uppercase; }
  .about-item .v{ font-size:12px; color:var(--ink-soft); line-height:1.45; margin-top:2px; }

  @keyframes sweep{
    0%{ transform:translateX(-100%); }
    100%{ transform:translateX(200%); }
  }
  .chapter.justrevealed::before{
    content:''; position:absolute; inset:0; width:60%;
    background:linear-gradient(100deg, transparent, rgba(184,90,52,.22), transparent);
    animation:sweep .9s ease;
    pointer-events:none;
  }
  @media (prefers-reduced-motion: reduce){ .chapter.justrevealed::before{ animation:none; display:none; } }

  /* ---- tomorrow stub ---- */
  .tomorrow{ margin:6px 16px 26px; border:1px dashed var(--line); border-radius:14px; padding:13px 14px; }
  .tomorrow.ready{ border-style:solid; background:var(--bg-elevated); }
  .tomorrow-label{ font-family:'Outfit',ui-sans-serif,system-ui,sans-serif; font-size:9.5px; letter-spacing:.1em; color:var(--ink-faint); text-transform:uppercase; }
  .tomorrow-text{ font-size:12.5px; color:var(--ink-soft); margin-top:6px; line-height:1.45; }
  .tomorrow.ready .tomorrow-text{ color:var(--ink); }

  .journalflag{ margin:6px 20px 0; font-size:11px; color:var(--ink-faint); font-style:italic; }
</style>

<div class="screen" id="screen"></div>

<script>
(function(){

  /* ---------- noise texture ---------- */
  function noiseDataURL(size){
    var c=document.createElement('canvas'); c.width=c.height=size;
    var ctx=c.getContext('2d');
    var id=ctx.createImageData(size,size);
    for(var i=0;i<id.data.length;i+=4){
      var v=Math.floor(Math.random()*255);
      id.data[i]=v; id.data[i+1]=v; id.data[i+2]=v; id.data[i+3]=Math.random()*70;
    }
    ctx.putImageData(id,0,0);
    return c.toDataURL();
  }
  var NOISE = noiseDataURL(160);
  document.documentElement.style.setProperty('--noise','url('+NOISE+')');

  /* ---------- generative hero moods ---------- */
  var MOODS = {
    1:['#3B4A57','#8C6B4F','#D9A566'],
    2:['#241436','#B23D6B','#3FA6C9'],
    3:['#2E3B2C','#6E7A56','#B7B196'],
    4:['#26312A','#4C5F4B','#8C9A78'],
    5:['#2A2038','#7A4F3A','#C98A4B'],
    6:['#3A2620','#B4552E','#E8A24A'],
    7:['#331E33','#C0344F','#E8B23A'],
    8:['#1F2B22','#3F5C3D','#8FA37A'],
    9:['#2B3A4A','#6E8CAA','#CBD8DE'],
    10:['#3A2E33','#7A5A63','#C7A9A0']
  };

      '<div class="confirmbtns"><button class="confirmyes" data-confirm-yes="'+id+'">Yes, unlock</button>' +
      '<button class="confirmno" data-confirm-no="'+id+'">Not yet</button></div></div>';
  }

  function chapterBlock(ch, dayKey){
    var cls = 'chapter '+ch.state;
    var inner = '';
    var confirming = state.confirmId===ch.id;
    if(ch.state==='revealed'){
      inner = '<div class="ctitlerow"><div class="ctitle">'+ch.name+'</div><div class="ctag">'+ch.tag+'</div></div>' +
        '<div class="cblurb">'+ch.blurb+'</div>' +
        (ch.meta ? '<div class="cmeta">'+ch.meta+'</div>' : '') +
        aboutBlock(ch);
    } else if(ch.state==='ontheway'){
      inner = '<div class="ctitlerow"><div class="ctitle dim">Somewhere ahead</div><div class="ctag">'+ch.tag+'</div></div>' +
        '<div class="cblurb">'+ch.onway+'</div>' +
        (ch.tag==='LOC' ? (confirming ? confirmRow(ch.id) : '<button class="herebtn" data-here="'+ch.id+'">We’re here</button>') : '') +
        (ch.tag==='TIME' ? '<div class="cmeta">Unlocks at '+ch.targetTime+'</div>' + (confirming ? confirmRow(ch.id) : '<button class="fallbacklink" data-here="'+ch.id+'">Running early? Unlock now</button>') : '') +
        (ch.tag==='MAN' ? '<div class="cmeta" style="font-style:italic;">Manual reveal only — no traveller action opens this one.</div>' : '');
    } else {
      inner = '<div class="ctitlerow"><div class="ctitle dim">Hidden</div><div class="ctag">'+ch.tag+'</div></div>' +
        '<div class="cblurb" style="color:var(--ink-faint);">A clue, or nothing at all — yet.</div>';
    }
    return '<div class="'+cls+'" data-chapter="'+ch.id+'" data-daykey="'+dayKey+'"><div class="chrow"><div class="cmarker"></div><div class="cbody">'+inner+'</div></div></div>';
  }

  function dayDetailScreen(day, dayData, dayKey){
    var isJournal = day.status==='journal';
    var revealedCount = dayData ? dayData.chapters.filter(function(c){return c.state==='revealed';}).length : 0;
    var total = dayData ? dayData.chapters.length : 0;

    var html = '<div class="dayhead">' +
      '<button class="backbtn" data-back>'+backArrow+' The Reel</button>' +
      (dayKey==='day2' ? '<button class="resetbtn" data-reset>Reset demo</button>' : '<span></span>') +
      '</div>';

    var dayLocked = day.status==='locked';
    html += '<div class="backhero-text"><div class="day-date">'+day.date+' &middot; Day '+day.n+' of 10</div>' +
      (dayLocked ? '<div class="day-title hidden-title">Title withheld</div>' : '<div class="day-title">'+day.title+'</div>') +
      '<div class="day-teaser">'+day.teaser+'</div></div>';

    if(isJournal){
      html += '<div class="journalflag">Past day &middot; kept as trip journal &middot; fully unlocked</div>';
    } else if(dayKey==='day2'){
      html += '<div class="journalflag">In progress &middot; '+revealedCount+' of '+total+' chapters revealed</div>';
    }

    if(dayData){
      html += prepBlock(dayData);
      html += '<div class="lastupdate"><span class="dot"></span>Content last updated today · fetched automatically while online</div>';
      html += '<div class="chapters"><div class="chapters-label">Chapters</div>';
      html += dayData.chapters.map(function(c){ return chapterBlock(c, dayKey); }).join('');
      html += '</div>';

      var tready = dayData.tomorrowReady || (dayData.tomorrowGateChapter && dayData.chapters.filter(function(c){return c.id===dayData.tomorrowGateChapter && c.state==='revealed';}).length);
      html += '<div class="tomorrow '+(tready?'ready':'')+'">' +
        '<div class="tomorrow-label">Tomorrow</div>' +
        '<div class="tomorrow-text">'+(tready ? dayData.tomorrow : 'Unlocks near the end of the day.')+'</div>' +
      '</div>';
    } else {
      html += '<div class="lockednote">This day hasn’t opened yet. <span class="mono">Unlocks '+day.unlock+' at 00:01</span> — the app won’t push a notice, it’ll just be waiting next time you look.</div>';
    }

    return html;
  }

  /* a fixed (not re-randomized on every render) little tilt per day, so the deck reads as
     a naturally tossed pile rather than a mechanically even fan -- kept narrow (1-3deg)
     and, for now, only on the cards behind the front one. Front-card tilt is on hold
     until the deck-movement bug is sorted out, since it made that bug read worse. */
  var CARD_JITTER = [-2.1, 1.6, -1.3, 2.4, -1.8, 1.1, -2.6, 1.4, -1.9, 2.2];
  function cardJitter(idx){ return CARD_JITTER[idx % CARD_JITTER.length]; }

  function stackStyle(offset, idx){
    var a = Math.abs(offset);
    var tx = offset*24;
    var scale = Math.max(1 - a*0.05, 0.78);
    var rot = offset===0 ? 0 : offset*1.1 + cardJitter(idx||0);
    var op = a<=2 ? 1 : 0;
    var z = 100-a;
    var pe = a>2 ? 'none' : 'auto';
    return {tx:tx, scale:scale, rot:rot, op:op, z:z, pe:pe};
  }
  /* where the OTHER cards tuck to while one card opens/closes -- squared up into a
     perfectly neat, centered pile (no fan, no tilt) so there's real motion to see: the
     messy natural fan visibly straightens into a tidy stack on the way in, and on the
     way back out that tidy stack visibly un-stacks, spreading out into the fan again */
  function gatherStyle(offset, idx){
    var a = Math.abs(offset);
    return { tx: 0, scale: Math.max(0.93 - a*0.025, 0.84), rot: 0 };
  }
  function stackTransform(s){
    return 'translate(-50%,-50%) translateX('+s.tx+'px) scale('+s.scale+') rotate('+s.rot+'deg)';
  }

  function homeScreen(excludeIdx){
    var html = '<div class="reel-head"><div class="wordmark">Japan Slowly</div><div class="range mono">25 SEP &ndash; 4 OCT 2026</div></div>';
    html += '<div class="reel-note">Preview state: evening of Day 2, shown mid-experience for this demo. Drag to browse, tap to open.</div>';
    html += '<div class="stack-wrap" id="stackwrap">';
    DAYS.forEach(function(d, i){
      if(i===excludeIdx) return; /* that card is off being flipped elsewhere -- it doesn't belong in the deck yet */
      var offset = i - state.stackIndex;
      var s = stackStyle(offset, i);
      var locked = d.status==='locked';
      var styleStr = 'transform:'+stackTransform(s)+'; opacity:'+s.op+'; z-index:'+s.z+'; pointer-events:'+s.pe+';';
      html += '<button class="stack-card '+(locked?'locked':'')+' '+(d.status==='active'?'active':'')+' '+(offset===0?'is-front':'')+'" data-idx="'+i+'" style="'+styleStr+'">' +
        '<div class="flip-inner">' +
          '<div class="flip-face flip-front">' + stackCardFrontHTML(d) + '</div>' +
          '<div class="flip-face flip-back"></div>' +
        '</div>' +
      '</button>';
    });
    html += '</div>';
    return html;
  }

  /* shared front-face markup, reused by the home stack cards and by the
     transient flip element rebuilt for the reverse (close) animation */
  function stackCardFrontHTML(d){
    var locked = d.status==='locked';
    var pillText = d.status==='journal' ? 'Journal' : d.status==='active' ? 'In progress' : 'Locked';
    return '<div class="hero" style="'+heroStyle(d.n)+'"></div>' + grainDiv() + '<div class="shade"></div>' +
      '<div class="status-pill">'+pillText+'</div>' +
      '<div class="frame-no mono">#'+String(d.n).padStart(2,'0')+' / 10</div>' +
      '<div class="content">' +
        '<div class="day-date">'+d.date+'</div>' +
        (locked ? '<div class="day-title" style="font-style:italic;font-weight:400;font-size:16px;letter-spacing:.04em;opacity:.7;">Title withheld</div>' : '<div class="day-title">'+d.title+'</div>') +
        '<div class="day-teaser">'+d.teaser+'</div>' +
      '</div>';
  }

  function applyStack(){
    var wrap = document.getElementById('stackwrap');
    if(!wrap) return;
    wrap.querySelectorAll('.stack-card').forEach(function(el){
      var i = parseInt(el.getAttribute('data-idx'),10);
      var s = stackStyle(i - state.stackIndex, i);
      el.style.transform = stackTransform(s);
      el.style.opacity = s.op;
      el.style.zIndex = s.z;
      el.style.pointerEvents = s.pe;
      el.classList.toggle('is-front', i===state.stackIndex);
    });
  }

  function setFocus(i){
    i = Math.max(0, Math.min(DAYS.length-1, i));
    if(i===state.stackIndex) return;
    state.stackIndex = i;
    applyStack();
  }

  function render(){
    var el = document.getElementById('screen');
    var html = '<div class="view">';
    if(state.screen==='home'){
      html += homeScreen();
    } else {
      var day = DAYS.filter(function(d){return d.n===state.openDay;})[0];
      var dayData = day.n===1 ? DAY1 : day.n===2 ? state.day2 : null;
      var dayKey = day.n===1 ? 'day1' : day.n===2 ? 'day2' : null;
      html += dayDetailScreen(day, dayData, dayKey);
    }
    html += '</div>';
    el.innerHTML = html;
    wire();
  }

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function revealChapter(id){
    var ch = state.day2.chapters.filter(function(c){return c.id===id;})[0];
    if(!ch || ch.state==='revealed') return;
    ch.state = 'revealed';
    var idx = state.day2.chapters.indexOf(ch);
    var next = state.day2.chapters[idx+1];
    if(next && next.state==='hidden'){ next.state = 'ontheway'; }
    render();
    if(!reduceMotion){
      var row = document.querySelector('[data-chapter="'+id+'"]');
      if(row){ row.classList.add('justrevealed'); setTimeout(function(){ row.classList.remove('justrevealed'); }, 950); }
    }
  }

  /* ---------- open: flip the front card over while it grows to fill the screen ---------- */
  function openDayFlip(idx){
    if(state.animating) return;
    var day = DAYS[idx];
    if(reduceMotion){
      state.screen='day'; state.openDay=day.n; state.confirmId=null; render();
      return;
    }
    var screenEl = document.getElementById('screen');
    var cardEl = screenEl.querySelector('.stack-card[data-idx="'+idx+'"]');
    if(!cardEl){ state.screen='day'; state.openDay=day.n; render(); return; }

    state.animating = true;
    var dayData = day.n===1 ? DAY1 : day.n===2 ? state.day2 : null;
    var dayKey = day.n===1 ? 'day1' : day.n===2 ? 'day2' : null;
    var backEl = cardEl.querySelector('.flip-back');
    backEl.innerHTML = dayDetailScreen(day, dayData, dayKey);

    /* the focused card can carry a few degrees of tilt now, so getBoundingClientRect()
       (the axis-aligned box AROUND the rotated card, inflated by the rotation) is the
       wrong source for the "from" box -- it would make the card visibly pop larger the
       instant we cancel its rotation below. Its rotation-invariant CENTER point is still
       reliable, so pair that with the card's own unrotated layout size instead. */
    var aabb = cardEl.getBoundingClientRect();
    var w = cardEl.offsetWidth, h = cardEl.offsetHeight;
    var rect = { top: aabb.top + aabb.height/2 - h/2, left: aabb.left + aabb.width/2 - w/2, width: w, height: h };
    var parentRect = screenEl.getBoundingClientRect();

    /* cache where this card sits, so the close animation can morph the fullscreen
       view back down to this exact spot instead of guessing at a target */
    state.closeTargetRect = { top: rect.top-parentRect.top, left: rect.left-parentRect.left, width: rect.width, height: rect.height };
    state.closeIdx = idx;

    /* reparent into #screen so the containing block for the following top/left/width/height
       math is actually #screen (not .stack-wrap) -- otherwise the card jumps to the wrong frame */
    screenEl.appendChild(cardEl);

    cardEl.style.zIndex = 500;
    cardEl.style.top = (rect.top-parentRect.top)+'px';
    cardEl.style.left = (rect.left-parentRect.left)+'px';
    cardEl.style.width = rect.width+'px';
    cardEl.style.height = rect.height+'px';
    cardEl.style.margin = '0';
    cardEl.style.transform = 'none';
    cardEl.classList.add('opening');
    cardEl.getBoundingClientRect(); /* force reflow so the "from" box is registered */

    requestAnimationFrame(function(){
      cardEl.style.top = '0px';
      cardEl.style.left = '0px';
      cardEl.style.width = parentRect.width+'px';
      cardEl.style.height = parentRect.height+'px';
      cardEl.style.borderRadius = '0px';
      cardEl.style.boxShadow = 'none'; /* a fullscreen view doesn't read as a floating card -- drop its shadow fast */
      cardEl.classList.add('flipped');

      /* the rest of the stack gathers inward and downscales at the same time, tucking out
         of sight under the growing/flipping front card -- fully visible the whole time.
         Only the SHADOW fades out fast: with several cards bunched close together their
         shadows piled into a smeared, detached-looking blob, so shadows drop out quickly
         while they're gathered and only reappear once the deck is spaced out again. */
      screenEl.querySelectorAll('#stackwrap .stack-card').forEach(function(el){
        var i = parseInt(el.getAttribute('data-idx'),10);
        el.style.transition = 'transform .5s cubic-bezier(.22,.9,.32,1), box-shadow .16s ease';
        el.style.transform = stackTransform(gatherStyle(i - state.stackIndex, i));
        el.style.boxShadow = 'none';
      });
    });

    setTimeout(function(){
      state.screen='day'; state.openDay=day.n; state.animating=false;
      render();
    }, 580);
  }

  /* ---------- close: the true reverse of open -- unflip back to the photo while shrinking
     in place to the exact spot the card sits in the stack ---------- */
  function closeDayFlip(){
    if(reduceMotion){ state.screen='home'; state.confirmId=null; render(); return; }
    var screenEl = document.getElementById('screen');
    var viewEl = screenEl.querySelector('.view');
    var target = state.closeTargetRect;
    var day = DAYS[state.closeIdx];
    if(!viewEl || !target || !day || state.animating){ state.screen='home'; state.confirmId=null; render(); return; }
    state.animating = true;

    var parentRect = screenEl.getBoundingClientRect();
    var locked = day.status==='locked';

    /* rebuild the rest of the stack behind everything, gathered exactly the way
       openDayFlip left it -- fully visible, just compact -- and it spreads back out to
       its resting fan as the final part of this animation, timed with the front card
       landing back in its slot. Only the shadows start hidden: bunched together they'd
       pile into a smeared blob, so they stay off until the deck is spaced out again. */
    var bgEl = document.createElement('div');
    bgEl.className = 'view';
    bgEl.style.pointerEvents = 'none';
    bgEl.style.zIndex = 400;
    bgEl.innerHTML = homeScreen(state.closeIdx); /* the flipping card itself is excluded -- it doesn't rejoin the deck until it lands */
    screenEl.appendChild(bgEl);
    bgEl.querySelectorAll('.stack-card').forEach(function(el){
      var i = parseInt(el.getAttribute('data-idx'),10);
      el.style.transition = 'none';
      el.style.transform = stackTransform(gatherStyle(i - state.stackIndex, i));
      el.style.boxShadow = 'none';
    });
    bgEl.getBoundingClientRect(); /* force reflow so the gathered "from" state is registered */

    /* rebuild a transient flip element: the live view (still fully up to date --
       revealed chapters, expanded panels, etc.) becomes the back face, and a fresh
       front face carries that day's photo, exactly mirroring what openDayFlip built */
    var wrapper = document.createElement('div');
    /* match every class homeScreen() would give this card (not just 'locked') --
       otherwise anything status-driven (like the pill's colored background for
       'active' days) is missing for the whole animation and only appears the
       instant render() swaps this transient wrapper for the real card, which
       reads as a jump/pop right at the end */
    wrapper.className = 'stack-card flipped is-front closing' + (locked ? ' locked' : '') + (day.status==='active' ? ' active' : '');
    wrapper.style.position = 'absolute';
    wrapper.style.margin = '0';
    wrapper.style.zIndex = 500;
    wrapper.style.top = '0px';
    wrapper.style.left = '0px';
    wrapper.style.width = parentRect.width+'px';
    wrapper.style.height = parentRect.height+'px';
    wrapper.style.borderRadius = '0px';
    wrapper.style.boxShadow = 'none'; /* a fullscreen view doesn't need a card shadow -- comes back once it lands */

    var flipInner = document.createElement('div');
    flipInner.className = 'flip-inner';
    var flipFront = document.createElement('div');
    flipFront.className = 'flip-face flip-front';
    flipFront.innerHTML = stackCardFrontHTML(day);
    var flipBack = document.createElement('div');
    flipBack.className = 'flip-face flip-back';
    flipBack.appendChild(viewEl); /* reparents the live, still-wired view -- no content is lost */

    flipInner.appendChild(flipFront);
    flipInner.appendChild(flipBack);
    wrapper.appendChild(flipInner);
    screenEl.appendChild(wrapper);

    wrapper.getBoundingClientRect(); /* force reflow so the "from" (fullscreen, flipped) state is registered */
    wrapper.classList.add('opening'); /* reuse its box-morph transition timing */

    requestAnimationFrame(function(){
      wrapper.style.top = target.top+'px';
      wrapper.style.left = target.left+'px';
      wrapper.style.width = target.width+'px';
      wrapper.style.height = target.height+'px';
      wrapper.style.borderRadius = '22px';
      wrapper.classList.remove('flipped'); /* flip-inner transitions rotateY(180deg) -> 0 */
    });

    /* the rest of the deck holds still, gathered and compact, while the card is still
       mid-flip -- it only spreads back out to its resting fan right at the end, timed to
       finish exactly as the card lands, so the deck visibly "reassembles" around it. */
    var finishClose;
    setTimeout(function(){
      var cards = bgEl.querySelectorAll('.stack-card');
      cards.forEach(function(el){
        var i = parseInt(el.getAttribute('data-idx'),10);
        el.style.transition = 'transform .48s cubic-bezier(.22,.9,.32,1), box-shadow .3s ease';
        el.style.transform = stackTransform(stackStyle(i - state.stackIndex, i));
        el.style.boxShadow = '0 22px 40px -18px rgba(0,0,0,.55)';
      });

      /* the final DOM swap used to be pinned to a flat setTimeout(820) that assumed this
         .48s spread-out transition (started here, at the 300ms mark) would always be fully
         finished by then -- a 40ms margin between two independently-scheduled timers. Under
         any real jank (a busy tab, a screen recorder, a slower machine) the swap could fire
         a beat before the deck actually finished sliding into its resting fan, snapping the
         still-moving side cards straight to their final spots -- exactly the "offset
         movement" tied to the deck spreading back out. Waiting for the real transitionend
         (with a generous fallback timer in case it never fires) removes the race instead of
         just padding it. */
      var watchEl = cards[0];
      if(watchEl){
        watchEl.addEventListener('transitionend', function onEnd(e){
          if(e.propertyName !== 'transform') return;
          watchEl.removeEventListener('transitionend', onEnd);
          finishClose();
        });
      }
      setTimeout(finishClose, 650); /* .48s transition + a generous safety margin */
    }, 300);

    /* the landing card's own shadow waits until it has essentially finished settling into
       place (the box-morph is a .52s transition) before popping back in quickly -- fading
       it in earlier, while the card was still visibly mid-motion, read as premature */
    setTimeout(function(){
      wrapper.style.transition = 'box-shadow .12s ease';
      wrapper.style.boxShadow = '0 22px 40px -18px rgba(0,0,0,.55)';
    }, 560);

    var closeFinished = false;
    finishClose = function(){
      if(closeFinished) return;
      closeFinished = true;
      state.screen='home'; state.confirmId=null; state.animating=false;

      /* rather than the usual render() -- which throws away every element in #screen and
         builds fresh ones from scratch -- fold `wrapper` directly into the deck as its real
         front card. A full render() here was the actual cause of the lingering "jump": even
         though the freshly-built card lands at the exact same pixel rect (verified), it's a
         BRAND NEW element replacing one the browser had been continuously transitioning and
         compositing on its own layer. Swapping a GPU-composited, continuously-transformed
         element for a freshly laid-out static one makes the browser re-rasterize its text and
         photo edges at a very slightly different subpixel offset -- invisible as a still
         image, but a visible one-frame "shimmer" across the whole card in motion. Reusing the
         same DOM node end to end removes the swap (and the shimmer) entirely. */
      var idx = state.closeIdx;
      var day = DAYS[idx];
      var s = stackStyle(idx - state.stackIndex, idx);
      var locked = day.status==='locked';

      var flipBackEl = wrapper.querySelector('.flip-back');
      /* the old detail view's DOM is done with -- its state (revealed chapters, etc.) lives
         in `state.day2`, not here, so this is safe to drop; openDayFlip rebuilds it fresh
         from that state next time this day is opened, exactly like every other card. */
      if(flipBackEl) flipBackEl.innerHTML = '';

      wrapper.className = 'stack-card' + (locked ? ' locked' : '') + (day.status==='active' ? ' active' : '') + ' is-front';
      wrapper.setAttribute('data-idx', idx);
      wrapper.setAttribute('role', 'button');
      wrapper.tabIndex = 0;
      /* clear every inline override the box-morph used (top/left/width/height/margin/
         z-index/border-radius/transition) so the card falls back to the same CSS-driven
         position:absolute;top:50%;left:50% + transform recipe every other deck card uses */
      wrapper.style.position = '';
      wrapper.style.top = '';
      wrapper.style.left = '';
      wrapper.style.width = '';
      wrapper.style.height = '';
      wrapper.style.margin = '';
      wrapper.style.borderRadius = '';
      wrapper.style.transition = '';
      wrapper.style.zIndex = String(s.z);
      wrapper.style.opacity = String(s.op);
      wrapper.style.pointerEvents = s.pe;
      wrapper.style.boxShadow = '0 22px 40px -18px rgba(0,0,0,.55)';
      wrapper.style.transform = stackTransform(s);

      var stackwrapEl = bgEl.querySelector('#stackwrap');
      if(stackwrapEl) stackwrapEl.appendChild(wrapper);

      /* bgEl was just a decoy layer sitting behind the animating card -- promote it to
         being the real, live view now that the card has rejoined it */
      bgEl.style.pointerEvents = '';
      bgEl.style.zIndex = '';

      wire();
    };
  }

  /* ---------- shared handlers for the day-detail content (chapters, about, weather, back, reset) ---------- */
  function wireCommon(root){
    var back = root.querySelector('[data-back]');
    if(back) back.addEventListener('click', function(){ closeDayFlip(); });
    var reset = root.querySelector('[data-reset]');
    if(reset) reset.addEventListener('click', function(){ state.day2 = JSON.parse(JSON.stringify(DAY2)); state.confirmId=null; render(); });

    root.querySelectorAll('[data-here]').forEach(function(b){
      b.addEventListener('click', function(){ state.confirmId = b.getAttribute('data-here'); render(); });
    });
    root.querySelectorAll('[data-confirm-yes]').forEach(function(b){
      b.addEventListener('click', function(){ var id=b.getAttribute('data-confirm-yes'); state.confirmId=null; revealChapter(id); });
    });
    root.querySelectorAll('[data-confirm-no]').forEach(function(b){
      b.addEventListener('click', function(){ state.confirmId=null; render(); });
    });

    root.querySelectorAll('[data-about]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.getAttribute('data-about');
        var panel = document.getElementById('about-'+id);
        var open = panel.classList.toggle('open');
        b.classList.toggle('open', open);
      });
    });
    var wc = root.querySelector('[data-weather]');
    if(wc) wc.addEventListener('click', function(){ wc.classList.toggle('open'); });
  }

  /* ---------- drag-to-browse + tap-to-flip-open on the home stack ---------- */
  function wireHome(){
    var el = document.getElementById('screen');
    el.querySelectorAll('.stack-card').forEach(function(b){
      b.addEventListener('pointerdown', function(e){
        if(state.animating || !b.classList.contains('is-front')) return;
        dragState.active = true;
        dragState.moved = false;
        dragState.startX = e.clientX;
        dragState.lastX = e.clientX;
        dragState.lastT = performance.now();
        dragState.vx = 0;
        dragState.el = b;
        b.classList.add('dragging');
        try{ b.setPointerCapture(e.pointerId); }catch(err){}
      });
      b.addEventListener('pointermove', function(e){
        if(!dragState.active || dragState.el!==b) return;
        if(e.cancelable) e.preventDefault(); /* belt-and-suspenders alongside touch-action:none above */
        var dx = e.clientX - dragState.startX;
        if(Math.abs(dx) > 6) dragState.moved = true;
        var now = performance.now();
        var dt = now - dragState.lastT;
        if(dt > 0) dragState.vx = (e.clientX - dragState.lastX) / dt;
        dragState.lastX = e.clientX; dragState.lastT = now;
        b.style.transform = 'translate(-50%,-50%) translateX('+dx+'px) rotate('+(dx/16)+'deg)';
      });
      function endDrag(e){
        if(!dragState.active || dragState.el!==b) return;
        dragState.active = false;
        b.classList.remove('dragging');
        var dx = (e.clientX!==undefined) ? (e.clientX - dragState.startX) : 0;
        var w = b.getBoundingClientRect().width || 260;
        var commit = Math.abs(dx) > w*0.3 || Math.abs(dragState.vx) > 0.55;
        var dir = dx < 0 ? 1 : -1;
        var target = state.stackIndex + dir;
        if(commit && target>=0 && target<=DAYS.length-1){
          state.stackIndex = target;
        }
        applyStack();
      }
      b.addEventListener('pointerup', endDrag);
      b.addEventListener('pointercancel', endDrag);
      b.addEventListener('click', function(){
        if(dragState.moved){ dragState.moved = false; return; }
        var idx = parseInt(b.getAttribute('data-idx'),10);
        if(idx===state.stackIndex){ openDayFlip(idx); } else { setFocus(idx); }
      });
    });
  }

  function wire(){
    var el = document.getElementById('screen');
    if(state.screen==='home'){ wireHome(); } else { wireCommon(el); }
  }

  render();
})();
</script>
