    flipBack.appendChild(viewEl); /* reparents the live, still-wired view -- no content is lost */

    flipInner.appendChild(flipFront);
    flipInner.appendChild(flipBack);
    wrapper.appendChild(flipInner);
    screenEl.appendChild(wrapper);

    wrapper.getBoundingClientRect(); /* force reflow so the "from" (fullscreen, flipped) state is registered */
    wrapper.classList.add('opening'); /* reuse its box-morph transition timing */

    requestAnimationFrame(function(){
      wrapper.style.top = target.top+'px';
      wrapper.style.left = target.left+'px';
      wrapper.style.width = target.width+'px';
      wrapper.style.height = target.height+'px';
      wrapper.style.borderRadius = '22px';
      wrapper.classList.remove('flipped'); /* flip-inner transitions rotateY(180deg) -> 0 */
    });

    /* the rest of the deck holds still, gathered and compact, while the card is still
       mid-flip -- it only spreads back out to its resting fan right at the end, timed to
       finish exactly as the card lands, so the deck visibly "reassembles" around it. */
    var finishClose;
    setTimeout(function(){
      var cards = bgEl.querySelectorAll('.stack-card');
      cards.forEach(function(el){
        var i = parseInt(el.getAttribute('data-idx'),10);
        el.style.transition = 'transform .48s cubic-bezier(.22,.9,.32,1), box-shadow .3s ease';
        el.style.transform = stackTransform(stackStyle(i - state.stackIndex, i));
        el.style.boxShadow = '0 22px 40px -18px rgba(0,0,0,.55)';
      });

      /* the final DOM swap used to be pinned to a flat setTimeout(820) that assumed this
         .48s spread-out transition (started here, at the 300ms mark) would always be fully
         finished by then -- a 40ms margin between two independently-scheduled timers. Under
         any real jank (a busy tab, a screen recorder, a slower machine) the swap could fire
         a beat before the deck actually finished sliding into its resting fan, snapping the
         still-moving side cards straight to their final spots -- exactly the "offset
         movement" tied to the deck spreading back out. Waiting for the real transitionend
         (with a generous fallback timer in case it never fires) removes the race instead of
         just padding it. */
      var watchEl = cards[0];
      if(watchEl){
        watchEl.addEventListener('transitionend', function onEnd(e){
          if(e.propertyName !== 'transform') return;
          watchEl.removeEventListener('transitionend', onEnd);
          finishClose();
        });
      }
      setTimeout(finishClose, 650); /* .48s transition + a generous safety margin */
    }, 300);

    /* the landing card's own shadow waits until it has essentially finished settling into
       place (the box-morph is a .52s transition) before popping back in quickly -- fading
       it in earlier, while the card was still visibly mid-motion, read as premature */
    setTimeout(function(){
      wrapper.style.transition = 'box-shadow .12s ease';
      wrapper.style.boxShadow = '0 22px 40px -18px rgba(0,0,0,.55)';
    }, 560);

    var closeFinished = false;
    finishClose = function(){
      if(closeFinished) return;
      closeFinished = true;
      state.screen='home'; state.confirming=null; state.animating=false; state.sheetAbout=null;

      /* rather than the usual render() -- which throws away every element in #screen and
         builds fresh ones from scratch -- fold `wrapper` directly into the deck as its real
         front card. A full render() here was the actual cause of the lingering "jump": even
         though the freshly-built card lands at the exact same pixel rect (verified), it's a
         BRAND NEW element replacing one the browser had been continuously transitioning and
         compositing on its own layer. Swapping a GPU-composited, continuously-transformed
         element for a freshly laid-out static one makes the browser re-rasterize its text and
         photo edges at a very slightly different subpixel offset -- invisible as a still
         image, but a visible one-frame "shimmer" across the whole card in motion. Reusing the
         same DOM node end to end removes the swap (and the shimmer) entirely. */
      var idx = state.closeIdx;
      var day = DAYS[idx];
      var s = stackStyle(idx - state.stackIndex, idx);
      var locked = day.status==='locked';

      var flipBackEl = wrapper.querySelector('.flip-back');
      /* the old detail view's DOM is done with -- its state (revealed chapters, etc.) lives
         in `state.dayProgress`, not here, so this is safe to drop; openDayFlip rebuilds it fresh
         from that state next time this day is opened, exactly like every other card. */
      if(flipBackEl) flipBackEl.innerHTML = '';

      wrapper.className = 'stack-card' + (locked ? ' locked' : '') + (day.status==='active' ? ' active' : '') + ' is-front';
      wrapper.setAttribute('data-idx', idx);
      wrapper.setAttribute('role', 'button');
      wrapper.tabIndex = 0;
      /* clear every inline override the box-morph used (top/left/width/height/margin/
         z-index/border-radius/transition) so the card falls back to the same CSS-driven
         position:absolute;top:50%;left:50% + transform recipe every other deck card uses */
      wrapper.style.position = '';
      wrapper.style.top = '';
      wrapper.style.left = '';
      wrapper.style.width = '';
      wrapper.style.height = '';
      wrapper.style.margin = '';
      wrapper.style.borderRadius = '';
      wrapper.style.transition = '';
      wrapper.style.zIndex = String(s.z);
      wrapper.style.opacity = String(s.op);
      wrapper.style.pointerEvents = s.pe;
      wrapper.style.boxShadow = '0 22px 40px -18px rgba(0,0,0,.55)';
      wrapper.style.transform = stackTransform(s);

      var stackwrapEl = bgEl.querySelector('#stackwrap');
      if(stackwrapEl) stackwrapEl.appendChild(wrapper);

      /* bgEl was just a decoy layer sitting behind the animating card -- promote it to
         being the real, live view now that the card has rejoined it */
      bgEl.style.pointerEvents = '';
      bgEl.style.zIndex = '';

      /* finishClose() deliberately folds `wrapper` into the deck instead of calling
         render() (see the comment above) -- but render() is also the ONLY place that
         toggles #refreshBtn's/#tabbar's [hidden] state for the current screen, so
         bypassing it here left the reload button permanently hidden after the very
         first day-detail visit (round 17's real bug fix): openDayFlip's render() call
         hid it on the way in, and nothing ever un-hid it on the way back out, since
         this path never runs that logic again. The round-19 tabbar has the exact same
         problem and needs the exact same fix -- mirror render()'s own rules directly
         rather than calling render() itself. */
      var refreshBtn = document.getElementById('refreshBtn');
      if(refreshBtn) refreshBtn.hidden = false; /* state.screen is always 'home' by the time we get here */
      var tabbarEl = document.getElementById('tabbar');
      if(tabbarEl){
        tabbarEl.hidden = false;
        var tabExploreEl = document.getElementById('tabExplore');
        var tabStaysEl = document.getElementById('tabStays');
        if(tabExploreEl) tabExploreEl.classList.add('on');
        if(tabStaysEl) tabStaysEl.classList.remove('on');
        var tabbarIndicatorEl = document.getElementById('tabbarIndicator');
        if(tabbarIndicatorEl) tabbarIndicatorEl.classList.remove('right'); /* state.screen is always 'home' by the time we get here */
      }
      /* same bypass-of-render() reasoning as the refreshBtn/tabbar fix directly above --
         render() is also the only place that normally calls saveProgress()/
         updateStackClearance(), so this path (closing a day back to home) needs its
         own explicit calls or a reload right after closing a day would silently resume
         with stale screen/openDay progress and an un-recalculated card clearance. */
      updateStackClearance();
      saveProgress();

      wire();
    };
  }

  /* ---------- Stays: the detail slides up from the bottom, and slides back down on close ---------- */
  function openStay(stayId){
    if(state.animating) return;
    var st = STAYS.filter(function(x){ return x.id===stayId; })[0];
    if(!st || stayLocked(st)) return;
    state.screen = 'stayDetail'; state.openStay = st.id; state.sheetAbout = null;
    state.staySlideNew = !reduceMotion;
    render();
  }
  function closeStay(){
    if(state.animating) return;
    var slide = document.querySelector('.stay-slide');
    function done(){ state.screen='stays'; state.openStay=null; state.sheetAbout=null; state.animating=false; render(); }
    if(!slide || reduceMotion){ done(); return; }
    state.animating = true;
    slide.classList.remove('open');
    var finished = false;
    function fin(ev){
      if(finished || (ev && ev.target!==slide)) return;
      finished = true; slide.removeEventListener('transitionend', fin); done();
    }
    slide.addEventListener('transitionend', fin);
    setTimeout(fin, 600); /* fallback if transitionend never fires */
  }

  /* ---------- shared handlers for the day-detail content (chapters, about, weather, back, reset) ---------- */
  var guideTaps = [];
  /* Guide Mode on/off: re-evaluates which days and stays are open, and steps back out of a
     day or stay that has just become locked (guide switched off). */
  function toggleGuide(){
    state.guide = !state.guide;
    applyStatuses();
    if(state.screen==='day'){
      var od = DAYS.filter(function(d){ return d.n===state.openDay; })[0];
      if(!od || od.status==='locked'){ state.screen='home'; state.openDay=null; }
    } else if(state.screen==='stayDetail'){
      var os = STAYS.filter(function(x){ return x.id===state.openStay; })[0];
      if(!os || stayLocked(os)){ state.screen='stays'; state.openStay=null; }
    }
    state.sheetAbout = null;
    state.confirming = null;
    render();
  }
  function wireCommon(root){
    var gTitle = (state.screen==='day') ? root.querySelector('.view-daycards .day-title') : null;
    if(gTitle) gTitle.addEventListener('click', function(){
      var now = Date.now();
      guideTaps = guideTaps.filter(function(t){ return now - t < 800; });
      guideTaps.push(now);
      if(guideTaps.length >= 3){ guideTaps = []; toggleGuide(); }
    });
    var back = root.querySelector('[data-back]');
    if(back) back.addEventListener('click', function(){ closeDayFlip(); });
    var stayBack = root.querySelector('[data-stay-back]');
    if(stayBack) stayBack.addEventListener('click', function(){ closeStay(); });
    /* ---- day cards (see the "day cards: the chapter engine" comment) ---- */
    var dcReset = root.querySelector('[data-dc-reset]');
    if(dcReset) dcReset.addEventListener('click', function(){
      /* Guide Mode is a chain: resetting a day also resets every day after it, which locks them again */
      Object.keys(state.dayProgress).forEach(function(k){ if(parseInt(k,10) >= state.openDay) delete state.dayProgress[k]; });
      state.confirming=null; state.scrollToEnd=false; render();
    });
    root.querySelectorAll('[data-dc-ask]').forEach(function(b){
      b.addEventListener('click', function(){ state.confirming = b.getAttribute('data-dc-ask'); render(); });
    });
    root.querySelectorAll('[data-dc-cancel]').forEach(function(b){
      b.addEventListener('click', function(){ state.confirming = null; render(); });
    });
    root.querySelectorAll('[data-dc-yes]').forEach(function(b){
      b.addEventListener('click', function(){ if(b.getAttribute('data-dc-yes')==='here') dcArrive(); else dcAdvance(); });
    });
    root.querySelectorAll('[data-dc-skip]').forEach(function(b){ b.addEventListener('click', dcSkip); });
    root.querySelectorAll('[data-dc-tip]').forEach(function(b){
      b.addEventListener('click', function(){
        var day = DAYS.filter(function(d){ return d.n===state.openDay; })[0];
        var data = dayDataFor(day); if(!data) return;
        var id = b.getAttribute('data-dc-tip');
        var p = dayProg(day.n);
        p.tip[id] = (b.getAttribute('aria-expanded')==='true'); /* open now -> collapse it; collapsed now -> open it */
        render();
      });
    });
    root.querySelectorAll('[data-dc-check]').forEach(function(inp){
      inp.addEventListener('change', function(){
        var parts = inp.getAttribute('data-dc-check').split('|');
        var p = dayProg(state.openDay);
        var arr = p.checks[parts[0]] || (p.checks[parts[0]] = []);
        arr[parseInt(parts[1],10)] = inp.checked;
        render();
      });
    });
    root.querySelectorAll('[data-dc-open]').forEach(function(b){
      b.addEventListener('click', function(){ state.sheetAbout = b.getAttribute('data-dc-open'); render(); });
    });
    root.querySelectorAll('[data-dc-essential]').forEach(function(b){
      b.addEventListener('click', function(){ state.sheetAbout = 'essential'; render(); });
    });
    root.querySelectorAll('[data-dc-dot]').forEach(function(b){
      b.addEventListener('click', function(){
        var car = root.querySelector('.dc-carousel'); if(!car) return;
        var cards = car.querySelectorAll('.dc-card');
        var card = cards[parseInt(b.getAttribute('data-dc-dot'),10)]; if(!card) return;
        car.scrollTo({ left: card.offsetLeft - 24, behavior: reduceMotion ? 'auto' : 'smooth' });
      });
    });
    var dcCar = root.querySelector('.dc-carousel');
    if(dcCar){
      var dcRaf = false;
      dcCar.addEventListener('scroll', function(){
        if(dcRaf) return; dcRaf = true;
        requestAnimationFrame(function(){ dcRaf = false; dcSyncDots(root); });
      }, { passive:true });
    }
    root.querySelectorAll('[data-sheet-close]').forEach(function(b){
      b.addEventListener('click', function(){ closeSheet(); });
    });
    /* a chapter's About sheet with more than one place (see aboutItemsHTML()) renders
       them as a collapsed list -- tapping one expands it and collapses whichever other
       one was open, one at a time. Toggled by directly mutating the existing DOM nodes
       (classList + measured max-height), the same technique the weather-cell accordion
       above already uses, rather than going through state+render() -- that keeps the
       CSS transition intact (a full render() would swap in a fresh, already-in-its-
       final-state node with nothing to visibly animate from) and means this needs no
       app-state field of its own; the open/closed state simply lives in the DOM for as
       long as the sheet itself does, and a fresh sheet always starts fully collapsed
       (see aboutItemsHTML()) since render() rebuilds the sheet's nodes from scratch. */
    root.querySelectorAll('[data-group-toggle]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var item = btn.closest('.about-group.collapsible');
        var collapse = item && item.querySelector('.about-group-collapse');
        var sheetBody = item && item.closest('.sheet-body');
        if(!item || !collapse || !sheetBody) return;
        var opening = !item.classList.contains('open');

        /* collapsing siblings ABOVE `item` in the list shrink over the same .3s
           transition as item's own expand -- which shifts item's own top position
           throughout that .3s, not just at the end. Measuring/scrolling too early
           (the original round-17 version did this on the very next animation frame)
           computed the target against item's pre-shift position, so the scroll landed
           partway into item's revealed content instead of at its header once the
           layout actually settled. Track whichever siblings are actually collapsing
           here and wait for their own max-height transition to finish before
           measuring anything, so the scroll target reflects the final, settled
           layout. */
        var collapsingOthers = [];
        sheetBody.querySelectorAll('.about-group.collapsible.open').forEach(function(other){
          if(other===item) return;
          other.classList.remove('open');
          var otherBtn = other.querySelector('[data-group-toggle]');
          if(otherBtn) otherBtn.setAttribute('aria-expanded','false');
          var otherCollapse = other.querySelector('.about-group-collapse');
          if(otherCollapse){
            otherCollapse.style.maxHeight = '0px';
            collapsingOthers.push(otherCollapse);
          }
        });

        item.classList.toggle('open', opening);
        btn.setAttribute('aria-expanded', String(opening));
        collapse.style.maxHeight = opening ? (collapse.scrollHeight+'px') : '0px';

        if(opening){
          /* scroll so the newly opened row's own header (the start of its now-visible
             content) is visible within the sheet's scroll box. Measured via
             getBoundingClientRect (not offsetTop) so it's correct regardless of which
             element ends up being the nearest positioned ancestor. */
          var scrolled = false;
          var doScroll = function(){
            if(scrolled) return;
            scrolled = true;
            var sbRect = sheetBody.getBoundingClientRect();
            var itemRect = item.getBoundingClientRect();
            var target = sheetBody.scrollTop + (itemRect.top - sbRect.top) - 8;
            sheetBody.scrollTo({ top:Math.max(0,target), behavior: reduceMotion ? 'auto' : 'smooth' });
          };
          if(reduceMotion || !collapsingOthers.length){
            /* nothing else is collapsing (item was the only thing changing height
               above the fold), or motion is reduced and nothing will animate at all
               -- either way item's position is already final, no need to wait. */
            requestAnimationFrame(doScroll);
          } else {
            var pending = collapsingOthers.length;
            collapsingOthers.forEach(function(el){
              var onEnd = function(ev){
                if(ev.target!==el || ev.propertyName!=='max-height') return;
                el.removeEventListener('transitionend', onEnd);
                pending--;
                if(pending<=0) doScroll();
              };
              el.addEventListener('transitionend', onEnd);
            });
            /* safety net in case a transitionend somehow never fires (e.g. the
               collapsing row had zero height to begin with, so no property actually
               changed) -- matches .about-group-collapse's own .3s transition. */
            setTimeout(doScroll, 350);
          }
        }
      });
    });
  }

  /* ---------- drag-to-browse + tap-to-flip-open on the home stack ---------- */
  function wireHome(){
    var el = document.getElementById('screen');
    /* tapping the compact hero (mark/title/date, up top) returns to the intro splash --
       round 9. Scoped safely here since wireHome() only ever runs while state.screen
       is 'home' (see wire() below), so this never fires for the intro screen's own
       (much bigger) hero, which has no tap behavior of its own -- only its CTA does. */
    var hero = el.querySelector('.home-hero');
    if(hero){
      hero.style.cursor = 'pointer';
      hero.addEventListener('click', function(){ goIntro(); });
      /* Guide Mode entry point: three quick taps on the date line under the wordmark */
      var heroRange = hero.querySelector('.range');
      if(heroRange) heroRange.addEventListener('click', function(e){
        e.stopPropagation();
        var now = Date.now();
        guideTaps = guideTaps.filter(function(t){ return now - t < 800; });
        guideTaps.push(now);
        if(guideTaps.length >= 3){ guideTaps = []; toggleGuide(); }
      });
    }
    el.querySelectorAll('.stack-card').forEach(function(b){
      b.addEventListener('pointerdown', function(e){
        if(state.animating || !b.classList.contains('is-front')) return;
        dragState.active = true;
        dragState.moved = false;
        dragState.startX = e.clientX;
        dragState.lastX = e.clientX;
        dragState.lastT = performance.now();
        dragState.vx = 0;
        dragState.el = b;
        b.classList.add('dragging');
        try{ b.setPointerCapture(e.pointerId); }catch(err){}
      });
      var dragRafPending = false;
      function applyDragTransform(){
        dragRafPending = false;
        if(!dragState.active || dragState.el!==b) return;
        var dx = dragState.dx;
        b.style.transform = 'translate3d(-50%,-50%,0) translateX('+dx+'px) rotate('+(dx/16)+'deg)';
      }
      b.addEventListener('pointermove', function(e){
        if(!dragState.active || dragState.el!==b) return;
        if(e.cancelable) e.preventDefault(); /* belt-and-suspenders alongside touch-action:none above */
        var dx = e.clientX - dragState.startX;
        if(Math.abs(dx) > 6) dragState.moved = true;
        var now = performance.now();
        var dt = now - dragState.lastT;
        if(dt > 0) dragState.vx = (e.clientX - dragState.lastX) / dt;
        dragState.lastX = e.clientX; dragState.lastT = now;
        /* round 27: batch the actual style write to one per animation frame --
           pointermove can fire far more often than the screen repaints (especially
           on touch), and writing transform synchronously on every single event was
           forcing the browser to redo layout/filter/compositing work that many times
           per frame instead of once. Storing dx and flushing via rAF coalesces that
           down to the display's real refresh rate, which is the fix for the
           dragging-feels-laggy-while-everything-else-is-smooth symptom -- the drag
           itself was always fine, it was the redundant extra work between frames. */
        dragState.dx = dx;
        if(!dragRafPending){ dragRafPending = true; requestAnimationFrame(applyDragTransform); }
      });
      function endDrag(e){
        if(!dragState.active || dragState.el!==b) return;
        dragState.active = false;
        b.classList.remove('dragging');
        var dx = (e.clientX!==undefined) ? (e.clientX - dragState.startX) : 0;
        var w = b.getBoundingClientRect().width || 260;
        var commit = Math.abs(dx) > w*0.3 || Math.abs(dragState.vx) > 0.55;
        var dir = dx < 0 ? 1 : -1;
        var target = state.stackIndex + dir;
        if(commit && target>=0 && target<=deckLast()){
          state.stackIndex = target;
        }
        applyStack();
      }
      b.addEventListener('pointerup', endDrag);
      b.addEventListener('pointercancel', endDrag);
      b.addEventListener('click', function(){
        if(dragState.moved){ dragState.moved = false; return; }
        var idx = parseInt(b.getAttribute('data-idx'),10);
        if(idx===state.stackIndex){ if(!DAYS[idx].extra) openDayFlip(idx); } else { setFocus(idx); }
      });
    });
  }

  function wireIntro(){
    var el = document.getElementById('screen');
    var cta = el.querySelector('[data-start]');
    if(cta) cta.addEventListener('click', function(){ goHome(); });
  }

  /* ---------- Stays grid ---------- */
  function wireStays(){
    var el = document.getElementById('screen');
    el.querySelectorAll('.stay-card').forEach(function(b){
      if(b.classList.contains('locked')) return; /* no detail view for a stay that hasn't unlocked yet */
      b.addEventListener('click', function(){
        openStay(b.getAttribute('data-stay'));
      });
    });
  }

  function wire(){
    var el = document.getElementById('screen');
    if(state.screen==='intro'){ wireIntro(); }
    else if(state.screen==='home'){ wireHome(); }
    else if(state.screen==='stays'){ wireStays(); wireCommon(el); }
    else { wireCommon(el); }
  }

  /* ---------- reload-latest button ---------- */
  (function wireRefresh(){
    var btn = document.getElementById('refreshBtn');
    if(!btn) return;
    btn.addEventListener('click', function(){
      btn.classList.add('spinning');
      /* a plain reload can still be served from the browser/CDN's HTTP cache; a
         unique query string forces a genuinely fresh network fetch of this file. */
      setTimeout(function(){
        location.replace(location.pathname + '?v=' + Date.now());
      }, 220);
    });
  })();

  /* ---------- bottom segmented control (Explorer / Stays) ----------
     Persistent sibling of #screen, wired once (not inside wire(), which reruns on
     every render()) -- same reasoning as wireRefresh() above. */
  (function wireTabbar(){
    var tabExplore = document.getElementById('tabExplore');
    var tabStays = document.getElementById('tabStays');
    if(tabExplore) tabExplore.addEventListener('click', function(){ goExplore(); });
    if(tabStays) tabStays.addEventListener('click', function(){ goStays(); });
  })();

  /* keep the locks honest while the app is open: re-check the clock every 30 s and when the
     app comes back to the foreground; refresh the forecast whenever there is a connection */
  var lastClockSig = clockSignature();
  function clockTick(){
    applyStatuses();
    var sig = clockSignature();
    if(sig === lastClockSig) return;
    lastClockSig = sig;
    if(state.animating) return;
    if(state.screen==='day'){
      var td = DAYS.filter(function(d){ return d.n===state.openDay; })[0];
      if(!td || td.status==='locked'){ state.screen='home'; state.openDay=null; }
    }
    render();
  }
  setInterval(clockTick, 30000);
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible'){ clockTick(); refreshWeather(false); }
  });
  window.addEventListener('online', function(){ refreshWeather(true); });
  setInterval(function(){ refreshWeather(false); }, 30*60*1000);
  refreshWeather(false);

  render();
})();
</script>
<script>
  /* offline support (round 27): registers sw.js, which precaches the app shell
     plus every day/stay photo so the whole thing works with zero connection
     once it's been opened at least once. See sw.js's own comments for the
     network-first-for-HTML / cache-first-for-images strategy -- kept in its
     own tiny script tag, separate from the big IIFE above, since it has
     nothing to do with app state and there's no reason to risk it. */
  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(err){
        console.warn('[sw] registration failed:', err);
      });
    });
  }
</script>
